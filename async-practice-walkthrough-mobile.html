<title>Async Practice Walkthrough — Mobile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="tessera/tokens.css">
<link rel="stylesheet" href="tessera/bundle.css">
<style>
/* End-to-end mobile flow for the Tessera async assessment (UX-1224): onboarding, the live
   assessment with sample questions, and the wrap-up, on Chrome for Android and Safari on iPhone.

   Layout concept: a scaled phone on a neutral stage. Inside it every screen is the same frame:
   the Tessera top bar, a scrolling body, and a fixed footer that holds every call to action at
   full width. Camera screens go full page, with the top bar and footer laid over the picture.

   Built on the real Tessera components (window.TesseraDS). Nothing here uses a colour or size
   that is not a Tessera token, except the simulated browser chrome, the browser's own permission
   dialogs, and the sample camera picture. The structure follows the approved wireframe; the V8
   Test Taker Experience and Proctoring Attendee frames are the style and layout reference.

   Light mode only: the app sits under data-theme="light", so a viewer's dark setting cannot flip
   the tokens. */
:root{ --stage-bg:#d4d4d8; color-scheme:light }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:row;font-family:var(--font-sans);font-size:14px;line-height:20px;color:var(--text-body);background:var(--stage-bg);-webkit-font-smoothing:antialiased}
#root{display:flex;flex:1;min-width:0;height:100%}
.app{display:flex;flex:1;min-width:0;height:100%}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

/* ---------- Stage and phone frame ---------- */
.stage{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#phone{position:absolute;left:50%;top:50%;width:var(--pw);height:var(--ph);margin:calc(var(--ph) / -2) 0 0 calc(var(--pw) / -2);
  transform:scale(var(--k,1));transform-origin:50% 50%;background:#000;border-radius:38px;
  box-shadow:0 10px 50px rgba(0,0,0,.28),0 0 0 11px #18181b,0 0 0 12px #3f3f46;overflow:hidden}
#frame{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg-surface);overflow:hidden}

/* Simulated browser chrome. Android matches the Figma frames (dark Chrome); iPhone draws Safari. */
.a-chrome{flex:none;background:#202124;color:#e8eaed;font:500 12px/1 var(--font-sans)}
.a-status{display:flex;align-items:center;justify-content:space-between;height:26px;padding:0 18px}
.a-url{display:flex;align-items:center;gap:8px;padding:2px 10px 8px}
.a-pill{flex:1;min-width:0;display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:999px;background:#3c4043;font:400 13px/1 var(--font-sans);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.a-btn{flex:none;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:#e8eaed}
.a-tabs{width:20px;height:20px;border:1.6px solid #e8eaed;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font:600 11px/1 var(--font-sans)}
.a-nav{flex:none;height:18px;background:var(--bg-surface);display:flex;align-items:center;justify-content:center}
.a-nav span{width:106px;height:4px;border-radius:2px;background:#18181b;opacity:.75}
.notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:108px;height:27px;border-radius:999px;background:#000;z-index:3}
.i-status{flex:none;display:flex;align-items:flex-end;justify-content:space-between;height:46px;padding:0 24px 6px;background:var(--bg-surface);font:600 14px/1 var(--font-sans);color:var(--text-primary)}
.i-bottom{flex:none;background:var(--bg-surface);border-top:1px solid var(--border-subtle)}
.i-url{display:flex;align-items:center;gap:8px;padding:6px 10px}
.i-field{flex:1;min-width:0;display:flex;align-items:center;gap:7px;height:34px;padding:0 10px;border-radius:999px;background:var(--bg-elevated);font:400 12px/18px var(--font-sans);color:var(--text-body)}
.i-aa{font:500 15px/1 var(--font-sans);letter-spacing:-.02em;padding:0 4px;color:var(--text-primary)}
.i-aa b{font-size:11px;font-weight:500}
.i-home{height:22px;display:flex;align-items:flex-start;justify-content:center;padding-top:4px}
.i-home span{width:134px;height:5px;border-radius:3px;background:#18181b;opacity:.85}

/* ---------- The page frame: top bar, body, fixed footer ---------- */
#viewport{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;background:var(--bg-surface)}
.topstack{flex:none;position:relative;z-index:6}
.topstack .ts-candidate-top-nav__timer-row{min-height:51px;align-items:center}
#view{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}

/* One spacing system on every screen: 16 around the page and the footer, 16 between blocks,
   8 between a title and its text, 12 inside a card. */
.pg{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg-surface)}
.pg-body{flex:1;min-height:0;overflow:auto;padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-4)}
.pg-body>*{flex-shrink:0}
.pg-body.mid{justify-content:center}
/* Camera screens: the top bar and the footer stay solid; the camera fills the space between. */
.pg-body.cam{padding:0;gap:0;overflow:hidden;position:relative;background:var(--bg-tooltip)}
.pg-foot{flex:none;display:grid;gap:var(--space-2);padding:var(--space-4);background:var(--bg-surface);border-top:1px solid var(--border-subtle)}
.pg-foot .note{margin:0;text-align:center}
.foot-link{display:flex;justify-content:center}
.head{display:grid;gap:var(--space-2)}
.head-row{display:flex;align-items:center;gap:var(--space-2)}
.head-row svg{flex:none;color:var(--success-strong)}
/* Two sentences in a centred block: one per line. */
.lines{display:grid;gap:0}
.lines span{display:block}
.bullets{margin:0;padding-left:var(--space-5);display:grid;gap:var(--space-2);color:var(--text-body)}
.bullets b{font-weight:500;color:var(--text-primary)}
.head h1,.head p,.pg-body p{margin:0}
.ttl{margin:0;color:var(--text-primary)}
.ttl.err{color:var(--error-emphasis)}
.muted{color:var(--text-subtle)}
.centre{display:flex;flex-direction:column;align-items:center;gap:var(--space-4);text-align:center}
.centre>*{margin:0}
.mark{flex:none;width:48px;height:48px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;background:var(--bg-accent);color:var(--interactive-link)}
.mark.err{background:var(--error-surface);color:var(--error-emphasis)}
.steps{margin:0;padding-left:var(--space-5);display:grid;gap:var(--space-2);color:var(--text-body)}
.steps b{font-weight:500;color:var(--text-primary)}
.checklist{list-style:none;margin:0;padding:0;width:fit-content;max-width:100%;text-align:left}
.checklist li{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) 0;color:var(--text-primary)}
.checklist li.pend{color:var(--text-subtle)}
.checklist li.done svg{color:var(--success-strong)}
.dot{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border-primary)}
.art{flex:none;display:flex;align-items:center;justify-content:center;padding:var(--space-4);border-radius:var(--radius-xl);background:var(--bg-muted)}
.art svg{display:block;width:100%;max-width:296px;height:auto}
.status-line{display:flex;align-items:flex-start;gap:var(--space-2);font:500 14px/20px var(--font-sans);color:var(--text-body)}
.status-line.ok{color:var(--success-strong)}
.status-line.late{color:var(--warning-emphasis)}
.status-line.bad{color:var(--error-emphasis)}
.status-line svg{flex:none;margin-top:2px}

/* ---------- Device rows ---------- */
.drows{display:grid;gap:var(--space-2)}
.drow{display:flex;align-items:center;gap:var(--space-3)}
/* The device field, as in the Test Taker file: the device icon sits inside the field, then the
   name and a chevron. Tapping it opens a bottom sheet, not a desktop listbox. */
.devsel{flex:1;min-width:0;display:flex;align-items:center;gap:var(--space-2);height:36px;padding:0 var(--space-2);border:1px solid var(--border-primary);border-radius:var(--radius-lg);
  background:var(--bg-surface);color:var(--text-primary);font:inherit;text-align:left;cursor:pointer;transition:border-color var(--duration-fast) var(--ease-out)}
.devsel:hover{border-color:var(--border-strong)}
.devsel:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.devsel[aria-expanded="true"]{border-color:var(--interactive-primary)}
.devsel>svg{flex:none;color:var(--text-subtle)}
.devsel>svg:last-child{color:var(--text-body)}
.devsel-val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-layer{position:absolute;inset:0;z-index:40}
.sheet-layer.edge{bottom:-18px}   /* Chrome draws the page edge to edge, behind the gesture bar */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:1001;background:var(--bg-surface);border-radius:var(--radius-2xl) var(--radius-2xl) 0 0;box-shadow:var(--shadow-xl);
  padding:var(--space-2) var(--space-4) var(--space-4);display:grid;gap:var(--space-2);
  animation:sheet-in var(--duration-moderate) var(--ease-out) both}
.sheet[data-state="closed"]{transform:translateY(100%);transition:transform var(--duration-base) var(--ease-in)}
.sheet-layer.edge .sheet{padding-bottom:calc(var(--space-2) + 18px)}
.sheet-grip{justify-self:center;width:36px;height:4px;border-radius:var(--radius-full);background:var(--border-primary)}
.sheet-home{position:absolute;left:50%;bottom:7px;width:106px;height:4px;margin-left:-53px;border-radius:2px;background:#18181b;opacity:.75}
.sheet-head{display:flex;align-items:center;justify-content:space-between}
.sheet .ts-radio-group__items{display:grid;gap:0}
.sheet .ts-radio{min-height:48px;display:flex;align-items:center;border-bottom:1px solid var(--border-subtle)}
.sheet .ts-radio:last-child{border-bottom:0}
@keyframes sheet-in{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){
  .sheet{animation:fade-in var(--duration-fast) linear both}
  .sheet[data-state="closed"]{transform:none;opacity:0;transition:opacity var(--duration-fast) linear}
}
@keyframes fade-in{from{opacity:0}to{opacity:1}}

/* ---------- Video ---------- */
.vcard{position:relative;flex:1;min-height:176px;border-radius:var(--radius-lg);overflow:hidden;background:var(--bg-tooltip);isolation:isolate}
/* Tessera's Modal, contained in the phone: the panel fits the screen less 16px a side. */
#view .ts-modal--contained{z-index:1002;grid-template-columns:minmax(0,1fr)}
#view .ts-modal__panel{width:100%}
.vmedia{position:absolute;inset:0}
.vmedia.hidden{visibility:hidden}
.vmedia video,.vmedia canvas,.vmedia img{display:block;width:100%;height:100%;object-fit:cover}
.vmedia video.mirror{transform:scaleX(-1)}
.vmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-2);padding:var(--space-6);text-align:center;color:var(--text-on-primary)}
.vtop{position:absolute;left:var(--space-3);right:var(--space-3);top:var(--space-3);display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);z-index:2}
.pill{display:inline-flex;align-items:center;gap:var(--space-1);background:var(--bg-surface);border-radius:var(--radius-full);padding:0 var(--space-2);min-height:28px}
.livedot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--error-strong);box-shadow:0 0 0 3px rgba(255,255,255,.55)}
.vstrip{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-2) var(--space-3);
  background:var(--bg-overlay-primary);color:var(--text-on-primary);
  --text-tertiary:var(--text-on-primary);--text-primary:var(--text-on-primary);--interactive-link:var(--blue-300)}
.vstrip .grp{display:flex;align-items:center;gap:var(--space-2);min-width:0}
.vctl{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:var(--space-6) var(--space-2) var(--space-1);display:grid;gap:var(--space-1);
  background:linear-gradient(180deg,transparent,var(--bg-overlay-primary) 45%);color:var(--text-on-primary);--text-primary:var(--text-on-primary);--text-tertiary:var(--blue-200)}
.vctl-track{height:4px;margin:0 var(--space-2);border-radius:var(--radius-full);background:rgba(255,255,255,.3);overflow:hidden}
.vctl-track span{display:block;height:100%;background:var(--interactive-primary);border-radius:inherit}
.vctl-row{display:flex;align-items:center;gap:var(--space-1)}
.vctl-row .ts-candidate-clock{margin-left:var(--space-1)}
.vcenter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;pointer-events:none}
.vcenter>*{pointer-events:auto}
.camtop{position:absolute;left:var(--space-4);right:var(--space-4);top:var(--space-4);display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);z-index:4}
.camcard{position:absolute;left:var(--space-4);right:var(--space-4);bottom:var(--space-4);z-index:4}
.float{background:var(--bg-surface);border-radius:var(--radius-xl);padding:var(--space-4);box-shadow:var(--shadow-lg);display:grid;gap:var(--space-2)}
.float p{margin:0}
.wavebar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-2) var(--space-3);border-radius:var(--radius-lg);background:var(--bg-muted);color:var(--text-primary)}
/* The question text is always full strength: expanding it must not change its colour. */
.qtext{margin:0;color:var(--text-primary)}
.qtext .ts-text-link,.qtext button{display:inline;white-space:nowrap}

/* ---------- The assessment card, as in the Test Taker file ---------- */
.qcard{background:var(--bg-muted);border:1px solid var(--border-subtle);border-radius:var(--radius-xl);display:flex;flex-direction:column;min-height:0}
.qcard-head{display:flex;align-items:center;min-height:44px;padding:0 var(--space-3);border-bottom:1px solid var(--border-subtle);color:var(--text-primary)}
.qcard .bullets{gap:var(--space-1)}
.qcard .vcard{flex:none;aspect-ratio:4/3;min-height:0}
.qcard-body{padding:var(--space-3);display:grid;gap:var(--space-3)}
.qcard-body p{margin:0}
.infobox{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:var(--space-3);display:grid;gap:var(--space-1)}
.infobox p{margin:0}
.clip{position:relative;flex:none;aspect-ratio:16/10;width:100%;border-radius:var(--radius-lg);overflow:hidden;background:var(--bg-tooltip);isolation:isolate}
.clip canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* Captions sit inside the video, above the controls. */
.caption{position:absolute;left:var(--space-3);right:var(--space-3);bottom:68px;z-index:2;display:flex;justify-content:center;pointer-events:none}
.caption span{padding:var(--space-1) var(--space-2);border-radius:var(--radius-sm);background:var(--bg-overlay-primary);color:var(--text-on-primary);text-align:center}
/* The review player's saving states cover the picture, as on web. */
.vstate{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-3);padding:var(--space-6);text-align:center;color:var(--text-on-primary);background:var(--bg-tooltip)}
.vstate.note{background:var(--bg-overlay-primary);bottom:68px}
.vstate p{margin:0}

/* The preparation countdown on the button: a darker blue fills left to right as the time runs out. */
@property --fill{syntax:'<percentage>';inherits:true;initial-value:0%}
.prepfill{--fill:0%;transition:--fill 1s linear}
.prepfill .ts-button--primary{background:linear-gradient(90deg,var(--interactive-click) var(--fill),var(--interactive-primary) var(--fill))}
.prepfill .ts-button--primary:hover:not(:disabled){background:linear-gradient(90deg,var(--interactive-click) var(--fill),var(--interactive-hover) var(--fill))}
.prepbar{display:grid;gap:var(--space-1)}

/* ---------- Wrap-up cards, as in the Test Taker file ---------- */
.wcard{background:var(--bg-muted);border:1px solid var(--border-subtle);border-radius:var(--radius-xl);padding:var(--space-4) var(--space-3);display:flex;flex-direction:column;gap:var(--space-6)}
.pg-body>.wcard{flex:1 0 auto}
.wcard{position:relative}
.wcard .wt{display:grid;gap:var(--space-2)}
.wcard .wt p{margin:0}
.wcard .wt.mid{text-align:center}
.fig{position:relative;width:100%}
.fig img{display:block;width:100%;height:100%}
.fig-flat{display:block;width:100%;height:auto}
.score-n{font:600 30px/38px var(--font-sans);color:var(--text-tertiary)}
.bars{position:relative;flex:none;width:300px;max-width:100%;height:240px;margin:0 auto;background:var(--bg-surface);border-radius:6px;box-shadow:0 1.5px 18.75px rgba(125,125,125,.12);overflow:hidden}
.bars img{position:absolute;display:block;width:36.75px;height:151.5px;top:27.75px}
.bars .lab{position:absolute;top:183.75px;display:flex;flex-direction:column;align-items:center;gap:.75px;font-size:9px;line-height:13.5px;text-align:center}
.bars .lab b{font-weight:500;color:var(--text-primary)}
.bars .lab span{color:var(--text-tertiary)}
.cert{display:block;width:100%;height:auto;border-radius:var(--radius-sm)}
.acts{display:grid;justify-items:start;gap:var(--space-1)}
.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.rate{display:flex;justify-content:space-between;gap:var(--space-1)}
.rate button{flex:1 1 0;min-width:0;display:grid;justify-items:center;gap:var(--space-1);padding:var(--space-2);border:1px solid var(--border-subtle);border-radius:6px;background:var(--bg-surface);color:var(--text-primary);font:400 10px/14px var(--font-sans);cursor:pointer;text-align:center}
.rate button img{width:32px;height:32px;display:block}
.rate button[aria-checked="true"]{border-color:var(--interactive-link);background:var(--bg-accent)}
.rate button:focus-visible{outline:2px solid var(--interactive-link);outline-offset:2px}
.tags{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.skel{display:grid;gap:var(--space-3)}

/* ---------- The browser's own permission dialogs (not Tessera: drawn after the platform) ---------- */
.scrim{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(0,0,0,.45)}
.dlg-site{width:100%;max-width:300px;background:#fff;border-radius:28px;padding:22px 22px 12px;box-shadow:0 16px 48px rgba(0,0,0,.3);color:#1f1f1f}
.dlg-site .ico{display:flex;gap:6px;color:#444746;margin-bottom:12px}
.dlg-site p{margin:0;font:400 16px/22px var(--font-sans)}
.dlg-site .acts{display:flex;justify-content:flex-end;gap:4px;margin-top:16px}
.dlg-site .acts button,.dlg-os .acts button{min-height:44px;padding:0 14px;border:0;border-radius:999px;background:none;color:#0b57d0;font:500 14px/1 var(--font-sans);cursor:pointer}
.dlg-site .acts button:hover,.dlg-os .acts button:hover{background:#e8f0fe}
.dlg-os{width:100%;max-width:300px;background:#fff;border-radius:28px;padding:24px 20px 10px;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,.3);color:#1f1f1f}
.dlg-os .ico{margin:0 auto 16px;color:#444746;display:flex;justify-content:center}
.dlg-os p{margin:0;font:400 18px/24px var(--font-sans);text-wrap:balance}
.dlg-os p b{font-weight:500}
.dlg-os .acts{display:grid;margin-top:18px}
.dlg-os .acts button{min-height:52px;border-radius:12px}
.dlg-ios{width:272px;background:rgba(249,249,249,.97);border-radius:14px;overflow:hidden;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dlg-ios .body{padding:19px 16px 15px}
.dlg-ios strong{display:block;font:600 15px/20px var(--font-sans);color:#000}
.dlg-ios .acts{display:flex;border-top:1px solid rgba(60,60,67,.29)}
.dlg-ios .acts button{flex:1;min-height:44px;border:0;background:none;color:#0a7cff;font:400 17px/1 var(--font-sans);cursor:pointer}
.dlg-ios .acts button+button{border-left:1px solid rgba(60,60,67,.29);font-weight:600}
.dlg-note{margin:10px auto 0;max-width:300px;font:400 12px/18px var(--font-sans);color:rgba(255,255,255,.88);text-align:center}

/* ---------- Alvy: a full-page overlay under the top bar, closed with the X ---------- */
.alvy{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--bg-surface)}
.alvy>*{flex:1;min-height:0}
/* Mobile composer: Tessera's ChatInput is laid out for desktop (field, then an action row).
   On a phone the send button sits beside the field in one 52px row. */
.alvy .ts-chat-input__main{flex-direction:row;align-items:flex-end;gap:var(--space-2);padding:var(--space-2) var(--space-2) var(--space-2) var(--space-4)}
.alvy .ts-chat-input__field{flex:1;min-width:0;padding:var(--space-2) 0}
.alvy .ts-chat-input__actions{gap:0}
.alvy .ts-chat-input__tools:empty{display:none}

/* ---------- Prototype controls (not part of the design) ---------- */
.proto{flex:none;position:relative;z-index:70;width:300px;height:100%;overflow:auto;display:flex;flex-direction:column;background:var(--bg-surface);border-left:1px solid var(--border-subtle);color:var(--text-body)}
.proto-head,.proto-body{padding-left:var(--space-4);padding-right:max(var(--space-4),env(safe-area-inset-right,0px))}
.proto-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-2);padding-top:max(var(--space-4),env(safe-area-inset-top,0px));padding-bottom:var(--space-3);border-bottom:1px solid var(--border-subtle)}

</style>

<div id="root" data-theme="light"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script src="tessera/bundle.js"></script>
<script>
(() => {
  const { useState, useEffect, useRef, Fragment } = React;
  const DS = window.TesseraDS;
  const html = htm.bind(React.createElement);
  const { Button, IconButton, Icon, Spinner, Toggle, Dropdown, Chip, Tag, Tabs, TabList, Tab, TextLink, TextArea, Input, RadioGroup, Radio, Overlay, Modal, RtIconButton, usePresence,
    CandidateTopNavigation, CandidateTimer, CandidateClock, CandidateSoundwave, CandidateBroadcastBanner, ProgressIndicator, SkeletonLoader, ChatPanel } = DS;

  /* Glyphs for the simulated browser chrome, the browser's own dialogs and the illustrations.
     Everything inside the product itself uses the Tessera Icon set. */
  const SVG = {
    lock:'<rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
    dots:'<circle cx="12" cy="5" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.4" fill="currentColor" stroke="none"/>',
    share:'<path d="M12 16V4M8 8l4-4 4 4M5 14v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"/>',
    home:'<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',
    sig:'<path d="M2 20h.01M6 20v-4M11 20v-9M16 20V8M21 20V4"/>',
    batt:'<rect x="2" y="7" width="17" height="10" rx="2.5"/><path d="M22 11v2"/><rect x="4" y="9" width="11" height="6" rx="1" fill="currentColor" stroke="none"/>',
    video:'<path d="M15 10l4.553-2.276A1 1 0 0 1 21 8.618v6.764a1 1 0 0 1-1.447.894L15 14v-4z"/><rect x="3" y="6" width="12" height="12" rx="2"/>',
    mic:'<rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M8 21h8M12 17v4"/>',
    play:'<path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/>'
  };
  const svg = (n, size = 16) => html`<svg width=${size} height=${size} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" dangerouslySetInnerHTML=${{__html: SVG[n]}} />`;

  const PHONES = {android:{w:360, h:800}, ios:{w:390, h:844}};
  const SITE = 'cx-v2.talview.com';
  const CAMS = ['Front camera', 'Back camera'];
  const MICS = ['Phone microphone', 'AirPods Pro', 'Wired headset'];
  const WAIT_LABELS = ['Email verified', 'Loading your assessment', 'Preparing your questions'];
  const RESUME_LABELS = ['Email verified', 'Restoring your progress', 'Preparing your next question'];
  const TOTAL_SECS = 1200;       // the assessment timer: 20 minutes
  const NET_LOSS_MS = 15000;     // how long offline before the error screen (shortened for the prototype)

  /* ================= The questions =================
     Index 0 is the practice question, used in onboarding. The assessment has two questions and
     both are answered on video: a multimedia question (someone asks it in a clip) and a video
     question (it is written). Each video answer saves the moment the recording stops. Anything
     still in progress when the page reloads, or when a call interrupts the recording, is lost;
     everything already saved is kept. */
  const QS = [
    {id:'practice', kind:'video', practice:true, text:'Tell us about a project you’re proud of and what you learned from it.'},
    {id:'q1', kind:'media', text:'Priya, our hiring manager, asks: tell her about a time you had to learn something new quickly, and how you went about it.',
      media:{len:12, caption:'Question from Priya, hiring manager', captions:[[0, 'Hi, I’m Priya, the hiring manager.'], [3, 'Tell me about a time you had to learn'], [6, 'something new quickly,'], [8.5, 'and how you went about it.']]}},
    {id:'q2', kind:'video', text:'Share a story where you were able to bounce back from a challenge that was crucial to your success in learning a skill or concept.'}
  ];
  const ASSESS = QS.slice(1);

  /* ================= Saved progress =================
     What survives a reload: onboarding done, the answers already saved, where the candidate is
     and the time left. Kept in sessionStorage where the viewer allows it, in memory otherwise. */
  const KEY = 'tessera-async-proto-v3';
  const BLANK = () => ({onboarded:false, qi:1, answers:{}, timeLeft:TOTAL_SECS, finished:false});
  const loadP = () => { try { const j = sessionStorage.getItem(KEY); if (j) return {...BLANK(), ...JSON.parse(j)}; } catch (e){} return BLANK(); };
  let P = loadP();
  const saveP = () => { try { sessionStorage.setItem(KEY, JSON.stringify(P)); } catch (e){} };
  const resetP = () => { P = BLANK(); try { sessionStorage.removeItem(KEY); } catch (e){} };

  /* ================= State =================
     One mutable store, rendered by React. Media elements are children of components that stay
     mounted across repaints, so a repaint cannot replace the canvas the recorder reads. */
  const S = {
    state:'wait', platform:'android',
    dialog:null, askFrom:null, blockedFrom:null, osGranted:false,
    permMode:'ask', voiceMode:'heard', loadMode:'ok', netMode:'online', online:navigator.onLine !== false, saveMode:'ok',
    wasOffline:false, backOnline:false, retryFail:false, neterrKind:'lost',
    save:'saving',
    permitted:false, blockedReason:'denied', inuseCleared:false,
    heard:false, micFailed:false, recording:false, hidePreview:false,
    interruptReason:'away', takeSecs:0, pendingInterrupt:false, lastFrame:null,
    qi:0, qExpanded:false, clipDone:false,
    prepSecs:15, prepLeft:15, prepStyle:'button', practicePrep:true, limitSecs:120, timerVisible:true,
    assessing:false, timeLeft:TOTAL_SECS, resuming:false, restoreNote:false,
    saveStep:0, fb:{rating:null, liked:[], text:''},
    alvyOpen:false, alvyMsgs:[], alvyTyping:false, sheet:null, retakeAsk:false, savedFlash:false,
    recSecs:0, cam:0, mic:0, count:5, waitItems:['done', 'act', 'pend'],
    stream:null, audioCtx:null, analyser:null, abuf:null, level:0, realFailed:false,
    recorder:null, chunks:[], clipURL:null, poster:null, replayOK:false,
    protoCollapsed:false
  };
  let bump = () => {};
  const render = () => bump();
  const Q = () => QS[S.qi];

  let timers = [], intervals = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const every = (fn, ms) => intervals.push(setInterval(fn, ms));
  const clearTimers = () => { timers.forEach(clearTimeout); intervals.forEach(clearInterval); timers = []; intervals = []; };
  const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

  const showPreview = () => (S.state === 'test' || S.state === 'record') && S.permitted;
  const KEEP_CLIP = ['review', 'interrupted'];   // states that must not throw the take away
  const NO_CAMERA = ['wait', 'neterror', 'permission', 'blocked', 'interrupted', 'countdown', 'saving', 'score', 'feedback', 'thanks'];
  const online = () => S.netMode === 'offline' ? false : S.online;
  const BROWSER = () => S.platform === 'ios' ? 'Safari' : 'Chrome';

  function go(next){
    clearTimers();
    stopRecorder(true);
    S.state = next;
    S.recording = next === 'record';   // the camera screen records: it starts when it mounts
    S.dialog = null;
    S.pendingInterrupt = false;
    S.qExpanded = false;
    S.sheet = null; S.retakeAsk = false; S.savedFlash = false;
    if (!KEEP_CLIP.includes(next)) dropClip();
    if (next === 'wait') S.waitItems = ['done', 'act', 'pend'];
    if (next === 'test'){ S.heard = false; S.micFailed = false; }
    if (next === 'question'){ S.prepLeft = S.prepSecs; S.clipDone = false; }
    if (next === 'record'){ S.recSecs = 0; S.hidePreview = false; S.lastFrame = null; }
    if (next === 'countdown') S.count = 5;
    if (next === 'saving') S.saveStep = 0;
    if (NO_CAMERA.includes(next)) stopStream();
    render();
    enter(next);
  }

  function enter(st){
    if (st === 'wait'){
      // Prototype stand-in: production drives these from real loading milestones.
      later(() => {
        if (S.loadMode === 'fail'){ S.neterrKind = 'load'; go('neterror'); return; }
        S.waitItems = ['done', 'done', 'act']; render();
      }, 1400);
      later(() => { S.waitItems = ['done', 'done', 'done']; render(); }, 2600);
      later(afterLoad, 3200);
    }
    if (st === 'test'){
      if (canUseCamera() && !S.stream) acquire().catch(() => {});
      startLevel();
      if (S.voiceMode === 'heard' && !S.analyser) later(micOk, 2600);
      later(() => { if (!S.heard) micNone(); }, 7000);
    }
    if (st === 'question'){
      // Preparation time, then the system starts recording. A written video question starts it
      // now; a multimedia question starts it when the clip has finished.
      const q = Q();
      if (q.kind === 'video' && (!q.practice || S.practicePrep)) startPrep();
    }
    if (st === 'review') startSave();
    if (st === 'countdown'){
      every(() => {
        S.count--;
        if (S.count <= 0){ beginAssessment(); return; }
        render();
      }, 1000);
    }
    if (st === 'saving'){
      P.finished = true; saveP();
      later(() => { S.saveStep = 1; render(); }, 3200);
    }
  }

  function startPrep(){
    S.prepLeft = S.prepSecs;
    render();
    every(() => {
      S.prepLeft = Math.max(0, S.prepLeft - 1);   // never below zero, even if a dialog is holding the start
      if (S.prepLeft <= 0){ startRecordFlow(); return; }
      render();
    }, 1000);
  }
  function clipEnded(){ if (S.clipDone) return; S.clipDone = true; startPrep(); }

  // After loading: a first visit goes to onboarding; a reload goes straight back to the question.
  function afterLoad(){
    if (P.finished){ go('thanks'); return; }
    if (P.onboarded){
      S.assessing = true; S.timeLeft = P.timeLeft; startAssessTimer();
      if (P.qi >= QS.length){ go('saving'); return; }
      S.qi = P.qi; go('question'); return;
    }
    S.qi = 0; go('permission');
  }
  function beginAssessment(){
    P.onboarded = true; P.qi = 1; P.timeLeft = TOTAL_SECS; saveP();
    S.assessing = true; S.timeLeft = TOTAL_SECS; S.qi = 1;
    startAssessTimer();
    go('question');
  }

  /* ---------- The assessment timer ---------- */
  let assessIv = null;
  function startAssessTimer(){
    clearInterval(assessIv);
    assessIv = setInterval(() => {
      if (!S.assessing) return;
      S.timeLeft = Math.max(0, S.timeLeft - 1);
      P.timeLeft = S.timeLeft;
      if (S.timeLeft % 5 === 0) saveP();
      if (S.timeLeft <= 0){ clearInterval(assessIv); S.assessing = false; go('saving'); return; }
      render();
    }, 1000);
  }
  function stopAssessTimer(){ clearInterval(assessIv); }

  /* ---------- Moving through the questions ---------- */
  // Both questions are answered on video, and each answer saved when its recording stopped, so
  // Next only moves on. The last one finishes straight into saving.
  function nextQuestion(){
    S.restoreNote = false;   // the welcome-back note has done its job once they move on
    if (S.qi >= QS.length - 1){ P.qi = QS.length; saveP(); S.assessing = false; stopAssessTimer(); go('saving'); return; }
    S.qi++; P.qi = S.qi; saveP();
    go('question');
  }

  // Start the camera screen. After a reload the page has no camera yet, so ask first.
  function startRecordFlow(){
    if (S.dialog) return;
    if (!S.permitted){ askPermission(); return; }
    go('record');
  }

  /* ---------- Permission: the screen primes it, the platform asks ---------- */
  function askPermission(){
    S.askFrom = S.state;
    if (S.dialog) return;
    if (S.permMode === 'granted'){ return granted(); }
    if (canUseCamera()){
      // A real camera is reachable (the file opened directly in a browser): let the real
      // browser ask, so what the candidate sees is genuinely their own prompt.
      acquire().then(stream => {
        if (!stream || S.state !== S.askFrom) return;
        granted();
      }).catch(err => {
        if (S.state !== S.askFrom || err?.stale) return;
        if (err?.fallback){ S.dialog = 'site'; return render(); }
        S.blockedReason = (err.name === 'NotReadableError' || err.name === 'AbortError') ? 'inuse' : (err.name === 'NotFoundError' || err.name === 'OverconstrainedError') ? 'nocam' : 'denied';
        S.permitted = S.blockedReason === 'inuse';
        S.blockedFrom = S.askFrom;
        go('blocked');
      });
      return;
    }
    S.dialog = 'site';
    render();
  }
  // Chrome asks the OS only once the site itself is allowed, and Android asks for camera and
  // microphone one at a time.
  function dialogAllow(){
    if (S.dialog === 'site'){
      if (S.platform === 'android' && !S.osGranted){ S.dialog = 'os-cam'; return render(); }
      S.dialog = null; S.permitted = true; return granted();
    }
    if (S.dialog === 'os-cam'){ S.dialog = 'os-mic'; return render(); }
    S.dialog = null; S.osGranted = true; S.permitted = true; granted();
  }
  function dialogDeny(){
    const atOS = S.dialog !== 'site';
    S.dialog = null;
    S.permitted = false;
    S.blockedReason = atOS ? 'os' : 'denied';
    S.blockedFrom = S.askFrom;
    go('blocked');
  }
  function granted(){
    if (S.permMode === 'inuse' && !S.inuseCleared){ S.blockedReason = 'inuse'; S.permitted = true; S.blockedFrom = S.askFrom; return go('blocked'); }
    S.permitted = true;
    const from = S.askFrom; S.askFrom = null;
    go(from === 'question' ? 'record' : 'test');
  }
  function retryBlocked(){
    S.inuseCleared = true; S.permitted = false;
    go(S.blockedFrom === 'question' ? 'question' : 'permission');
  }

  /* ---------- Interruption: the half of mobile the happy path never shows ----------
     A call, a notification the candidate taps, the screen locking, switching apps: all of them
     suspend the page and end the camera track. The answer in progress cannot be saved from a
     dead stream, so it is lost and the question starts again. Everything saved before it stays. */
  function interrupt(reason){
    if (S.state !== 'record' || !S.recording) return;
    S.interruptReason = reason;
    go('interrupted');
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden){
      if (S.state === 'record' && S.recording){
        S.interruptReason = 'away';
        stopRecorder(true);
        S.recording = false;
        S.pendingInterrupt = true;
      }
      return;
    }
    if (S.pendingInterrupt){ S.pendingInterrupt = false; go('interrupted'); }
  });
  // A track ends or mutes when something else claims the device, typically a phone call.
  function watchTracks(stream){
    stream.getTracks().forEach(t => {
      const lost = () => interrupt('device');
      t.addEventListener('ended', lost);
      t.addEventListener('mute', lost);
    });
  }

  /* ---------- Saving: stop recording saves the answer, with no upload step ----------
     That is the right design and it carries one risk: a write that stalls is silent, so the
     candidate walks on to the next question with this one still in flight. The cure is holding
     Next until the write has landed. */
  let saveToken = 0;
  function startSave(){
    const tok = ++saveToken;
    S.save = 'saving';
    render();
    const landed = () => {
      const q = Q();
      if (q.kind === 'video' && !q.practice){ P.answers[q.id] = {saved:true}; saveP(); }
      S.save = 'saved';
      // As on web: "Your response has been saved successfully." over the player, then playback.
      S.savedFlash = true; render();
      setTimeout(() => { if (tok === saveToken){ S.savedFlash = false; render(); } }, 2500);
    };
    later(() => {
      if (tok !== saveToken || S.state !== 'review') return;
      if (!online()){ S.save = 'retry'; return render(); }   // held until the connection returns
      if (S.saveMode === 'ok') return landed();
      S.save = 'retry';
      render();
      later(() => {
        if (tok !== saveToken || S.state !== 'review') return;
        if (S.saveMode === 'fail' || !online()){ S.save = 'failed'; render(); } else landed();
      }, 3200);
    }, S.netMode === 'poor' ? 2600 : 1500);
  }

  /* ---------- Network ----------
     A short drop shows a broadcast banner and carries on. A long one replaces the page with an
     error screen, and Retry reloads: the saved answers and onboarding survive, the answer that
     was in progress does not. */
  let netTimer = null, backTimer = null;
  function netChanged(){
    clearTimeout(netTimer);
    if (!online()){
      S.wasOffline = true; S.backOnline = false;
      netTimer = setTimeout(() => {
        if (!online() && !['neterror', 'wait'].includes(S.state)){ S.neterrKind = 'lost'; S.retryFail = false; go('neterror'); }
      }, NET_LOSS_MS);
    } else if (S.wasOffline){
      S.wasOffline = false; S.backOnline = true;
      clearTimeout(backTimer);
      backTimer = setTimeout(() => { S.backOnline = false; render(); }, 4000);
    }
    render();
    if (S.state === 'review' && online() && (S.save === 'retry' || S.save === 'failed')) startSave();
  }
  addEventListener('online', () => { S.online = true; netChanged(); });
  addEventListener('offline', () => { S.online = false; netChanged(); });

  function dropConnection(){ S.netMode = 'offline'; S.wasOffline = true; S.neterrKind = 'lost'; S.retryFail = false; go('neterror'); }
  function retryNet(){
    if (!online()){ S.retryFail = true; render(); return; }
    S.retryFail = false;
    if (S.neterrKind === 'load'){ S.loadMode = 'ok'; go('wait'); return; }
    reloadResume();
  }
  // A reload: the page forgets everything in memory, then rebuilds from what was saved.
  function reloadResume(){
    stopStream(); dropClip();
    S.permitted = false; S.dialog = null; S.alvyOpen = false;
    S.resuming = P.onboarded; S.restoreNote = P.onboarded && !P.finished;
    go('wait');
  }
  function resetProgress(){
    resetP(); stopAssessTimer(); stopStream(); dropClip();
    Object.assign(S, {assessing:false, timeLeft:TOTAL_SECS, qi:0, resuming:false, restoreNote:false, permitted:false, fb:{rating:null, liked:[], text:''}, alvyOpen:false, alvyMsgs:[]});
    go('wait');
  }

  /* ---------- Mic gate: Continue unlocks when we hear something ---------- */
  function micOk(){ if (S.heard || S.state !== 'test') return; S.heard = true; S.micFailed = false; render(); }
  function micNone(){ if (S.heard || S.state !== 'test') return; S.micFailed = true; render(); }
  function simSpeech(){
    const t = performance.now() / 1000;
    const talking = (Math.sin(t * 1.7) + Math.sin(t * 0.63)) > -0.9;
    return talking ? Math.min(1, 0.25 + 0.75 * Math.abs(Math.sin(t * 10.5 + Math.sin(t * 3.1) * 2))) : 0.03;
  }
  function realLevel(){
    S.analyser.getByteTimeDomainData(S.abuf);
    let sum = 0;
    for (const v of S.abuf){ const d = (v - 128) / 128; sum += d * d; }
    return Math.min(1, Math.sqrt(sum / S.abuf.length) * 5);
  }
  function startLevel(){
    let loud = 0;
    every(() => {
      S.level = S.voiceMode === 'silent' ? 0 : S.analyser ? realLevel() : simSpeech();
      if (!S.heard && S.analyser && S.voiceMode === 'heard' && S.state === 'test'){
        loud = S.level > 0.12 ? loud + 80 : Math.max(0, loud - 40);
        if (loud >= 600) micOk();
      }
    }, 80);
  }

  /* ================= Camera ================= */
  const canUseCamera = () => {
    if (S.realFailed || !window.isSecureContext || !navigator.mediaDevices?.getUserMedia) return false;
    const policy = document.permissionsPolicy || document.featurePolicy;
    return policy?.allowsFeature ? policy.allowsFeature('camera') : true;
  };
  let acquireToken = 0;
  function acquire(){
    const tok = ++acquireToken, t0 = performance.now();
    return navigator.mediaDevices.getUserMedia({video:true, audio:true}).then(stream => {
      if (tok !== acquireToken){ stream.getTracks().forEach(t => t.stop()); return null; }
      S.stream = stream;
      setupAudio(stream);
      watchTracks(stream);
      render();
      return stream;
    }, err => {
      if (tok !== acquireToken) throw {stale:true};
      // An instant refusal means this frame cannot use the camera at all (an embedded viewer,
      // say): fall back to the drawn sample preview and the simulated dialogs.
      if ((err.name === 'NotAllowedError' && performance.now() - t0 < 250) || err.name === 'SecurityError' || err.name === 'TypeError'){
        S.realFailed = true;
        throw {fallback:true};
      }
      throw err;
    });
  }
  function setupAudio(stream){
    try {
      if (!stream.getAudioTracks().length) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      S.audioCtx = new AC();
      const an = S.audioCtx.createAnalyser();
      an.fftSize = 512;
      S.audioCtx.createMediaStreamSource(stream).connect(an);
      S.analyser = an;
      S.abuf = new Uint8Array(an.fftSize);
      S.audioCtx.resume?.();
    } catch (e){ S.analyser = null; }
  }
  function stopStream(){
    acquireToken++;
    S.stream?.getTracks().forEach(t => t.stop());
    try { S.audioCtx?.close(); } catch (e){}
    S.stream = null; S.audioCtx = null; S.analyser = null;
  }

  /* ---------- Recording the clip, so the candidate can watch it back ----------
     The device check only proves the live preview works. Playing the clip back is the only
     proof the RECORDING captured them. Where MediaRecorder is missing or refuses the source,
     we keep the last frame instead and say playback is unavailable. */
  let simCanvasEl = null;
  function recorderSource(){
    if (S.stream) return S.stream;
    try { return simCanvasEl?.captureStream ? simCanvasEl.captureStream(30) : null; } catch (e){ return null; }
  }
  function startRecorder(){
    S.chunks = []; S.replayOK = false;
    const src = recorderSource();
    if (!src || !window.MediaRecorder) return;
    try {
      const type = ['video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(t => MediaRecorder.isTypeSupported?.(t));
      const mime = type || 'video/webm';
      const rec = new MediaRecorder(src, type ? {mimeType:type} : undefined);
