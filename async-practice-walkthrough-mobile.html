<title>Async Practice Walkthrough — Mobile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="tessera/tokens.css">
<link rel="stylesheet" href="tessera/bundle.css">
<style>
/* End-to-end mobile flow for the Tessera async assessment (UX-1224): onboarding, the live
   assessment with sample questions, and the wrap-up, on Chrome for Android and Safari on iPhone.

   Layout concept: a scaled phone on a neutral stage. Inside it every screen is the same frame:
   the Tessera top bar, a scrolling body, and a fixed footer that holds every call to action at
   full width. Camera screens go full page, with the top bar and footer laid over the picture.

   Built on the real Tessera components (window.TesseraDS). Nothing here uses a colour or size
   that is not a Tessera token, except the simulated browser chrome, the browser's own permission
   dialogs, and the sample camera picture. The structure follows the approved wireframe; the V8
   Test Taker Experience and Proctoring Attendee frames are the style and layout reference.

   Light mode only: the app sits under data-theme="light", so a viewer's dark setting cannot flip
   the tokens. */
:root{ --stage-bg:#d4d4d8; color-scheme:light }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:row;font-family:var(--font-sans);font-size:14px;line-height:20px;color:var(--text-body);background:var(--stage-bg);-webkit-font-smoothing:antialiased}
#root{display:flex;flex:1;min-width:0;height:100%}
.app{display:flex;flex:1;min-width:0;height:100%}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

/* ---------- Stage and phone frame ---------- */
.stage{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#phone{position:absolute;left:50%;top:50%;width:var(--pw);height:var(--ph);margin:calc(var(--ph) / -2) 0 0 calc(var(--pw) / -2);
  transform:scale(var(--k,1));transform-origin:50% 50%;background:#000;border-radius:38px;
  box-shadow:0 10px 50px rgba(0,0,0,.28),0 0 0 11px #18181b,0 0 0 12px #3f3f46;overflow:hidden}
#frame{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg-surface);overflow:hidden}

/* Simulated browser chrome. Android matches the Figma frames (dark Chrome); iPhone draws Safari. */
.a-chrome{flex:none;background:#202124;color:#e8eaed;font:500 12px/1 var(--font-sans)}
.a-status{display:flex;align-items:center;justify-content:space-between;height:26px;padding:0 18px}
.a-url{display:flex;align-items:center;gap:8px;padding:2px 10px 8px}
.a-pill{flex:1;min-width:0;display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:999px;background:#3c4043;font:400 13px/1 var(--font-sans);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.a-btn{flex:none;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:#e8eaed}
.a-tabs{width:20px;height:20px;border:1.6px solid #e8eaed;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font:600 11px/1 var(--font-sans)}
.a-nav{flex:none;height:18px;background:var(--bg-surface);display:flex;align-items:center;justify-content:center}
.a-nav span{width:106px;height:4px;border-radius:2px;background:#18181b;opacity:.75}
.notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:108px;height:27px;border-radius:999px;background:#000;z-index:3}
.i-status{flex:none;display:flex;align-items:flex-end;justify-content:space-between;height:46px;padding:0 24px 6px;background:var(--bg-surface);font:600 14px/1 var(--font-sans);color:var(--text-primary)}
.i-bottom{flex:none;background:var(--bg-surface);border-top:1px solid var(--border-subtle)}
.i-url{display:flex;align-items:center;gap:8px;padding:6px 10px}
.i-field{flex:1;min-width:0;display:flex;align-items:center;gap:7px;height:34px;padding:0 10px;border-radius:999px;background:var(--bg-elevated);font:400 12px/18px var(--font-sans);color:var(--text-body)}
.i-aa{font:500 15px/1 var(--font-sans);letter-spacing:-.02em;padding:0 4px;color:var(--text-primary)}
.i-aa b{font-size:11px;font-weight:500}
.i-home{height:22px;display:flex;align-items:flex-start;justify-content:center;padding-top:4px}
.i-home span{width:134px;height:5px;border-radius:3px;background:#18181b;opacity:.85}

/* ---------- The page frame: top bar, body, fixed footer ---------- */
#viewport{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;background:var(--bg-surface)}
.topstack{flex:none;position:relative;z-index:6}
#view{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
/* Camera screens go full page: the picture runs behind the top bar and the footer. */
#viewport.camfull .topstack{position:absolute;top:0;left:0;right:0}
#viewport.camfull .topstack>header{background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#viewport.camfull #view{position:absolute;inset:0}

.pg{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg-surface)}
.pg-body{flex:1;min-height:0;overflow:auto;padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-4)}
.pg-body.mid{justify-content:center}
/* The footer is fixed: it never scrolls away, and it holds every call to action at full width. */
.pg-foot{flex:none;display:grid;gap:var(--space-2);padding:var(--space-3) var(--space-4) var(--space-4);background:var(--bg-surface);border-top:1px solid var(--border-subtle)}
.pg-foot .note{margin:0;text-align:center}
.foot-link{display:flex;justify-content:center}
.head{display:grid;gap:var(--space-2)}
.head-row{display:flex;align-items:center;gap:var(--space-2)}
.head-row svg{flex:none;color:var(--success-strong)}
.head h1,.head p,.pg-body p{margin:0}
.ttl{margin:0;color:var(--text-primary)}
.ttl.err{color:var(--error-emphasis)}
.muted{color:var(--text-subtle)}
.centre{display:flex;flex-direction:column;align-items:center;gap:var(--space-3);text-align:center}
.mark{flex:none;width:48px;height:48px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;background:var(--bg-accent);color:var(--interactive-link)}
.mark.err{background:var(--error-surface);color:var(--error-emphasis)}
.steps{margin:0;padding-left:var(--space-5);display:grid;gap:var(--space-2);color:var(--text-body)}
.steps b{font-weight:500;color:var(--text-primary)}
.checklist{list-style:none;margin:0;padding:0;width:100%;text-align:left}
.checklist li{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) 0;color:var(--text-primary)}
.checklist li.pend{color:var(--text-subtle)}
.checklist li.done svg{color:var(--success-strong)}
.dot{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border-primary)}
.art{flex:none;display:flex;justify-content:center}
.art svg{display:block;width:100%;max-width:320px;height:auto}
.art img{display:block;width:100%;max-width:260px;height:auto}
.status-line{display:flex;align-items:flex-start;gap:var(--space-2);font:500 14px/20px var(--font-sans);color:var(--text-body)}
.status-line.ok{color:var(--success-strong)}
.status-line.late{color:var(--warning-emphasis)}
.status-line.bad{color:var(--error-emphasis)}
.status-line svg{flex:none;margin-top:2px}

/* ---------- Device rows ---------- */
.drows{display:grid;gap:var(--space-1)}
.drow{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:var(--space-2)}
.drow>svg{color:var(--text-tertiary)}

/* ---------- Video: a card on light screens, a full page on camera screens ---------- */
.vcard{position:relative;flex:1;min-height:176px;border-radius:var(--radius-xl);overflow:hidden;background:var(--bg-tooltip)}
.vmedia{position:absolute;inset:0}
.vmedia.hidden{visibility:hidden}
.vmedia video,.vmedia canvas,.vmedia img{display:block;width:100%;height:100%;object-fit:cover}
.vmedia video.mirror{transform:scaleX(-1)}
.vmedia.frozen video,.vmedia.frozen img,.vmedia.frozen canvas{filter:grayscale(.55) brightness(.55)}
.vmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-2);padding:var(--space-6);text-align:center;color:var(--text-on-primary)}
.vtop{position:absolute;left:var(--space-3);right:var(--space-3);top:var(--space-3);display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);z-index:2}
.pill{display:inline-flex;align-items:center;gap:var(--space-1);background:var(--bg-surface);border-radius:var(--radius-full);padding:0 var(--space-2);min-height:28px}
.pill .left{font:500 12px/18px var(--font-sans);color:var(--text-subtle)}
.livedot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--error-strong);box-shadow:0 0 0 3px rgba(255,255,255,.55)}
.vstrip{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-2) var(--space-3);
  background:var(--bg-overlay-primary);color:var(--text-on-primary);
  --text-tertiary:var(--text-on-primary);--text-primary:var(--text-on-primary);--interactive-link:var(--blue-300)}
.vstrip .say{font:500 14px/20px var(--font-sans);min-width:0}
.vstrip .grp{display:flex;align-items:center;gap:var(--space-2);min-width:0}
.vcenter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;pointer-events:none}
.vcenter>*{pointer-events:auto}

/* Full-page camera: the picture fills the viewport; the footer and a floating card sit on top. */
.camlayer{position:absolute;inset:0;background:var(--bg-tooltip)}
.camtop{position:absolute;left:var(--space-3);right:var(--space-3);top:calc(var(--tsh,56px) + var(--space-3));display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);z-index:4}
.camfoot{position:absolute;left:0;right:0;bottom:0;z-index:4;display:grid;gap:var(--space-3);padding:var(--space-10) var(--space-4) var(--space-4);
  background:linear-gradient(to top,rgba(24,24,27,.9) 45%,rgba(24,24,27,0))}
.float{background:var(--bg-surface);border-radius:var(--radius-xl);padding:var(--space-3) var(--space-4);box-shadow:var(--shadow-lg);display:grid;gap:var(--space-2)}
.float p{margin:0}
.wavebar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-2) var(--space-3);border-radius:var(--radius-lg);background:var(--bg-muted);color:var(--text-primary)}
.qline{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;color:var(--text-primary)}

/* ---------- Questions ---------- */
.qmeta{display:flex;align-items:center;justify-content:space-between;color:var(--text-subtle)}
.qtext{margin:0;color:var(--text-primary)}
.infobox{background:var(--bg-muted);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:var(--space-3);display:grid;gap:var(--space-1)}
.infobox p{margin:0}
.clip{position:relative;flex:none;aspect-ratio:16/10;width:100%;border-radius:var(--radius-xl);overflow:hidden;background:var(--bg-tooltip)}
.clip canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.transcript{margin:0;padding:var(--space-3);background:var(--bg-muted);border-radius:var(--radius-lg);color:var(--text-body)}

/* The preparation countdown on the button: a darker blue fills left to right as the time runs out. */
@property --fill{syntax:'<percentage>';inherits:true;initial-value:0%}
.prepfill{--fill:0%;transition:--fill 1s linear}
.prepfill .ts-button--primary{background:linear-gradient(90deg,var(--interactive-click) var(--fill),var(--interactive-primary) var(--fill))}
.prepfill .ts-button--primary:hover:not(:disabled){background:linear-gradient(90deg,var(--interactive-click) var(--fill),var(--interactive-hover) var(--fill))}
.prepbar{display:grid;gap:var(--space-1)}

/* ---------- Wrap-up ---------- */
.bigscore{font:600 40px/48px var(--font-sans);color:var(--text-primary);margin:0}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-2) 0;border-top:1px solid var(--border-subtle)}
.rrow:first-child{border-top:0}
.rrow .l{display:grid;min-width:0}
.cert{border:2px solid var(--border-primary);border-radius:var(--radius-lg);padding:var(--space-4);text-align:center;background:var(--bg-muted);display:grid;gap:var(--space-1)}
.cert .t{font:600 20px/28px var(--font-sans);color:var(--text-primary)}
.rate{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--space-1)}
.rate button{display:grid;justify-items:center;gap:2px;padding:var(--space-2) 2px;border:1px solid var(--border-subtle);border-radius:var(--radius-lg);background:var(--bg-surface);color:var(--text-body);font:400 11px/14px var(--font-sans);cursor:pointer}
.rate button .e{font-size:22px;line-height:28px}
.rate button[aria-checked="true"]{border-color:var(--interactive-link);background:var(--bg-accent);color:var(--interactive-link)}
.rate button:focus-visible{outline:2px solid var(--interactive-link);outline-offset:2px}
.tags{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.skel{display:grid;gap:var(--space-3)}

/* ---------- The browser's own permission dialogs (not Tessera: drawn after the platform) ---------- */
.scrim{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(0,0,0,.45)}
.dlg-site{width:100%;max-width:300px;background:#fff;border-radius:28px;padding:22px 22px 12px;box-shadow:0 16px 48px rgba(0,0,0,.3);color:#1f1f1f}
.dlg-site .ico{display:flex;gap:6px;color:#444746;margin-bottom:12px}
.dlg-site p{margin:0;font:400 16px/22px var(--font-sans)}
.dlg-site .acts{display:flex;justify-content:flex-end;gap:4px;margin-top:16px}
.dlg-site .acts button,.dlg-os .acts button{min-height:44px;padding:0 14px;border:0;border-radius:999px;background:none;color:#0b57d0;font:500 14px/1 var(--font-sans);cursor:pointer}
.dlg-site .acts button:hover,.dlg-os .acts button:hover{background:#e8f0fe}
.dlg-os{width:100%;max-width:300px;background:#fff;border-radius:28px;padding:24px 20px 10px;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,.3);color:#1f1f1f}
.dlg-os .ico{margin:0 auto 16px;color:#444746;display:flex;justify-content:center}
.dlg-os p{margin:0;font:400 18px/24px var(--font-sans);text-wrap:balance}
.dlg-os p b{font-weight:500}
.dlg-os .acts{display:grid;margin-top:18px}
.dlg-os .acts button{min-height:52px;border-radius:12px}
.dlg-ios{width:272px;background:rgba(249,249,249,.97);border-radius:14px;overflow:hidden;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dlg-ios .body{padding:19px 16px 15px}
.dlg-ios strong{display:block;font:600 15px/20px var(--font-sans);color:#000}
.dlg-ios .acts{display:flex;border-top:1px solid rgba(60,60,67,.29)}
.dlg-ios .acts button{flex:1;min-height:44px;border:0;background:none;color:#0a7cff;font:400 17px/1 var(--font-sans);cursor:pointer}
.dlg-ios .acts button+button{border-left:1px solid rgba(60,60,67,.29);font-weight:600}
.dlg-note{margin:10px auto 0;max-width:300px;font:400 12px/18px var(--font-sans);color:rgba(255,255,255,.88);text-align:center}

/* ---------- Alvy: a full-page overlay under the top bar, closed with the X ---------- */
.alvy{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--bg-surface)}
#viewport.camfull .alvy{top:var(--tsh,56px)}
.alvy>*{flex:1;min-height:0}

/* ---------- Prototype controls (not part of the design) ---------- */
.proto{flex:none;position:relative;z-index:70;width:300px;height:100%;overflow:auto;display:flex;flex-direction:column;background:var(--bg-surface);border-left:1px solid var(--border-subtle);color:var(--text-body)}
.proto-head,.proto-body{padding-left:var(--space-4);padding-right:max(var(--space-4),env(safe-area-inset-right,0px))}
.proto-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-2);padding-top:max(var(--space-4),env(safe-area-inset-top,0px));padding-bottom:var(--space-3);border-bottom:1px solid var(--border-subtle)}
.proto-title{font:500 14px/20px var(--font-sans);color:var(--text-primary)}
.proto-ticket{flex-basis:100%;margin:0;color:var(--text-subtle)}
.proto-ticket b{font-weight:500;color:var(--text-primary)}
.proto-body{display:flex;flex-direction:column;gap:var(--space-5);padding-top:var(--space-4);padding-bottom:max(var(--space-4),env(safe-area-inset-bottom,0px))}
.proto.collapsed{width:auto}
.proto.collapsed .proto-body,.proto.collapsed .proto-ticket{display:none}
.proto-group{display:flex;flex-direction:column;gap:var(--space-2);width:100%}
.proto-label{font:500 12px/18px var(--font-sans);color:var(--text-subtle);text-transform:uppercase;letter-spacing:.04em}
.proto-group [role="tablist"]{width:100%}
.proto-group [role="tablist"]:not([aria-orientation="vertical"]){display:flex}
.proto-group [role="tablist"]:not([aria-orientation="vertical"]) [role="tab"]{flex:1;justify-content:center;padding-left:var(--space-2);padding-right:var(--space-2)}
.proto-actions{display:grid;gap:var(--space-2)}
@media (max-width:760px){
  body{flex-direction:column}
  .app{flex-direction:column}
  .proto{width:auto;height:auto;max-height:45%;border-left:0;border-top:1px solid var(--border-subtle)}
}
</style>

<div id="root" data-theme="light"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script src="tessera/bundle.js"></script>
<script>
(() => {
  const { useState, useEffect, useRef, Fragment } = React;
  const DS = window.TesseraDS;
  const html = htm.bind(React.createElement);
  const { Button, IconButton, Icon, Spinner, Toggle, Dropdown, Chip, Tag, Tabs, TabList, Tab, TextLink, TextArea, Input, RadioGroup, Radio,
    CandidateTopNavigation, CandidateTimer, CandidateClock, CandidateSoundwave, CandidateBroadcastBanner, ProgressIndicator, SkeletonLoader, ChatPanel } = DS;

  /* Glyphs for the simulated browser chrome, the browser's own dialogs and the illustrations.
     Everything inside the product itself uses the Tessera Icon set. */
  const SVG = {
    lock:'<rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
    dots:'<circle cx="12" cy="5" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.4" fill="currentColor" stroke="none"/>',
    share:'<path d="M12 16V4M8 8l4-4 4 4M5 14v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"/>',
    home:'<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',
    sig:'<path d="M2 20h.01M6 20v-4M11 20v-9M16 20V8M21 20V4"/>',
    batt:'<rect x="2" y="7" width="17" height="10" rx="2.5"/><path d="M22 11v2"/><rect x="4" y="9" width="11" height="6" rx="1" fill="currentColor" stroke="none"/>',
    video:'<path d="M15 10l4.553-2.276A1 1 0 0 1 21 8.618v6.764a1 1 0 0 1-1.447.894L15 14v-4z"/><rect x="3" y="6" width="12" height="12" rx="2"/>',
    mic:'<rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M8 21h8M12 17v4"/>',
    play:'<path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/>'
  };
  const svg = (n, size = 16) => html`<svg width=${size} height=${size} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" dangerouslySetInnerHTML=${{__html: SVG[n]}} />`;

  const PHONES = {android:{w:360, h:800}, ios:{w:390, h:844}};
  const SITE = 'cx-v2.talview.com';
  const CAMS = ['Front camera', 'Back camera'];
  const MICS = ['Phone microphone', 'AirPods Pro', 'Wired headset'];
  const WAIT_LABELS = ['Email verified', 'Loading your assessment', 'Preparing your questions'];
  const RESUME_LABELS = ['Email verified', 'Restoring your progress', 'Preparing your next question'];
  const TOTAL_SECS = 1200;       // the assessment timer: 20 minutes
  const NET_LOSS_MS = 15000;     // how long offline before the error screen (shortened for the prototype)

  /* ================= The questions =================
     Index 0 is the practice question, used in onboarding. The rest are the sample assessment.
     Written questions save when the candidate taps Next. A video answer saves the moment the
     recording stops. Anything still in progress when the page reloads is lost; everything
     already saved is kept. */
  const QS = [
    {id:'practice', kind:'video', practice:true, text:'Tell us about a project you’re proud of and what you learned from it.'},
    {id:'q1', kind:'mcq', skill:'Aptitude', text:'What is the next number in the sequence: 2, 4, 8, 16, ___?',
      options:['32', '24', '20', '46'], answer:'32'},
    {id:'q2', kind:'media', skill:'Comprehension', text:'Watch the clip, then answer: what is the main reason the speaker gives for the delay?',
      media:{len:24, caption:'Project update from Priya', transcript:'“Quick update on the dashboard. We’re two weeks behind, and the reason is simple: our data supplier missed their delivery deadline, so we couldn’t start the final testing. The team is fine and the budget is on track. We’ll ship as soon as the data arrives.”'},
      options:['A supplier missed a deadline', 'The team ran out of budget', 'A requirement changed late', 'The release was cancelled'], answer:'A supplier missed a deadline'},

    {id:'q4', kind:'mcq', skill:'Problem solving', text:'Solve for x in the equation 2x + 3 = 7.',

  let saveToken = 0;

  function drawPerson(ctx, w, h, t, level){

          ${S.micFailed ? html`<div class="status-line late" role="status"><${Icon} name="mic-off" size=${16} />
            <span>We can’t hear you. Check your phone isn’t muted, or pick a different microphone.</span></div>
            <${TextLink} as="button" leadingIcon=${html`<${Icon} name="help-circle" />`} onClick=${() => helpFlow('mic')}>Get help from Alvy<//>` : null}
        </div>
        <${Cta} disabled=${!S.heard} onClick=${() => go('question')}>Continue<//>
      </div><//>`;
  }

  /* ================= Questions ================= */
  const QHead = () => html`<div class="qmeta"><span class="l1">Question ${S.qi} of ${ASSESS.length}</span>
    <${IconButton} variant="tertiary-gray" icon="circle-exclamation" aria-label="Report a problem with this question" onClick=${openAlvy} /></div>`;

  // The practice question: read first, then Start recording opens the camera.
  function PracticeQuestion(){
    return html`<${Page} foot=${html`<${Cta} onClick=${startRecordFlow}>Start recording<//>`}>
      <div><${Chip} color="blue" variant="secondary" size="sm">Practice · not scored<//></div>
      <${Head} title=${Q().text} lg>
        <p class="p2">Take a moment to think, then tap Start recording. Your camera turns on when you start. Nothing here is scored, and you can record it again.</p>
      <//><//>`;
  }

  // A video question in the real assessment: preparation time first, on the question itself.
  // Three ways to show the countdown, so they can be compared: filling the button, a ring, a bar.
  function VideoQuestion(){
    const q = Q(), style = S.prepStyle;
    const pct = Math.round((S.prepSecs - S.prepLeft) / S.prepSecs * 100);
    const start = style === 'button'
      ? html`<div class="prepfill" style=${{'--fill':pct + '%'}}><${Cta} onClick=${startRecordFlow}>Start recording · ${S.prepLeft}s<//></div>`
      : html`<${Cta} onClick=${startRecordFlow}>Start recording<//>`;
    const foot = style === 'bar'
      ? html`<${Fragment}><div class="prepbar"><${ProgressIndicator} value=${S.prepSecs - S.prepLeft} max=${S.prepSecs} label=${`Recording starts in ${S.prepLeft}s`} valuePosition="none" /></div>${start}<//>`
      : start;
    return html`<${Page} foot=${foot}>
      <${QHead} />
      <${Head} title=${q.text} lg />
      <div class="infobox">
        <p class="p2">This is your preparation time. Recording starts when the timer ends. You can also start any time you’re ready.</p>
        <p class="p3 muted">You’ll have ${Math.round(S.limitSecs / 60) >= 1 ? Math.round(S.limitSecs / 60) + ' minutes' : S.limitSecs + ' seconds'} to answer. You can retake it.</p>
      </div>
      ${style === 'ring' ? html`<div class="centre"><${ProgressIndicator} type="circular" value=${S.prepSecs - S.prepLeft} max=${S.prepSecs} valueText=${S.prepLeft} label=${`Recording starts in ${S.prepLeft} seconds`} /></div>` : null}
    <//>`;
  }

  // A multimedia question: a short clip with controls and a transcript, then the answer options.
  function MediaClip({m}){
    const cref = useRef(null);
    const [t, setT] = useState(0), [playing, setPlaying] = useState(false), [showTx, setShowTx] = useState(false);
    useEffect(() => {
      const c = cref.current, ctx = c.getContext('2d');
      const dpr = Math.min(window.devicePixelRatio || 1, 2), w = c.clientWidth, h = c.clientHeight;
      c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const draw = () => { ctx.filter = 'hue-rotate(150deg)'; drawPerson(ctx, w, h, performance.now() / 1000, playing ? simSpeech() : 0.03); ctx.filter = 'none'; };
      draw();
      const id = setInterval(() => {
        draw();
        if (playing) setT(p => { const n = p + 0.08; if (n >= m.len){ setPlaying(false); return m.len; } return n; });
      }, 80);
      return () => clearInterval(id);
    }, [playing]);
    const toggle = () => { if (!playing && t >= m.len) setT(0); setPlaying(p => !p); };
    return html`<${Fragment}>
      <div class="clip">
        <canvas ref=${cref} role="img" aria-label=${`Video: ${m.caption}`}></canvas>
        ${(!playing && t === 0) ? html`<div class="vcenter"><${IconButton} variant="overlay" shape="round" aria-label="Play the clip" icon=${html`<${Fragment}>${svg('play', 16)}<//>`} onClick=${toggle} /></div>` : null}
        <div class="vstrip">
          <div class="grp">
            <${IconButton} variant="tertiary-gray" aria-label=${playing ? 'Pause the clip' : 'Play the clip'} aria-pressed=${playing}
              icon=${playing ? 'pause' : html`<${Fragment}>${svg('play', 16)}<//>`} onClick=${toggle} />
            <${CandidateClock} seconds=${Math.floor(t)} total=${m.len} mutedTotal size="sm" />
          </div>
          <${CandidateSoundwave} mode="playback" barCount=${18} progress=${Math.min(1, t / m.len)} label="Clip progress" />
        </div>
      </div>
      <div style=${{display:'grid', gap:'var(--space-2)'}}>
        <span class="p3 muted">${m.caption}</span>
        <div><${TextLink} as="button" size="sm" aria-expanded=${showTx} onClick=${() => setShowTx(v => !v)}>${showTx ? 'Hide transcript' : 'Show transcript'}<//></div>
        ${showTx ? html`<p class="p2 transcript">${m.transcript}</p>` : null}
      </div>
    <//>`;
  }

  // A written question. Next saves the answer; it stays locked until one is chosen.
  function McqQuestion(){
    const q = Q(), sel = S.sel[q.id] ?? P.answers[q.id]?.value ?? null, last = S.qi >= QS.length - 1;
    return html`<${Page} foot=${html`<${Cta} disabled=${!sel} onClick=${nextQuestion}>${last ? 'Finish' : 'Next'}<//>`}>
      <${QHead} />
      ${q.media ? html`<${MediaClip} m=${q.media} />` : null}
      <p class="p1 qtext">${q.text}</p>
      <${RadioGroup} label=${html`<span class="sr-only">Choose one answer</span>`} value=${sel} onValueChange=${v => { S.sel[q.id] = v; render(); }}>
        ${q.options.map(o => html`<${Radio} key=${o} value=${o} label=${o} />`)}
      <//><//>`;
  }
  function QuestionScreen(){
    const q = Q();
    if (q.practice) return html`<${PracticeQuestion} />`;
    if (q.kind === 'video') return html`<${VideoQuestion} />`;
    return html`<${McqQuestion} />`;
  }

  // Recording: the camera fills the page. Start opened it; Stop is where Start was.
  function RecordScreen(){
    // The recorder needs the canvas to exist, so it starts once this screen has mounted.
    useEffect(() => { startRecorder(); runRecClock(); startLevel(); }, []);
    const q = Q(), left = q.practice ? null : Math.max(0, S.limitSecs - S.recSecs);
    return html`<${Fragment}>
      <div class="camlayer">
        <${VideoLayer} />
        ${S.hidePreview ? html`<div class="vmsg"><${Icon} name="eye-closed-regular" size=${24} /><span>Preview hidden. You’re still recording.</span></div>` : null}
      </div>
      <div class="camtop">
        <span class="pill"><${CandidateClock} live seconds=${left ?? S.recSecs} size="sm" />${left !== null ? html`<span class="left">left</span>` : null}</span>
        <span class="pill"><${Toggle} size="sm" label="Hide preview" checked=${S.hidePreview} onCheckedChange=${v => { S.hidePreview = v; render(); }} /></span>
      </div>
      <div class="camfoot">
        <div class="float">
          <span class="p3 muted">${q.practice ? 'Practice question · not scored' : `Question ${S.qi} of ${ASSESS.length}`}</span>
          <p id="qtext" class=${'p2' + (S.qExpanded ? '' : ' qline')}>${q.text}</p>
          <${TextLink} as="button" size="sm" aria-expanded=${S.qExpanded} aria-controls="qtext"
            onClick=${() => { S.qExpanded = !S.qExpanded; render(); }}>${S.qExpanded ? 'Show less' : 'Read more'}<//>
        </div>
        <${Cta} onClick=${endRecording}>Stop recording<//>
      </div><//>`;
  }

  // An interruption stops the take and keeps it, and says so.
  function InterruptedScreen(){
    const away = S.interruptReason === 'away', kept = fmt(S.keptSecs);
    return html`<${Page} foot=${html`<${Fragment}>
        <${Cta} onClick=${() => go('test')}>Check my camera and retake<//>
        ${S.keptSecs ? html`<${Cta} variant="secondary-gray" onClick=${() => { S.reviewKept = true; go('review'); }}>Watch what we kept<//>` : null}
      <//>`}>
      <${Head} title=${`Recording stopped at ${kept}`} />
      <div class="vcard">
        <${VideoLayer} frozen />
        ${S.poster ? null : html`<div class="vmsg"><${Icon} name="camera-blocked" size=${24} /><span>Your camera is off</span></div>`}
      </div>
      <p class="p2">${away
        ? 'Switching apps, locking the screen or opening a notification turns the camera off, so we can’t keep recording once that happens.'
        : 'A call, or another app opening the camera, takes it away from this page, and recording stops there.'}
        We kept the ${kept} you’d already recorded. That part of your answer is saved, so the question isn’t lost.</p><//>`;
  }

  function SaveLine(){
    if (S.save === 'saved') return html`<div class="status-line ok" role="status"><${Icon} name="circle-check" size=${16} /><span>Saved automatically</span></div>`;
    if (S.save === 'saving') return html`<div class="status-line" role="status"><${Spinner} size=${16} color="blue" label=${null} /><span>Saving your answer…</span></div>`;
    if (S.save === 'retry') return html`<div class="status-line late" role="status"><${Spinner} size=${16} color="blue" label=${null} /><span>Still saving. Keep this page open.</span></div>`;
    return html`<div class="status-line bad" role="alert"><${Icon} name="circle-exclamation" size=${16} />
      <span>We couldn’t save that answer. Nothing is lost: it’s still here on this page. Check your connection, then
        <${TextLink} as="button" size="md" onClick=${startSave}> try again<//>.</span></div>`;
  }
  function ReviewPlayer(){
    const ref = useRef(null);
    const [t, setT] = useState(0), [dur, setDur] = useState(0), [playing, setPlaying] = useState(false);
    const clip = S.replayOK && S.clipURL;
    useEffect(() => {
      const v = ref.current;
      if (!v) return;
      const sync = () => { setT(v.currentTime || 0); setDur(v.duration); setPlaying(!v.paused); };
      ['timeupdate', 'loadedmetadata', 'play', 'pause'].forEach(e => v.addEventListener(e, sync));
      v.play().catch(() => {});
      return () => ['timeupdate', 'loadedmetadata', 'play', 'pause'].forEach(e => v.removeEventListener(e, sync));
    }, [clip]);
    // MediaRecorder output often reports an infinite duration; fall back to what we timed.
    const total = Number.isFinite(dur) && dur > 0 ? Math.round(dur) : S.takeSecs;
    const toggle = () => { const v = ref.current; if (!v) return; v.paused ? v.play().catch(() => {}) : v.pause(); };
    return html`<div class="vcard">
      <div class="vmedia">${clip
        ? html`<video ref=${ref} src=${S.clipURL} playsInline loop autoPlay muted=${!S.stream} aria-label="Your recording"></video>`
        : S.poster ? html`<img src=${S.poster} alt="The last frame of your recording" />` : null}</div>
      ${clip ? html`<div class="vcenter"><${IconButton} variant="overlay" shape="round" aria-label=${playing ? 'Pause' : 'Play'} aria-pressed=${playing}
        icon=${playing ? 'pause' : html`<${Fragment}>${svg('play', 16)}<//>`} onClick=${toggle} /></div>` : html`<div class="vtop"><${Chip} color="gray" size="sm">Playback isn’t available in this preview<//></div>`}
      <div class="vstrip">
        <${CandidateClock} seconds=${Math.floor(t)} total=${total} mutedTotal size="sm" />
        <${CandidateSoundwave} mode="playback" barCount=${20} progress=${total ? Math.min(1, t / total) : 0} label="Playback progress" />
      </div>
    </div>`;
  }
  // After Stop recording. In onboarding it says that is how every answer works; in the
  // assessment it is the saved response with Retake and Next. Next waits for the save.
  function ReviewScreen(){
    const q = Q(), kept = S.reviewKept, locked = S.save !== 'saved';
    const practice = q.practice;
    const forward = practice
      ? html`<${Cta} variant=${kept ? 'secondary-gray' : 'primary'} disabled=${locked} onClick=${() => go('countdown')}>Start assessment<//>`
      : html`<${Cta} variant=${kept ? 'secondary-gray' : 'primary'} disabled=${locked} onClick=${nextQuestion}>Next<//>`;
    const again = html`<${Cta} variant=${kept ? 'primary' : 'secondary-gray'} onClick=${() => go('question')}>${practice ? 'Practice again' : 'Retake'}<//>`;
    return html`<${Page} foot=${kept ? html`<${Fragment}>${again}${forward}<//>` : html`<${Fragment}>${forward}${again}<//>`}>
      ${kept
        ? html`<${Head} title="Here’s what we kept">
            <p class="p2">This is the part of your answer we saved before the recording stopped.</p><//>`
        : practice
          ? html`<${Head} title="That’s how it’s done" icon=${html`<${Icon} name="circle-check" size=${24} />`}>
              <p class="p2">Your answer is saved automatically, so there’s nothing to submit. Watch it back, then practice again or start the assessment when you’re ready.</p><//>`
          : html`<${Head} title="Your response has been saved" icon=${html`<${Icon} name="circle-check" size=${24} />`}>
              <p class="p2">Watch it back, or retake it if you’d like to try again.</p><//>`}
      <${ReviewPlayer} />
      <${SaveLine} /><//>`;
  }

  function CountdownScreen(){
    return html`<${Page} mid>
      <div class="centre">
        <h1 class="h4 ttl">Starting your assessment</h1>
        <p class="p2">Get comfortable. The timer starts when the first question appears.</p>
        <${ProgressIndicator} type="circular" value=${S.count} max=${5} valueText=${S.count} label="Starting your assessment in" />
      </div><//>`;
  }

  /* ================= Network error ================= */
  // After a long loss of connection, in the layout of the Proctoring Attendee error screen.
  function NetErrorScreen(){
    const lost = S.neterrKind === 'lost';
    return html`<${Page} mid foot=${html`<${Fragment}>
        <${Cta} onClick=${retryNet}>Retry<//>
        <${FootLink} onClick=${() => helpFlow('net')}>Need help?<//>
      <//>`}>
      <div class="art"><${NetArt} /></div>
      <div class="centre">
        <h1 class="h4 ttl">Error occurred</h1>
        <p class="p2">We couldn’t load the page. Check your network connection and refresh to try again.</p>
        ${lost && P.onboarded ? html`<p class="p3 muted">Your saved answers are kept. The answer you’re giving right now isn’t saved, so you’ll answer this question again.</p>` : null}
        ${S.retryFail ? html`<div class="status-line bad" role="alert"><${Icon} name="circle-exclamation" size=${16} /><span>Still no connection. Check your network and retry.</span></div>` : null}
      </div><//>`;
  }

  /* ================= Wrap-up ================= */
  function FinishScreen(){
    return html`<${Page} foot=${html`<${Fragment}>
        <${Cta} onClick=${finishAssessment}>Finish assessment<//>
        <${Cta} variant="secondary-gray" onClick=${() => { S.qi = QS.length - 1; go('question'); }}>Not yet<//>
      <//>`}>
      <${Head} title="Finish your assessment?">
        <p class="p2">You’ve been through all ${ASSESS.length} questions. Once you finish, you can’t change your answers.</p>
      <//>
      <div>${ASSESS.map((q, i) => {
        const done = q.kind === 'video' ? !!P.answers[q.id]?.saved : P.answers[q.id]?.value != null;
        return html`<div class="rrow" key=${q.id}><div class="l"><span class="l1">Question ${i + 1}</span><span class="p3 muted">${q.skill}</span></div>
          ${done ? html`<${Chip} color="green" size="sm" icon=${html`<${Icon} name="check" size=${12} />`}>Saved<//>` : html`<${Chip} color="gray" size="sm">Not answered<//>`}</div>`;
      })}</div><//>`;
  }

  function SavingScreen(){
    const steps = ['Saving your answers', 'Checking your responses', 'Preparing your result'];
    return html`<${Page} mid>
      <div class="art"><img src="tessera/assets/illustrations/success.svg" alt="" /></div>
      <${Head} title="Saving your assessment"><p class="p2">Rechecking your answers and wrapping things up.</p><//>
      <ul class="checklist p2" aria-live="polite">${steps.map((t, i) => {
        const s = S.saveStep > i ? 'done' : S.saveStep === i ? 'act' : 'pend';
        const mark = s === 'done' ? html`<${Icon} name="circle-check" size=${16} />` : s === 'act' ? html`<${Spinner} size=${16} color="blue" label=${null} />` : html`<span class="dot"></span>`;
        return html`<li key=${i} class=${s}>${mark}<span>${t}</span></li>`;
      })}</ul><//>`;
  }

  function ScoreScreen(){
    const rs = results(), graded = rs.filter(r => r.status !== 'review');
    const right = graded.filter(r => r.status === 'correct').length, cleared = right >= 2;
    const chip = st => st === 'correct' ? html`<${Chip} color="green" size="sm" icon=${html`<${Icon} name="check" size=${12} />`}>Correct<//>`
      : st === 'wrong' ? html`<${Chip} color="red" size="sm">Incorrect<//>` : html`<${Chip} color="gray" size="sm">In review<//>`;
    return html`<${Page} foot=${html`<${Cta} onClick=${() => go('feedback')}>Next<//>`}>
      <${Head} title="Your result">
        <p class="bigscore">${right}/${graded.length}</p>
        <p class="p2">${cleared ? 'You’ve cleared this assessment.' : 'You didn’t reach the passing score this time.'} Your video response will be reviewed by the hiring team.</p>
      <//>
      <div>${rs.map((r, i) => html`<div class="rrow" key=${r.q.id}><div class="l"><span class="l1">Question ${i + 1}</span><span class="p3 muted">${r.q.skill}</span></div>${chip(r.status)}</div>`)}</div>
      ${cleared ? html`<div class="cert"><span class="p3 muted">This certifies that</span><span class="t">John Carter</span>
        <span class="p3 muted">has completed the requirements of</span><span class="l1">Async Skills Assessment</span><span class="h5 ttl">Certificate of Completion</span></div>` : null}<//>`;
  }

  const RATINGS = [['😠', 'Very bad'], ['🙁', 'Bad'], ['😐', 'Average'], ['🙂', 'Good'], ['😄', 'Very good']];
  const LIKED = ['User-friendly interface', 'Clear instructions', 'Smooth navigation', 'Other'];
  function FeedbackScreen(){
    const f = S.fb;
    return html`<${Page} foot=${html`<${Fragment}>
        <${Cta} disabled=${f.rating === null} onClick=${() => go('thanks')}>Submit<//>
        <${Cta} variant="secondary-gray" onClick=${() => go('thanks')}>Skip<//>
      <//>`}>

      <${Head} title="How was your experience with us?" />
      <div class="rate" role="radiogroup" aria-label="Rate your experience">${RATINGS.map(([e, l], i) => html`<button key=${l} type="button" role="radio" aria-checked=${f.rating === i}
        onClick=${() => { f.rating = i; render(); }}><span class="e" aria-hidden="true">${e}</span>${l}</button>`)}</div>
      <div style=${{display:'grid', gap:'var(--space-2)'}}>
        <span class="l1 ttl">What did you enjoy?</span>
        <div class="tags">${LIKED.map(l => html`<${Tag} key=${l} variant="secondary" color="blue" size="md" selected=${f.liked.includes(l)}
          onSelectedChange=${on => { f.liked = on ? [...f.liked, l] : f.liked.filter(x => x !== l); render(); }}>${l}<//>`)}</div>
      </div>
      <${TextArea} label="Additional feedback" optional rows=${4} placeholder="Let us know what we did well and what we can do better" value=${f.text} onValueChange=${v => { f.text = v; }} /><//>`;
  }

  function ThanksScreen(){
    return html`<${Page} mid>
      <div class="art"><img src="tessera/assets/illustrations/bye.svg" alt="" /></div>
      <div class="centre"><h1 class="h4 ttl">Thank you!</h1><p class="p2">You may close this window now.</p></div><//>`;

  function Screen(){
    switch (S.state){
      case 'wait': return html`<${WaitScreen} />`;

  /* ---------- The browser's own permission dialogs (not Tessera: drawn after the platform) ---------- */
  function Dialog(){

      <div class="dlg-ios" role="dialog" aria-label="Safari permission request">

      </div>

      <div class="dlg-site" role="dialog" aria-label="Chrome permission request">
        <div class="ico">${svg('video', 16)}${svg('mic', 16)}</div>

          <button onClick=${dialogDeny} type="button">Don’t allow</button>
        </div>
      </div>
      <p class="dlg-note">Simulated. Android draws this one. It comes after the site is allowed.</p></div></div>`;

  /* ================= Prototype controls (not part of the design) ================= */
  // UX-1224 points: 1 page after OTP feels stuck · 2 practice gives no direction · 3 tracker skips a step · 4 10–30s waits
  const TICKET = {
    wait:'#1 + #4: loading steps replace the blank page. After a reload it says it is picking up where you left off.',
    neterror:'After a long loss of connection the page is replaced by an error screen. Retry reloads: saved answers and onboarding are kept, the answer in progress is not.',
    permission:'Same order as web. Continue hands off to the browser’s own dialog, so it says Continue, not Allow: the real Allow comes next and two in a row reads as being asked twice.',
    blocked:'Laid out like the Proctoring Attendee blocked screen: picture, a plain explanation, Retry, another device, and the how-to pinned at the foot.',
    otherdevice:'The way out when this phone cannot allow the camera: carry on from another device.',
    test:'The camera fills the page, with the top bar and the footer over it. Continue stays locked until the mic is heard.',
    question:'The question comes first. In onboarding Start recording opens the camera; in the real assessment the preparation time runs here and fills the button.',
    record:'Stop recording sits where Start recording was. The question rides over the camera; Read more opens it in place.',
    interrupted:'A call or a tapped notification ends the camera track. Stop, keep the take, and say what was kept.',
    review:'Stop recording saves the answer. Next and Retake (or Start assessment and Practice again) wait on the save.',
    countdown:'A short countdown so the start of the timer is never a surprise.',
    finish:'Finishing cannot be undone, so it asks once and shows what was saved.',
    saving:'The first of the wrap-up screens from the Test Taker Experience file.',
    score:'Result, per question, and the certificate when the passing score is reached. The video response is marked as in review.',
    feedback:'Rating, what they enjoyed, optional notes. Submit waits for a rating; Skip does not.',
    thanks:'End of the flow.'
  };
  const SCREENS = [
    ['Onboarding', [['wait', 'Loading'], ['permission', 'Allow access'], ['blocked', 'Blocked'], ['otherdevice', 'Another device'], ['test', 'Camera and mic test'],
      ['practice-q', 'Practice question'], ['practice-rec', 'Practice recording'], ['practice-review', 'Practice review'], ['countdown', 'Countdown']]],
    ['Assessment', [['mcq', 'Multiple choice'], ['media', 'Multimedia question'], ['video-q', 'Video question'], ['video-rec', 'Video recording'], ['video-review', 'Video review'], ['finish', 'Finish']]],
    ['Wrap-up', [['saving', 'Saving'], ['score', 'Result'], ['feedback', 'Feedback'], ['thanks', 'Thank you']]],
    ['States', [['interrupted', 'Interrupted'], ['neterror', 'Network error']]]
  ];
  function curKey(){
    const q = QS[S.qi];
    switch (S.state){
      case 'question': return q.practice ? 'practice-q' : q.kind === 'video' ? 'video-q' : q.kind === 'media' ? 'media' : 'mcq';
      case 'record': return q.practice ? 'practice-rec' : 'video-rec';
      case 'review': return q.practice ? 'practice-review' : 'video-review';
      default: return S.state;
    }
  }
  const SAMPLE = {q1:{value:'32'}, q2:{value:'The team ran out of budget'}, q3:{saved:true}, q4:{value:'x = 2'}};
  function jump(key){
    S.inuseCleared = false;
    const at = (i, assess) => {
      S.qi = i; S.assessing = assess;
      if (assess){ P.onboarded = true; P.qi = i; saveP(); startAssessTimer(); } else stopAssessTimer();
    };
    const prefill = () => { P.answers = {...SAMPLE, ...P.answers}; P.onboarded = true; saveP(); };
    switch (key){
      case 'wait': S.resuming = false; S.restoreNote = false; return go('wait');
      case 'permission': S.permitted = false; at(0, false); return go('permission');
      case 'blocked': S.blockedFrom = 'permission'; S.permitted = S.blockedReason === 'inuse'; return go('blocked');
      case 'otherdevice': return go('otherdevice');
      case 'test': S.permitted = true; return go('test');
      case 'practice-q': at(0, false); S.permitted = true; return go('question');
      case 'practice-rec': at(0, false); S.permitted = true; return go('record');
      case 'practice-review': at(0, false); S.permitted = true; S.takeSecs = S.takeSecs || 14; S.poster = S.poster || S.lastFrame; return go('review');
      case 'countdown': at(0, false); return go('countdown');
      case 'mcq': at(1, true); return go('question');
      case 'media': at(2, true); return go('question');
      case 'video-q': at(3, true); S.permitted = true; return go('question');
      case 'video-rec': at(3, true); S.permitted = true; return go('record');
      case 'video-review': at(3, true); S.permitted = true; S.takeSecs = S.takeSecs || 14; S.poster = S.poster || S.lastFrame; return go('review');
      case 'finish': prefill(); at(QS.length - 1, true); P.qi = QS.length; saveP(); return go('finish');
      case 'saving': prefill(); S.assessing = false; return go('saving');
      case 'score': prefill(); S.assessing = false; return go('score');
      case 'feedback': S.assessing = false; return go('feedback');
      case 'thanks': S.assessing = false; return go('thanks');
      case 'interrupted': S.permitted = true; S.keptSecs = S.keptSecs || 14; S.poster = S.poster || S.lastFrame; return go('interrupted');
      case 'neterror': S.neterrKind = 'lost'; S.retryFail = false; return go('neterror');
    }
  }
  function setOpt(key, val){
    if (key === 'osGranted') S.osGranted = val === 'yes';
    else if (key === 'prepSecs' || key === 'limitSecs') S[key] = +val;
    else S[key] = val;
    if (key === 'permMode'){ S.permitted = false; S.inuseCleared = false; }
    if (key === 'voiceMode' && val === 'heard' && S.state === 'test') later(micOk, 600);
    if (key === 'prepSecs' && S.state === 'question') S.prepLeft = S.prepSecs;
    if (key === 'netMode') return netChanged();
    render();
  }
  // One segmented control per setting: Tessera Tabs, primary (pills).
  const Seg = ({label, k, value, opts, hidden}) => hidden ? null : html`<div class="proto-group">
    <span class="proto-label">${label}</span>
    <${Tabs} variant="primary" value=${value} onValueChange=${v => setOpt(k, v)}>
      <${TabList} aria-label=${label}>${opts.map(([v, l]) => html`<${Tab} key=${v} value=${v}>${l}<//>`)}<//>
    <//>
  </div>`;

  function Proto(){
    const cur = curKey();
    return html`<aside class=${'proto' + (S.protoCollapsed ? ' collapsed' : '')} aria-label="Prototype controls">
      <div class="proto-head">
        <span class="proto-title">Prototype · Mobile</span>
        <${Button} variant="tertiary-color" onClick=${() => { S.protoCollapsed = !S.protoCollapsed; render(); }}>${S.protoCollapsed ? 'Show controls' : 'Hide controls'}<//>
        <p class="proto-ticket p3" aria-live="polite"><b>UX-1224</b> ${TICKET[S.state] || ''}</p>
      </div>
      <div class="proto-body">
        ${SCREENS.map(([group, items]) => html`<div class="proto-group" key=${group}>
          <span class="proto-label">${group}</span>
          <${Tabs} variant="vertical" value=${items.some(([k]) => k === cur) ? cur : ''} onValueChange=${jump}>
            <${TabList} aria-label=${group}>${items.map(([k, l]) => html`<${Tab} key=${k} value=${k} onClick=${() => { if (k === cur) jump(k); }}>${l}<//>`)}<//>
          <//>
        </div>`)}
        <${Seg} label="Device" k="platform" value=${S.platform} opts=${[['android', 'Chrome'], ['ios', 'iPhone']]} />
        <${Seg} label="Blocked screen shows" k="blockedReason" value=${S.blockedReason} opts=${[['denied', 'Site'], ['os', 'App'], ['inuse', 'In use']]} />
        <${Seg} label="Site permission" k="permMode" value=${S.permMode} opts=${[['ask', 'Asks'], ['granted', 'Allowed'], ['inuse', 'Camera in use']]} />
        <${Seg} label="Chrome's app permission" k="osGranted" value=${S.osGranted ? 'yes' : 'no'} opts=${[['no', 'Asks the OS'], ['yes', 'Already has it']]} hidden=${S.platform !== 'android'} />
        <${Seg} label="Voice check" k="voiceMode" value=${S.voiceMode} opts=${[['heard', 'Voice heard'], ['silent', 'Silent']]} />
        <${Seg} label="Loading" k="loadMode" value=${S.loadMode} opts=${[['ok', 'Succeeds'], ['fail', 'Fails']]} />
        <${Seg} label="Connection" k="netMode" value=${S.netMode} opts=${[['online', 'Online'], ['poor', 'Weak'], ['offline', 'Offline']]} />
        <${Seg} label="Saving the answer" k="saveMode" value=${S.saveMode} opts=${[['ok', 'Saves'], ['slow', 'Slow'], ['fail', 'Fails']]} />
        <${Seg} label="Prep countdown" k="prepStyle" value=${S.prepStyle} opts=${[['button', 'Fills button'], ['ring', 'Ring'], ['bar', 'Bar']]} />
        <${Seg} label="Prep time" k="prepSecs" value=${String(S.prepSecs)} opts=${[['5', '5s'], ['15', '15s'], ['30', '30s']]} />
        <${Seg} label="Answer time limit" k="limitSecs" value=${String(S.limitSecs)} opts=${[['10', '10s'], ['120', '2 min']]} />
        <div class="proto-group">
          <span class="proto-label">Try it</span>
          <div class="proto-actions">
            ${(S.state === 'record' && S.recording) ? html`<${Fragment}>
              <${Button} variant="secondary-gray" onClick=${() => interrupt('away')}>Leave the page mid-recording<//>
              <${Button} variant="secondary-gray" onClick=${() => interrupt('device')}>Incoming call mid-recording<//><//>` : null}
            <${Button} variant="secondary-gray" onClick=${dropConnection}>Lose connection for a while<//>
            <${Button} variant="secondary-gray" onClick=${reloadResume}>Reload the page<//>
            <${Button} variant="tertiary-color" onClick=${resetProgress}>Reset saved progress<//>
          </div>
        </div>
      </div>
    </aside>`;
  }

  /* ================= App ================= */
  function App(){
    const [, setN] = useState(0);
    bump = () => setN(n => n + 1);
    const stageRef = useRef(null), stackRef = useRef(null), vpRef = useRef(null);
    const [K, setK] = useState(1);
    useEffect(() => {
      const fit = () => {
        const el = stageRef.current;
        if (!el) return;
        const cs = getComputedStyle(el);
        const w = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        const h = el.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
        const d = PHONES[S.platform];
        setK(Math.max(.1, Math.min(1, (w - 26) / d.w, (h - 26) / d.h)));
      };
      fit();
      addEventListener('resize', fit);
      return () => removeEventListener('resize', fit);
    }, [S.platform]);
    // The camera screens lay their picture behind the top bar, so they need its height.
    useEffect(() => { if (stackRef.current && vpRef.current) vpRef.current.style.setProperty('--tsh', stackRef.current.offsetHeight + 'px'); });
    useEffect(() => {
      const onKey = e => { if (e.key === 'Escape' && S.alvyOpen) closeAlvy(); };
      document.addEventListener('keydown', onKey);
      return () => document.removeEventListener('keydown', onKey);
    }, []);
    const d = PHONES[S.platform];
    const camfull = S.state === 'test' || S.state === 'record';
    return html`<div class="app">
      <div class="stage" ref=${stageRef}>
        <div id="phone" role="region" aria-label="Candidate phone screen" style=${{'--pw':d.w + 'px', '--ph':d.h + 'px', '--k':K}}>
          <div id="frame">
            <${ChromeTop} />
            <div id="viewport" ref=${vpRef} class=${camfull ? 'camfull' : ''}>
              <div class="topstack" ref=${stackRef}><${TopNav} /><${Broadcast} /></div>
              <main id="view">
                <${Screen} />
                ${S.alvyOpen ? html`<section class="alvy" aria-label="Chat with Alvy">
                  <${ChatPanel} header=${{title:'Chat with Alvy', icon:html`<${Icon} name="sparkle" size=${18} />`, onClose:closeAlvy, closeLabel:'Close chat'}}
                    messages=${S.alvyMsgs} typing=${S.alvyTyping ? ['Alvy'] : null}
                    composer=${{onSend:sendChat, placeholder:'Ask a question…'}} />
                </section>` : null}
                ${S.dialog ? html`<${Dialog} />` : null}
              </main>
            </div>
            <${ChromeBottom} />
          </div>
        </div>
      </div>
      <${Proto} />
    </div>`;
  }

  // A page that loads with onboarding already done is a reload: rebuild from what was saved.
  if (P.onboarded && !P.finished){ S.resuming = true; S.restoreNote = true; S.assessing = true; S.timeLeft = P.timeLeft; }
  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
  go('wait');
})();
</script>
