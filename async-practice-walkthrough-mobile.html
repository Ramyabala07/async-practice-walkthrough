<title>Async Practice Walkthrough — Mobile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="tessera/tokens.css">
<link rel="stylesheet" href="tessera/bundle.css">
<style>
/* Mobile flow for the Tessera async interview practice run (UX-1224), built on the real
   Tessera components (window.TesseraDS) and the V8 Test Taker Experience mobile frames.

   Layout concept: the phone is a scaled frame on a neutral stage. Inside it, every screen is
   the Figma pattern — top nav, a grey canvas, white bordered cards, and a right-aligned
   footer of 36px Tessera buttons. Nothing here uses a colour or size that is not a Tessera
   token, except the simulated browser chrome and the browser's own permission dialogs,
   which are drawn after Chrome, Android and Safari and are not part of the product UI.

   Light mode only: the app sits under data-theme="light", so a viewer's dark setting
   cannot flip the tokens. */
:root{ --stage-bg:#d4d4d8; color-scheme:light }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:row;font-family:var(--font-sans);font-size:14px;line-height:20px;color:var(--text-body);background:var(--stage-bg);-webkit-font-smoothing:antialiased}
#root{display:flex;flex:1;min-width:0;height:100%}
.app{display:flex;flex:1;min-width:0;height:100%}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

/* ---------- Stage and phone frame ---------- */
.stage{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#phone{position:absolute;left:50%;top:50%;width:var(--pw);height:var(--ph);margin:calc(var(--ph) / -2) 0 0 calc(var(--pw) / -2);
  transform:scale(var(--k,1));transform-origin:50% 50%;background:#000;border-radius:38px;
  box-shadow:0 10px 50px rgba(0,0,0,.28),0 0 0 11px #18181b,0 0 0 12px #3f3f46;overflow:hidden}
#frame{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg-surface);overflow:hidden}
#viewport{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;background:var(--bg-muted)}
#view{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}

/* Simulated browser chrome. Android matches the Figma frames (dark Chrome); iPhone draws
   Safari, because the blocked-permission screens point at its aA control. */
.a-chrome{flex:none;background:#202124;color:#e8eaed;font:500 12px/1 var(--font-sans)}
.a-status{display:flex;align-items:center;justify-content:space-between;height:26px;padding:0 18px}
.a-url{display:flex;align-items:center;gap:8px;padding:2px 10px 8px}
.a-pill{flex:1;min-width:0;display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:999px;background:#3c4043;font:400 13px/1 var(--font-sans);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.a-btn{flex:none;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:#e8eaed}
.a-tabs{width:20px;height:20px;border:1.6px solid #e8eaed;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font:600 11px/1 var(--font-sans)}
.a-nav{flex:none;height:18px;background:var(--bg-surface);display:flex;align-items:center;justify-content:center}
.a-nav span{width:106px;height:4px;border-radius:2px;background:#18181b;opacity:.75}
.notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:108px;height:27px;border-radius:999px;background:#000;z-index:3}
.i-status{flex:none;display:flex;align-items:flex-end;justify-content:space-between;height:46px;padding:0 24px 6px;background:var(--bg-surface);font:600 14px/1 var(--font-sans);color:var(--text-primary)}
.i-bottom{flex:none;background:var(--bg-surface);border-top:1px solid var(--border-subtle)}
.i-url{display:flex;align-items:center;gap:8px;padding:6px 10px}
.i-field{flex:1;min-width:0;display:flex;align-items:center;gap:7px;height:34px;padding:0 10px;border-radius:999px;background:var(--bg-elevated);font:400 12px/18px var(--font-sans);color:var(--text-body)}
.i-aa{font:500 15px/1 var(--font-sans);letter-spacing:-.02em;padding:0 4px;color:var(--text-primary)}
.i-aa b{font-size:11px;font-weight:500}
.i-home{height:22px;display:flex;align-items:flex-start;justify-content:center;padding-top:4px}
.i-home span{width:134px;height:5px;border-radius:3px;background:#18181b;opacity:.85}

/* ---------- Screen layout: the Figma candidate pattern ---------- */
.pg{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg-muted)}
.pg-body{flex:1;min-height:0;overflow:auto;padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
.pg-foot{flex:none;display:flex;justify-content:flex-end;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-4) var(--space-4)}
.pg-foot.col{flex-direction:column;align-items:stretch}
.card{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-xl);padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);min-height:0}
.card.grow{flex:1}
.card h1,.card h2,.card h3,.card h4,.card h5,.card p{margin:0}
.card .ttl{color:var(--text-primary)}
.card .ttl.err{color:var(--error-emphasis)}
.muted{color:var(--text-subtle)}
.cap{display:flex;align-items:center;gap:var(--space-2)}
.centre{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-3);text-align:center;padding:var(--space-4)}
.mark{flex:none;width:48px;height:48px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;background:var(--bg-accent);color:var(--interactive-link)}
.mark.err{background:var(--error-surface);color:var(--error-emphasis)}
.mark svg{width:24px;height:24px}
.steps{margin:0;padding-left:var(--space-5);display:grid;gap:var(--space-2);color:var(--text-body)}
.steps b{font-weight:500;color:var(--text-primary)}
.checklist{list-style:none;margin:0;padding:var(--space-2) var(--space-3);width:100%;text-align:left;background:var(--bg-muted);border:1px solid var(--border-subtle);border-radius:var(--radius-lg)}
.checklist li{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) 0;color:var(--text-primary)}
.checklist li.pend{color:var(--text-subtle)}
.checklist li.done svg{color:var(--success-strong)}
.checklist li.fail{color:var(--error-emphasis)}
.dot{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border-primary)}
.hint{background:var(--bg-accent);border-radius:var(--radius-lg);padding:var(--space-4);text-align:center;color:var(--text-body);display:flex;flex-direction:column;align-items:center;gap:var(--space-2)}
.hint .pair{display:flex;gap:var(--space-2);color:var(--interactive-link)}

/* Device rows: Tessera underline Dropdown plus a status, as in the Figma system checks. */
.drows{display:grid;gap:var(--space-1)}
.drow{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:var(--space-2)}
.drow>svg{color:var(--text-tertiary)}
.dstat{display:inline-flex;align-items:center;gap:6px;min-width:84px;justify-content:flex-end;font:500 12px/18px var(--font-sans);color:var(--text-subtle);white-space:nowrap}
.dstat.ok{color:var(--success-strong)}
.dstat.warn{color:var(--warning-emphasis)}

/* Video card: the Figma recorder, a rounded frame with a dark control strip at the foot. */
.vcard{position:relative;flex:1;min-height:176px;border-radius:var(--radius-lg);overflow:hidden;background:var(--bg-tooltip)}
.vmedia{position:absolute;inset:0}
.vmedia.hidden{visibility:hidden}
.vmedia video,.vmedia canvas,.vmedia img{display:block;width:100%;height:100%;object-fit:cover}
.vmedia video.mirror{transform:scaleX(-1)}
.vmedia.frozen video,.vmedia.frozen img,.vmedia.frozen canvas{filter:grayscale(.55) brightness(.55)}
.vmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-2);padding:var(--space-6);text-align:center;color:var(--text-on-primary)}
.vtop{position:absolute;left:var(--space-2);right:var(--space-2);top:var(--space-2);display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);z-index:2}
.pill{display:inline-flex;align-items:center;background:var(--bg-surface);border-radius:var(--radius-full);padding:0 var(--space-2)}
/* Strip over the video. Re-pointing these tokens keeps the components themselves unmodified. */
.vstrip{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-2) var(--space-3);
  background:var(--bg-overlay-primary);color:var(--text-on-primary);
  --text-tertiary:var(--text-on-primary);--text-primary:var(--text-on-primary);--interactive-link:var(--blue-300)}
.vstrip .say{font:500 14px/20px var(--font-sans);min-width:0}
.vstrip .grp{display:flex;align-items:center;gap:var(--space-2);min-width:0}

.qline{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--text-primary)}
.status-line{display:flex;align-items:flex-start;gap:var(--space-2);font:500 14px/20px var(--font-sans);color:var(--text-body)}
.status-line.ok{color:var(--success-strong)}
.status-line.late{color:var(--warning-emphasis)}
.status-line.bad{color:var(--error-emphasis)}
.status-line svg{flex:none;margin-top:2px}

/* Where to tap, drawn instead of pointed at: a small mock of this browser's own bar. */
.mockbar{display:flex;align-items:center;gap:7px;height:38px;padding:0 10px;border-radius:999px;background:var(--bg-surface);border:1px solid var(--border-primary);font:400 12px/18px var(--font-sans);color:var(--text-subtle)}
.mockbar .url{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mockbar .spot{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 6px;border-radius:8px;background:var(--bg-accent);
  color:var(--interactive-link);box-shadow:0 0 0 2px var(--interactive-link);font:500 14px/1 var(--font-sans)}
.mockbar .spot b{font-size:10px;font-weight:500}
.hintbox{background:var(--bg-muted);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:var(--space-3);display:grid;gap:var(--space-2)}

/* Skeleton for the end of the prototype. */
.skel{display:grid;gap:var(--space-3)}

/* ---------- The browser's own permission dialogs (not Tessera: drawn after the platform) ---------- */
.scrim{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(0,0,0,.45)}
.dlg-site{width:100%;max-width:300px;background:#fff;border-radius:28px;padding:22px 22px 12px;box-shadow:0 16px 48px rgba(0,0,0,.3);color:#1f1f1f}
.dlg-site .ico{display:flex;gap:6px;color:#444746;margin-bottom:12px}
.dlg-site p{margin:0;font:400 16px/22px var(--font-sans)}
.dlg-site .acts{display:flex;justify-content:flex-end;gap:4px;margin-top:16px}
.dlg-site .acts button,.dlg-os .acts button{min-height:44px;padding:0 14px;border:0;border-radius:999px;background:none;color:#0b57d0;font:500 14px/1 var(--font-sans);cursor:pointer}
.dlg-site .acts button:hover,.dlg-os .acts button:hover{background:#e8f0fe}
.dlg-os{width:100%;max-width:300px;background:#fff;border-radius:28px;padding:24px 20px 10px;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,.3);color:#1f1f1f}
.dlg-os .ico{margin:0 auto 16px;color:#444746;display:flex;justify-content:center}
.dlg-os .ico svg{width:34px;height:34px}
.dlg-os p{margin:0;font:400 18px/24px var(--font-sans);text-wrap:balance}
.dlg-os p b{font-weight:500}
.dlg-os .acts{display:grid;margin-top:18px}
.dlg-os .acts button{min-height:52px;border-radius:12px}
.dlg-ios{width:272px;background:rgba(249,249,249,.97);border-radius:14px;overflow:hidden;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dlg-ios .body{padding:19px 16px 15px}
.dlg-ios strong{display:block;font:600 15px/20px var(--font-sans);color:#000}
.dlg-ios .acts{display:flex;border-top:1px solid rgba(60,60,67,.29)}
.dlg-ios .acts button{flex:1;min-height:44px;border:0;background:none;color:#0a7cff;font:400 17px/1 var(--font-sans);cursor:pointer}
.dlg-ios .acts button+button{border-left:1px solid rgba(60,60,67,.29);font-weight:600}
.dlg-note{margin:10px auto 0;max-width:300px;font:400 12px/18px var(--font-sans);color:rgba(255,255,255,.88);text-align:center}

/* ---------- Alvy ---------- */
.alvy{position:absolute;inset:0;z-index:65;display:flex;flex-direction:column;background:var(--bg-surface)}
.alvy>*{flex:1;min-height:0}

/* ---------- Prototype controls (not part of the design) ---------- */
.proto{flex:none;position:relative;z-index:70;width:300px;height:100%;overflow:auto;display:flex;flex-direction:column;background:var(--bg-surface);border-left:1px solid var(--border-primary);color:var(--text-body)}
.proto-head,.proto-body{padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.proto-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:12px;border-bottom:1px solid var(--border-subtle)}
.proto-title{flex:1;font:500 12px/18px var(--font-sans);color:var(--text-primary);letter-spacing:.04em;text-transform:uppercase}
.proto-ticket{flex-basis:100%;margin:0;padding:8px 10px;border-radius:8px;background:var(--bg-muted);color:var(--text-body)}
.proto-ticket b{font-weight:500;color:var(--text-primary)}
.proto-body{display:flex;flex-direction:column;gap:16px;padding-top:14px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.proto.collapsed{width:auto}
.proto.collapsed .proto-body,.proto.collapsed .proto-ticket{display:none}
.proto-group{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.proto-label{font:500 12px/18px var(--font-sans);color:var(--text-subtle)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
@media (max-width:760px){
  body{flex-direction:column}
  .app{flex-direction:column}
  .proto{width:auto;height:auto;max-height:45%;border-left:0;border-top:1px solid var(--border-primary)}
}
</style>

<div id="root" data-theme="light"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script src="tessera/bundle.js"></script>
<script>
(() => {
  const { useState, useEffect, useRef, Fragment } = React;
  const DS = window.TesseraDS;
  const html = htm.bind(React.createElement);
  const { Button, IconButton, Icon, Spinner, Toggle, Dropdown, Chip, Tag, TextLink, Modal,
    CandidateTopNavigation, CandidateClock, CandidateSoundwave, CandidateBanner,
    ProgressIndicator, SkeletonLoader, ChatPanel } = DS;

  /* Glyphs for the simulated browser chrome and the browser's own dialogs. Everything inside
     the product itself uses the Tessera Icon set. */
  const SVG = {
    lock:'<rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
    dots:'<circle cx="12" cy="5" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.4" fill="currentColor" stroke="none"/>',
    share:'<path d="M12 16V4M8 8l4-4 4 4M5 14v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"/>',
    home:'<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',
    sig:'<path d="M2 20h.01M6 20v-4M11 20v-9M16 20V8M21 20V4"/>',
    batt:'<rect x="2" y="7" width="17" height="10" rx="2.5"/><path d="M22 11v2"/><rect x="4" y="9" width="11" height="6" rx="1" fill="currentColor" stroke="none"/>',
    video:'<path d="M15 10l4.553-2.276A1 1 0 0 1 21 8.618v6.764a1 1 0 0 1-1.447.894L15 14v-4z"/><rect x="3" y="6" width="12" height="12" rx="2"/>',
    mic:'<rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M8 21h8M12 17v4"/>',
    play:'<path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/>'
  };
  const svg = (n, size = 16) => html`<svg width=${size} height=${size} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" dangerouslySetInnerHTML=${{__html: SVG[n]}} />`;

  const PHONES = {android:{w:360, h:800}, ios:{w:390, h:844}};
  const SITE = 'cx-v2.talview.com';
  const CAMS = ['Front camera', 'Back camera'];
  const MICS = ['Phone microphone', 'AirPods Pro', 'Wired headset'];
  const WAIT_LABELS = ['Email verified', 'Loading your assessment', 'Preparing your practice run'];
  const QUESTION = 'Tell us about a project you’re proud of and what you learned from it.';

  /* An in-app browser (a link tapped inside Gmail, LinkedIn, WhatsApp) runs in a webview where
     getUserMedia is often unavailable, and fails without drawing a prompt — the shape that
     matches the candidates who produce neither an allow nor a deny. This is a heuristic and
     only a heuristic: user-agent strings are not a contract. It warns early because a false
     positive costs one screen and a false negative costs the candidate. Check it against real
     UA data before trusting any number it produces. */
  function detectWebview(){
    const ua = navigator.userAgent || '';
    if (/; wv\)|\bwv\b/.test(ua)) return true;
    if (/FBAN|FBAV|Instagram|LinkedInApp|Line\/|MicroMessenger|Snapchat|Twitter|WhatsApp|GSA\//i.test(ua)) return true;
    if (/iPhone|iPad|iPod/.test(ua) && !/Safari|CriOS|FxiOS|EdgiOS|OPiOS/.test(ua)) return true;
    return false;
  }

  /* ================= State =================
     One mutable store, rendered by React. Media elements are children of components that stay
     mounted across repaints, so a repaint can no longer replace the canvas the recorder reads. */
  const S = {
    state:'wait', platform:'android',
    dialog:null,                 // 'site' | 'os-cam' | 'os-mic' — the browser's own UI
    osGranted:false,
    permMode:'ask', voiceMode:'heard', loadMode:'ok',
    appMode:detectWebview() ? 'inapp' : 'browser',
    netMode:'online', online:navigator.onLine !== false,
    saveMode:'ok', save:'saving',
    prepSecs:10, prepLeft:10,
    permitted:false, blockedReason:'denied', inuseCleared:false,
    heard:false, micFailed:false, recording:false, hidePreview:false,
    interruptReason:'away', keptSecs:0, takeSecs:0, pendingInterrupt:false, lastFrame:null,
    qOpen:false, alvyOpen:false, alvyMsgs:[], alvyTyping:false,
    recSecs:0, cam:0, mic:0, count:5, waitItems:['done', 'act', 'pend'],
    stream:null, audioCtx:null, analyser:null, abuf:null, level:0, realFailed:false,
    recorder:null, chunks:[], clipURL:null, poster:null, replayOK:false,
    protoCollapsed:false
  };
  let bump = () => {};
  const render = () => bump();

  let timers = [], intervals = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const every = (fn, ms) => intervals.push(setInterval(fn, ms));
  const clearTimers = () => { timers.forEach(clearTimeout); intervals.forEach(clearInterval); timers = []; intervals = []; };
  const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

  const showPreview = () => (S.state === 'test' || S.state === 'record') && S.permitted;
  const KEEP_CLIP = ['review', 'interrupted'];   // states that must not throw the take away
  const NO_CAMERA = ['wait', 'waitError', 'webview', 'permission', 'blocked', 'interrupted', 'countdown', 'assessment'];
  const online = () => S.netMode === 'offline' ? false : S.online;
  const BROWSER = () => S.platform === 'ios' ? 'Safari' : 'Chrome';

  function go(next){
    clearTimers();
    stopRecorder(true);
    S.state = next;
    S.recording = next === 'record';   // the record screen IS the recording
    S.qOpen = false;
    S.dialog = null;
    S.pendingInterrupt = false;
    if (!KEEP_CLIP.includes(next)) dropClip();
    if (next === 'wait') S.waitItems = ['done', 'act', 'pend'];
    if (next === 'test'){ S.heard = false; S.micFailed = false; }
    if (next === 'question') S.prepLeft = S.prepSecs;
    if (next === 'record'){ S.recSecs = 0; S.hidePreview = false; S.lastFrame = null; }
    if (NO_CAMERA.includes(next)) stopStream();
    if (next === 'countdown') S.count = 5;
    render();
    enter(next);
  }

  // Entering the record screen starts the recording, but not here: the recorder needs the
  // canvas to exist, so the record screen starts it once it has mounted (see RecordScreen).
  function beginTake(){ (canUseCamera() && !S.stream) ? go('test') : go('record'); }

  function enter(st){
    if (st === 'wait'){
      // Prototype stand-in: production drives these from real loading milestones.
      later(() => {
        if (S.loadMode === 'fail'){ S.waitItems = ['done', 'fail', 'pend']; go('waitError'); return; }
        S.waitItems = ['done', 'done', 'act']; render();
      }, 1400);
      later(() => { S.waitItems = ['done', 'done', 'done']; render(); }, 2600);
      later(() => go(S.appMode === 'inapp' ? 'webview' : 'permission'), 3200);
    }
    if (st === 'test'){
      if (canUseCamera() && !S.stream) acquire().catch(() => {});
      startLevel();
      if (S.voiceMode === 'heard' && !S.analyser) later(micOk, 2600);
      later(() => { if (!S.heard) micNone(); }, 7000);
    }
    if (st === 'question'){
      // The prep time: the system starts recording by itself when it runs out.
      every(() => {
        S.prepLeft--;
        if (S.prepLeft <= 0){ beginTake(); return; }
        render();
      }, 1000);
    }
    if (st === 'review') startSave();
    if (st === 'countdown'){

    if (s === 'testing') return html`<span class="dstat"><${Spinner} size=${12} color="blue" label=${null} />Testing</span>`;
    if (s === 'req') return html`<span class="dstat"><${Spinner} size=${12} color="blue" label=${null} />Requesting permission</span>`;
    return html`<span class="dstat">Waiting for permission</span>`;
  }
  function DeviceRow({kind, status, disabled}){
    const cam = kind === 'cam', names = cam ? CAMS : MICS, idx = cam ? S.cam : S.mic;
    return html`<div class="drow">
      <${Icon} name=${cam ? 'video-camera' : 'microphone'} size=${16} />
      <${Dropdown} variant="underline" aria-label=${cam ? 'Camera' : 'Microphone'} disabled=${disabled}
        options=${names.map((n, i) => ({value:String(i), label:n}))} value=${String(idx)}
        onValueChange=${v => { if (cam) S.cam = +v; else S.mic = +v; render(); }} />
      <${DevStatus} s=${status} />
    </div>`;
  }

  /* ---- camera media: the live video or the sample preview, always mounted as one element ---- */
  function SimCanvas(){
    const ref = useRef(null);
    useEffect(() => { const el = ref.current; startSim(el); return () => stopSim(el); }, []);
    return html`<canvas id="simCam" ref=${ref} role="img" aria-label="Sample camera preview"></canvas>`;
  }
  function VideoLayer({frozen}){
    const vref = useRef(null);
    useEffect(() => {
      const v = vref.current;
      if (v && S.stream && v.srcObject !== S.stream){ v.srcObject = S.stream; v.play?.().catch(() => {}); }
    });
    const hidden = S.hidePreview && S.state === 'record';
    let inner = null;
    if (S.state === 'interrupted') inner = S.poster ? html`<img src=${S.poster} alt="The last frame before the recording stopped" />` : null;
    else if (showPreview()) inner = S.stream
      ? html`<video id="liveVideo" ref=${vref} class="mirror" autoPlay muted playsInline aria-label="Your camera preview"></video>`
      : html`<${SimCanvas} />`;
    return html`<div class=${'vmedia' + (hidden ? ' hidden' : '') + (frozen ? ' frozen' : '')}>${inner}</div>`;
  }
  const simChip = () => (showPreview() && !S.stream) ? html`<${Chip} color="gray" size="sm">Sample preview<//>` : null;

  // Live microphone level, polled on its own so the screen is not repainted at 12fps.
  function LiveWave({bars = 22}){
    const [lv, setLv] = useState([]);
    useEffect(() => {
      const id = setInterval(() => setLv(p => [...p.slice(-(bars - 1)), S.level]), 90);
      return () => clearInterval(id);
    }, []);
    return html`<${CandidateSoundwave} levels=${lv} barCount=${bars} label="Microphone level" />`;
  }

  /* ================= Screens ================= */
  function WaitScreen(){
    const err = S.state === 'waitError';
    const SR = {done:'done', act:'in progress', pend:'not started', fail:'failed'};
    return html`<${Page} foot=${err ? html`<${Button} onClick=${() => location.reload()}>Try again<//>` : null}>
      <section class="card grow centre">
        ${err ? html`<span class="mark err"><${Icon} name="circle-exclamation" size=${24} /></span>` : html`<${Spinner} size=${48} color="blue" label="Loading your assessment" />`}

        <p class="p2">${err ? 'Check your internet connection, then try again.' : 'This can take up to 30 seconds. Keep this page open.'}</p>
        <ul class="checklist p2" aria-live="polite">
          ${WAIT_LABELS.map((t, i) => {
            const s = S.waitItems[i];

              : s === 'act' ? html`<${Spinner} size=${16} color="blue" label=${null} />`
              : s === 'fail' ? html`<${Icon} name="circle-xmark" size=${16} />`

            return html`<li key=${i} class=${s}>${mark}<span>${t}</span><span class="sr-only">, ${SR[s]}</span></li>`;
          })}
        </ul>
      </section><//>`;

  // Caught before the permission ask, not after: being wrong costs one screen, being right
  // saves a candidate from a camera that never starts and never explains itself.
  function WebviewScreen(){
    const ios = S.platform === 'ios', name = BROWSER();
    return html`<${Page} footClass="col" foot=${html`<${Fragment}>
        <${Button} variant="secondary-gray" fullWidth onClick=${() => go('permission')}>My camera works — continue<//>
        <p class="p3 muted" style=${{margin:0, textAlign:'center'}}>We can’t always tell which app you’re in. If recording works for you, carry on.</p>
      <//>`}>
      <section class="card grow">
        <span class="mark err"><${Icon} name="open-link" size=${24} /></span>

        <${Steps} items=${ios
          ? ['Tap the <b>⋯</b> or share button, usually at the bottom of the screen.', 'Choose <b>Open in Safari</b>.', 'Sign in again if you’re asked. You’ll land right back here.']
          : ['Tap the <b>⋮</b> menu at the top right of the screen.', 'Choose <b>Open in Chrome</b>.', 'Sign in again if you’re asked. You’ll land right back here.']} />
        <${CopyLink} name=${name} />
      </section><//>`;
  }
  function CopyLink({name}){
    const [msg, setMsg] = useState('');
    const copy = () => {
      const p = navigator.clipboard?.writeText?.(location.href);
      if (p) p.then(() => setMsg('Link copied'), () => setMsg('Copy the address from the bar instead'));
      else setMsg('Copy the address from the bar instead');
    };
    return html`<${TextLink} as="button" leadingIcon=${html`<${Icon} name="link" />`} onClick=${copy}>${msg || `Or copy the link and paste it into ${name}`}<//>`;
  }

  // Permissions first, as on web. The Figma system check shows this same moment: a calm
  // panel explaining the ask, and the device rows waiting on permission.
  function PermissionScreen(){
    const req = !!S.dialog;
    return html`<${Page} foot=${html`<${Button} onClick=${askPermission}>Continue<//>`}>
      <section class="card grow">
        <h1 class="h4 ttl">Allow camera and microphone</h1>
        <p class="p2">You answer this assessment by recording video, so we need your camera and microphone. Your browser will ask for permission.</p>
        <div class="hint">
          <span class="pair"><${Icon} name="video-camera" size=${24} /><${Icon} name="microphone" size=${24} /></span>
          <p class="p2">${S.platform === 'android'

  // Test device: the same step as web, as its own screen. Next stays locked until the mic is heard.
  function TestScreen(){
    const mic = S.heard ? 'ok' : S.micFailed ? 'quiet' : 'testing';
    return html`<${Page} foot=${html`<${Button} disabled=${!S.heard} onClick=${() => go('question')}>Next<//>`}>
      <section class="card grow">
        <h1 class="h4 ttl">Check your camera and microphone</h1>
        <p class="p2">We’ll make sure we can see and hear you before you start.</p>
        <div class="vcard">
          <${VideoLayer} />
          ${showPreview() ? null : html`<div class="vmsg"><${Spinner} size=${24} color="white" label=${null} /><span>Starting your camera…</span></div>`}
          <div class="vtop"><${Chip} color="gray" size="sm">Not recording<//>${simChip()}</div>

      </section><//>`;
  }

  // The preparation time: the system starts recording on its own when it runs out. The
  // onboarding on web never explains this, so this screen does.
  function QuestionScreen(){
    return html`<${Page} foot=${html`<${Button} onClick=${beginTake}>Start now<//>`}>
      <section class="card grow">
        <div class="cap"><${Chip} color="blue" variant="secondary" size="sm">Practice · not scored<//></div>
        <h1 class="h3 ttl">${QUESTION}</h1>
        <div class="centre">
          <${ProgressIndicator} type="circular" value=${S.prepSecs - S.prepLeft} max=${S.prepSecs} valueText=${S.prepLeft}

        </div>

  // Recording: Start and Stop are the same labelled button in the same place.
  function RecordScreen(){
    // The recorder needs the canvas to exist, so it starts once this screen has mounted.
    useEffect(() => { startRecorder(); runRecClock(); startLevel(); }, []);
    const close = () => { S.qOpen = false; render(); };
    return html`<${Fragment}>
      <${Page}>
        <section class="card">
          <div class="cap"><${Chip} color="blue" variant="secondary" size="sm">Practice · not scored<//></div>
          <p class="p2 qline">${QUESTION}</p>

        </section>
        <div class="vcard">
          <${VideoLayer} />
          ${S.hidePreview ? html`<div class="vmsg"><${Icon} name="eye-closed-regular" size=${24} /><span>Preview hidden. You’re still recording.</span></div>` : null}
          <div class="vtop"><span class="pill"><${CandidateClock} live seconds=${S.recSecs} size="sm" /></span>${simChip()}</div>
          <div class="vstrip">

          </div>
        </div>
      <//>
      <${Modal} open=${S.qOpen} onOpenChange=${o => { S.qOpen = o; render(); }} portal=${false} title="Practice question"

    <//>`;

  // An interruption stops the take and keeps it, and says so.
  function InterruptedScreen(){
    const away = S.interruptReason === 'away', kept = fmt(S.keptSecs);
    return html`<${Page} footClass="col" foot=${html`<${Fragment}>
        <${Button} fullWidth onClick=${() => go('test')}>Check my camera and retake<//>
        ${S.keptSecs ? html`<${Button} variant="secondary-gray" fullWidth onClick=${() => go('review')}>Watch what we kept<//>` : null}
      <//>`}>
      <section class="card grow">
        <h1 class="h4 ttl">Recording stopped at ${kept}</h1>
        <div class="vcard">
          <${VideoLayer} frozen />
          ${S.poster ? null : html`<div class="vmsg"><${Icon} name="camera-blocked" size=${24} /><span>Your camera is off</span></div>`}
        </div>
        <p class="p2">${away
          ? 'Switching apps, locking the screen or opening a notification turns the camera off, so we can’t keep recording once that happens.'
          : 'A call, or another app opening the camera, takes it away from this page, and recording stops there.'}</p>
        <p class="p2">We kept the ${kept} you’d already recorded. In the real assessment that part of your answer is saved, so the question isn’t lost.</p>
      </section><//>`;

  function SaveLine(){
    if (S.save === 'saved') return html`<div class="status-line ok" role="status"><${Icon} name="circle-check" size=${16} /><span>Saved automatically</span></div>`;
    if (S.save === 'saving') return html`<div class="status-line" role="status"><${Spinner} size=${16} color="blue" label=${null} /><span>Saving your answer…</span></div>`;
    if (S.save === 'retry') return html`<div class="status-line late" role="status"><${Spinner} size=${16} color="blue" label=${null} /><span>Still saving. Keep this page open.</span></div>`;
    return html`<div class="status-line bad" role="alert"><${Icon} name="circle-exclamation" size=${16} />
      <span>We couldn’t save that answer. Nothing is lost: it’s still here on this page. Check your connection, then
        <${TextLink} as="button" size="md" onClick=${startSave}> try again<//>.</span></div>`;
  }
  function ReviewPlayer(){
    const ref = useRef(null);
    const [t, setT] = useState(0), [dur, setDur] = useState(0), [playing, setPlaying] = useState(false);
    const clip = S.replayOK && S.clipURL;
    useEffect(() => {
      const v = ref.current;
      if (!v) return;
      const sync = () => { setT(v.currentTime || 0); setDur(v.duration); setPlaying(!v.paused); };
      ['timeupdate', 'loadedmetadata', 'play', 'pause'].forEach(e => v.addEventListener(e, sync));
      v.play().catch(() => {});
      return () => ['timeupdate', 'loadedmetadata', 'play', 'pause'].forEach(e => v.removeEventListener(e, sync));
    }, [clip]);
    // MediaRecorder output often reports an infinite duration; fall back to what we timed.
    const total = Number.isFinite(dur) && dur > 0 ? Math.round(dur) : S.takeSecs;
    const toggle = () => { const v = ref.current; if (!v) return; v.paused ? v.play().catch(() => {}) : v.pause(); };
    return html`<div class="vcard">
      <div class="vmedia">${clip
        ? html`<video ref=${ref} src=${S.clipURL} playsInline loop autoPlay muted=${!S.stream} aria-label="Your practice recording"></video>`
        : S.poster ? html`<img src=${S.poster} alt="The last frame of your practice recording" />` : null}</div>
      ${clip ? null : html`<div class="vtop"><${Chip} color="gray" size="sm">Playback isn’t available in this preview<//></div>`}
      <div class="vstrip">
        <div class="grp">
          ${clip ? html`<${IconButton} variant="tertiary-gray" aria-label=${playing ? 'Pause' : 'Play'} aria-pressed=${playing}
            icon=${playing ? 'pause' : html`<${Fragment}>${svg('play', 16)}<//>`} onClick=${toggle} />` : null}
          <${CandidateClock} seconds=${Math.floor(t)} total=${total} mutedTotal size="sm" />
        </div>
        <${CandidateSoundwave} mode="playback" barCount=${20} progress=${total ? Math.min(1, t / total) : 0} label="Playback progress" />
      </div>
    </div>`;
  }
  // Stop recording saved the answer. Retake and Next are the two actions, as on web; Next is
  // held until the save has landed, because an invisible save that fails is worse than a visible one.
  function ReviewScreen(){
    return html`<${Page} foot=${html`<${Fragment}>
        <${Button} variant="secondary-gray" onClick=${() => go('question')}>Retake<//>
        <${Button} disabled=${S.save !== 'saved'} onClick=${() => go('countdown')}>Next<//>
      <//>`}>
      <section class="card grow">
        <h1 class="h4 ttl">Review your answer</h1>
        <p class="p2">Play it back to check we captured you clearly. Your answers save as you go, so there’s nothing to submit.</p>
        <${ReviewPlayer} />
        <${SaveLine} />

  }

  const MockBar = () => S.platform === 'android'
    ? html`<div class="hintbox"><span class="l2">Look at the top of your screen</span>

    : html`<div class="hintbox"><span class="l2">Look at the bottom of your screen</span>
        <div class="mockbar"><span class="spot">a<b>A</b></span><span class="url">${SITE}</span>${svg('share', 16)}</div></div>`;
  function BlockedScreen(){
    const c = blockedCopy();
    return html`<${Page} foot=${html`<${Button} onClick=${() => { S.inuseCleared = true; S.permitted = false; go('permission'); }}>Try again<//>`}>
      <section class="card grow">
        <span class="mark err"><${Icon} name="camera-blocked" size=${24} /></span>
        <h1 class="h4 ttl err">${c.title}</h1>

  function CountdownScreen(){
    return html`<${Page}><section class="card grow centre">
      <h1 class="h4 ttl">Starting your assessment</h1>

    <//><//>`;

  function AssessmentScreen(){

  function Screen(){

  /* ---------- The browser's own permission dialogs (not Tessera: drawn after the platform) ---------- */
  function Dialog(){

      <div class="dlg-ios" role="dialog" aria-label="Safari permission request">

      </div>

    const cam = S.dialog === 'os-cam';

  function OfflineBanner(){
    if (online()) return null;
    const msg = S.state === 'record' ? 'Keep recording. We’ll save this when you’re back.'
      : S.state === 'review' ? 'Your answer saves as soon as you’re back online.'
      : 'We’re attempting to reconnect.';

  }

  /* ================= Prototype controls (not part of the design) ================= */
  // UX-1224 points: 1 page after OTP feels stuck · 2 practice gives no direction · 3 tracker skips a step · 4 10–30s waits
  const TICKET = {
    wait:'#1 + #4: a wait screen with live loading steps replaces the blank page.',
    waitError:'#4: if loading fails, say so and offer Try again instead of an endless spinner.',
    webview:'Most of the drop at the permission step fires no event at all, not even a refusal. An in-app browser that silently has no camera fits that shape. Caught here, before it costs them a step.',
    permission:'Same order as web. Continue hands off to the browser’s own dialog, so it says Continue, not Allow: the real Allow comes next and two in a row reads as being asked twice.',
    blocked:'#2: a blocked or busy camera gets its own screen, with the steps for this phone and a drawing of where to tap.',
    test:'Same step as web, as its own screen. Next stays locked until the mic is heard, so nobody records without having proved the mic works.',
    question:'The question is read with the camera off. Recording starts by itself when the prep time ends, as in the real assessment, or on Start now.',
    record:'Start and Stop are the same labelled button in the same place, so the thumb never moves. The question stays one tap away.',
    interrupted:'A call or a tapped notification ends the camera track. Stop, keep the take, and say what was kept.',
    review:'Stop recording saves the answer. Retake and Next are the two actions, as on web. Next is held until the save lands.',
    countdown:'#4: a short countdown so the start of the timer is never a surprise.',
    assessment:'End of the flow.'
  };
  const CHIPS = [['wait', 'Loading'], ['webview', 'In-app browser'], ['permission', 'Permissions'], ['blocked', 'Blocked'], ['test', 'Test device'],
    ['question', 'Question'], ['record', 'Record'], ['interrupted', 'Interrupted'], ['review', 'Review'], ['countdown', 'Countdown']];

  function jump(st){
    S.inuseCleared = false;
    if (['test', 'question', 'record', 'review', 'interrupted'].includes(st)) S.permitted = true;
    else if (['wait', 'webview', 'permission'].includes(st)) S.permitted = false;
    if (st === 'blocked'){
      S.permitted = S.permMode === 'inuse';
      S.blockedReason = S.permMode === 'inuse' ? 'inuse' : 'denied';
    }
    if (st === 'review' || st === 'interrupted') S.poster = S.poster || S.lastFrame;
    if (st === 'interrupted' && !S.keptSecs) S.keptSecs = 14;   // so the copy has a duration to show
    if (st === 'review' && !S.takeSecs) S.takeSecs = 14;
    go(st);
  }
  function setOpt(key, val){
    if (key === 'osGranted') S.osGranted = val === 'yes';
    else if (key === 'prepSecs') S.prepSecs = +val;
    else S[key] = val;
    if (key === 'permMode'){ S.permitted = false; S.inuseCleared = false; }
    if (key === 'voiceMode' && val === 'heard' && S.state === 'test') later(micOk, 600);
    if (key === 'prepSecs' && S.state === 'question') S.prepLeft = S.prepSecs;
    if (key === 'netMode') return netChanged();
    render();
  }
  const Opt = ({k, v, label, on}) => html`<${Tag} variant="secondary" color=${on ? 'blue' : 'gray'} size="md" selected=${on} onSelectedChange=${() => setOpt(k, v)}>${label}<//>`;
  const Group = ({label, children, hidden}) => hidden ? null : html`<div class="proto-group"><span class="proto-label">${label}</span><div class="seg">${children}</div></div>`;

  function Proto(){
    const cur = S.state === 'waitError' ? 'wait' : S.state;
    return html`<aside class=${'proto' + (S.protoCollapsed ? ' collapsed' : '')} aria-label="Prototype controls">
      <div class="proto-head">
        <span class="proto-title">Prototype · Mobile</span>
        <${Button} variant="tertiary-color" onClick=${() => { S.protoCollapsed = !S.protoCollapsed; render(); }}>${S.protoCollapsed ? 'Show controls' : 'Hide controls'}<//>
        <p class="proto-ticket p3" aria-live="polite"><b>UX-1224</b> ${TICKET[S.state] || ''}</p>
      </div>
      <div class="proto-body">
        <${Group} label="Device">
          <${Opt} k="platform" v="android" on=${S.platform === 'android'} label="Android · Chrome" />
          <${Opt} k="platform" v="ios" on=${S.platform === 'ios'} label="iPhone · Safari" />
        <//>
        <div class="proto-group"><span class="proto-label">Jump to</span><div class="seg">
          ${CHIPS.map(([k, l]) => html`<${Tag} key=${k} variant="secondary" color=${cur === k ? 'blue' : 'gray'} size="md" selected=${cur === k} onSelectedChange=${() => jump(k)}>${l}<//>`)}
        </div></div>
        <${Group} label="Site permission">
          <${Opt} k="permMode" v="ask" on=${S.permMode === 'ask'} label="Asks" />
          <${Opt} k="permMode" v="granted" on=${S.permMode === 'granted'} label="Already allowed" />
          <${Opt} k="permMode" v="inuse" on=${S.permMode === 'inuse'} label="Camera in use" />
        <//>
        <${Group} label="Android app permission" hidden=${S.platform !== 'android'}>
          <${Opt} k="osGranted" v="no" on=${!S.osGranted} label="Chrome must ask the OS" />
          <${Opt} k="osGranted" v="yes" on=${S.osGranted} label="Chrome already has it" />
        <//>
        <${Group} label="Voice check">
          <${Opt} k="voiceMode" v="heard" on=${S.voiceMode === 'heard'} label="Voice heard" />
          <${Opt} k="voiceMode" v="silent" on=${S.voiceMode === 'silent'} label="Silent" />
        <//>
        <${Group} label="Preparation time">
          <${Opt} k="prepSecs" v="5" on=${S.prepSecs === 5} label="5s" />
          <${Opt} k="prepSecs" v="10" on=${S.prepSecs === 10} label="10s" />
          <${Opt} k="prepSecs" v="30" on=${S.prepSecs === 30} label="30s" />
        <//>
        <${Group} label="Loading">
          <${Opt} k="loadMode" v="ok" on=${S.loadMode === 'ok'} label="Succeeds" />
          <${Opt} k="loadMode" v="fail" on=${S.loadMode === 'fail'} label="Fails" />
        <//>
        <${Group} label="Opened from">
          <${Opt} k="appMode" v="browser" on=${S.appMode === 'browser'} label="A real browser" />
          <${Opt} k="appMode" v="inapp" on=${S.appMode === 'inapp'} label="Inside an app" />
        <//>
        <${Group} label="Connection">
          <${Opt} k="netMode" v="online" on=${S.netMode === 'online'} label="Online" />
          <${Opt} k="netMode" v="offline" on=${S.netMode === 'offline'} label="Offline" />
        <//>
        <${Group} label="Saving the answer">
          <${Opt} k="saveMode" v="ok" on=${S.saveMode === 'ok'} label="Saves" />
          <${Opt} k="saveMode" v="slow" on=${S.saveMode === 'slow'} label="Slow, then saves" />
          <${Opt} k="saveMode" v="fail" on=${S.saveMode === 'fail'} label="Fails" />
        <//>
        <${Group} label="Interrupt the recording" hidden=${!(S.state === 'record' && S.recording)}>
          <${Tag} variant="secondary" color="gray" size="md" onSelectedChange=${() => interrupt('away')}>Leaving the page<//>
          <${Tag} variant="secondary" color="gray" size="md" onSelectedChange=${() => interrupt('device')}>An incoming call<//>
        <//>
      </div>
    </aside>`;
  }

  /* ================= App ================= */
  function App(){
    const [, setN] = useState(0);
    bump = () => setN(n => n + 1);
    const stageRef = useRef(null);
    const [K, setK] = useState(1);
    useEffect(() => {
      const fit = () => {
        const el = stageRef.current;
        if (!el) return;
        const cs = getComputedStyle(el);
        const w = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        const h = el.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
        const d = PHONES[S.platform];
        setK(Math.max(.1, Math.min(1, (w - 26) / d.w, (h - 26) / d.h)));
      };
      fit();
      addEventListener('resize', fit);
      return () => removeEventListener('resize', fit);
    }, [S.platform]);
    useEffect(() => {
      const onKey = e => {
        if (e.key !== 'Escape') return;
        if (S.alvyOpen) closeAlvy();
      };
      document.addEventListener('keydown', onKey);
      return () => document.removeEventListener('keydown', onKey);
    }, []);
    const d = PHONES[S.platform];
    return html`<div class="app">
      <div class="stage" ref=${stageRef}>
        <div id="phone" role="region" aria-label="Candidate phone screen" style=${{'--pw':d.w + 'px', '--ph':d.h + 'px', '--k':K}}>
          <div id="frame">
            <${ChromeTop} />
            <div id="viewport">
              <${TopNav} />
              <${OfflineBanner} />
              <main id="view"><${Screen} />${S.dialog ? html`<${Dialog} />` : null}</main>
            </div>
            <${ChromeBottom} />
          </div>
          ${S.alvyOpen ? html`<section class="alvy" aria-label="Chat with Alvy">
            <${ChatPanel} header=${{title:'Chat with Alvy', icon:html`<${Icon} name="sparkle" size=${18} />`, onBack:closeAlvy}}
              messages=${S.alvyMsgs} typing=${S.alvyTyping ? ['Alvy'] : null}
              composer=${{onSend:sendChat, placeholder:'Ask a question…'}} />
          </section>` : null}
        </div>
      </div>
      <${Proto} />
    </div>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
  go('wait');
})();
</script>
