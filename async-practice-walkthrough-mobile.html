  const Steps = ({items}) => html`<ol class="steps p2">${items.map((x, i) => html`<li key=${i} dangerouslySetInnerHTML=${{__html:x}} />`)}</ol>`;
  const Cta = props => html`<${Button} fullWidth ...${props} />`;
  const FootLink = ({children, onClick, icon}) => html`<div class="foot-link"><${TextLink} as="button" leadingIcon=${icon ? html`<${Icon} name=${icon} />` : undefined} onClick=${onClick}>${children}<//></div>`;

  /* ---- device rows: the device field from the Test Taker file plus a status chip ---- */
  function DevStatus({s}){
    if (s === 'ok') return html`<${Chip} color="green" variant="secondary" size="md" icon=${html`<${Icon} name="check" size=${12} />`}>Working<//>`;
    if (s === 'quiet') return html`<${Chip} color="orange" variant="secondary" size="md" icon=${html`<${Icon} name="mic-off" size=${12} />`}>No sound yet<//>`;
    return html`<${Chip} color="gray" variant="secondary" size="md" icon=${html`<${Spinner} size=${12} color="blue" label=${null} />`}>Testing<//>`;
  }
  function DeviceRow({kind, status}){
    const cam = kind === 'cam', names = cam ? CAMS : MICS, idx = cam ? S.cam : S.mic;
    return html`<div class="drow">
      <button type="button" class="devsel" aria-haspopup="dialog" aria-expanded=${S.sheet === kind}
        aria-label=${`${cam ? 'Camera' : 'Microphone'}: ${names[idx]}. Change`} onClick=${() => { S.sheet = kind; render(); }}>
        <${Icon} name=${cam ? 'video-camera' : 'microphone'} size=${16} />
        <span class="p2 devsel-val">${names[idx]}</span>
        <${Icon} name="chevron-down" size=${16} />
      </button>
      <${DevStatus} s=${status} />
    </div>`;
  }
  // A phone picks from a list in a sheet from the bottom, in thumb reach, the way both platforms
  // present a choice. Choosing applies it and closes the sheet. (New pattern: Tessera's Dropdown
  // panel is built for a pointer and a wide screen.)
  function DeviceSheet(){
    const open = !!S.sheet;
    const kind = useRef('cam');
    if (S.sheet) kind.current = S.sheet;
    const {mounted, state} = usePresence(open, 200);
    const ref = useRef(null);
    const close = () => { S.sheet = null; render(); };
    useEffect(() => { if (open) ref.current?.querySelector('input:checked')?.focus({preventScroll:true}); }, [open]);
    if (!mounted) return null;
    const cam = kind.current === 'cam', names = cam ? CAMS : MICS, idx = cam ? S.cam : S.mic;
    return html`<div class=${'sheet-layer' + (S.platform === 'android' ? ' edge' : '')}>
      <${Overlay} open=${open} portal=${false} onClick=${close} />
      <section class="sheet" ref=${ref} data-state=${open ? 'open' : 'closed'} role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet-grip" aria-hidden="true"></div>
        <div class="sheet-head">
          <h2 id="sheet-title" class="h5 ttl">${cam ? 'Choose a camera' : 'Choose a microphone'}</h2>
          <${IconButton} variant="tertiary-gray" icon="xmark-regular" aria-label="Close" onClick=${close} />
        </div>
        <${RadioGroup} aria-labelledby="sheet-title" value=${String(idx)}
          onValueChange=${v => { if (cam) S.cam = +v; else S.mic = +v; S.sheet = null; render(); }}>
          ${names.map((n, i) => html`<${Radio} key=${i} value=${String(i)} label=${n} />`)}
        <//>
        ${S.platform === 'android' ? html`<span class="sheet-home" aria-hidden="true"></span>` : null}
      </section>
    </div>`;
  }

  /* ---- camera media: the live video or the sample preview, always mounted as one element ---- */
  function SimCanvas(){
    const ref = useRef(null);
    useEffect(() => { const el = ref.current; startSim(el); return () => stopSim(el); }, []);
    return html`<canvas id="simCam" ref=${ref} role="img" aria-label="Sample camera preview"></canvas>`;
  }
  function VideoLayer(){
    const vref = useRef(null);
    useEffect(() => {
      const v = vref.current;
      if (v && S.stream && v.srcObject !== S.stream){ v.srcObject = S.stream; v.play?.().catch(() => {}); }
    });
    const hidden = S.hidePreview && S.state === 'record';
    const inner = showPreview() ? (S.stream
      ? html`<video id="liveVideo" ref=${vref} class="mirror" autoPlay muted playsInline aria-label="Your camera preview"></video>`
      : html`<${SimCanvas} />`) : null;
    return html`<div class=${'vmedia' + (hidden ? ' hidden' : '')}>${inner}</div>`;
  }
  const simChip = () => (showPreview() && !S.stream) ? html`<${Chip} color="gray" size="sm">Sample preview<//>` : null;

  // Live microphone level, polled on its own so the screen is not repainted at 12fps.
  function LiveWave({bars = 22}){
    const [lv, setLv] = useState([]);
    useEffect(() => {
      const id = setInterval(() => setLv(p => [...p.slice(-(bars - 1)), S.level]), 90);
      return () => clearInterval(id);
    }, []);
    return html`<${CandidateSoundwave} levels=${lv} barCount=${bars} label="Microphone level" />`;
  }

  /* ================= Onboarding screens ================= */
  // Loading, and the same screen when the page reloads and rebuilds from what was saved.
  // The spinner, the title, the text and the steps share one centred column.
  function WaitScreen(){
    const SR = {done:'done', act:'in progress', pend:'not started'};
    const labels = S.resuming ? RESUME_LABELS : WAIT_LABELS;
    return html`<${Page} mid>
      <div class="centre">
        <${Spinner} size=${48} color="blue" label="Loading your assessment" />
        <div class="head" style=${{justifyItems:'center'}}>
          <h1 class="h4 ttl">${S.resuming ? 'Picking up where you left off…' : 'Getting your assessment ready…'}</h1>
          <p class="p2 lines"><span>This can take up to 30 seconds.</span><span>Keep this page open.</span></p>
        </div>
        <ul class="checklist p2" aria-live="polite">
          ${labels.map((t, i) => {
            const s = S.waitItems[i];
            const mark = s === 'done' ? html`<${Icon} name="circle-check" size=${16} />`
              : s === 'act' ? html`<${Spinner} size=${16} color="blue" label=${null} />`
              : html`<span class="dot"></span>`;
            return html`<li key=${i} class=${s}>${mark}<span>${t}</span><span class="sr-only">, ${SR[s]}</span></li>`;
          })}
        </ul>
      </div><//>`;
  }

  // Allow access: the picture, the reason, Continue. The browser's own dialog comes next.
  function PermissionScreen(){
    return html`<${Page} foot=${html`<${Cta} onClick=${askPermission}>Continue<//>`}>
      <div class="art"><${PhoneArt} art=${{title:'Allow access'}} /></div>
      <${Head} title="Allow camera and microphone">
        <p class="p2">You’ll answer by video, so we need both.</p>
      <//>
      <ul class="bullets p2">
        <li>Your browser will ask next. Tap <b>Allow</b>.</li>
        ${S.platform === 'android'
          ? html`<li>Chrome asks twice: for this site, then for Chrome.</li>`
          : html`<li>Safari asks each time you open the assessment.</li>`}
      </ul><//>`;
  }

  // Blocked, in the layout of the Proctoring Attendee screen: picture, what is wrong, how to fix
  // it in this browser, Retry, and the help link at the foot.
  function BlockedScreen(){
    const c = blockedCopy();
    return html`<${Page} foot=${html`<${Fragment}>
        <${Cta} onClick=${retryBlocked}>Retry<//>
        <${FootLink} icon="help-circle" onClick=${() => helpFlow(c.topic)}>${c.link}<//>
      <//>`}>
      <div class="art"><${PhoneArt} art=${c.art} /></div>
      <${Head} title=${c.title}><p class="p2">${c.text}</p><//>
      <${Steps} items=${c.steps} /><//>`;
  }

  // Camera and mic test: the camera fills the space between the solid top bar and footer.
  function TestScreen(){
    const mic = S.heard ? 'ok' : S.micFailed ? 'quiet' : 'testing';
    return html`<${Page} cam foot=${html`<${Cta} disabled=${!S.heard} onClick=${() => go('question')}>Continue<//>`}>
      <${VideoLayer} />
      ${showPreview() ? null : html`<div class="vmsg"><${Spinner} size=${24} color="white" label=${null} /><span>Starting your camera…</span></div>`}
      <div class="camtop"><span class="livedot" role="img" aria-label="Live preview, not recording"></span>${simChip()}</div>
      <div class="camcard float">
        <h1 class="h5 ttl">Check your camera and microphone</h1>
        <p class="p3 muted">We’ll make sure we can see and hear you before you start.</p>
        <div class="drows">
          <${DeviceRow} kind="cam" status="ok" />
          <${DeviceRow} kind="mic" status=${mic} />
        </div>
        <div class="wavebar"><span class="l1">${S.heard ? 'We can hear you' : 'Say ‘Testing 123’ out loud'}</span><${LiveWave} /></div>
        ${S.micFailed ? html`<div class="status-line late" role="status"><${Icon} name="mic-off" size=${16} />
          <span>We can’t hear you. Unmute your phone or pick another microphone.</span></div>
          <${TextLink} as="button" leadingIcon=${html`<${Icon} name="help-circle" />`} onClick=${() => { S.blockedReason = 'nomic'; S.blockedFrom = 'test'; go('blocked'); }}>See how to fix it<//>` : null}
      </div><//>`;
  }

  /* ================= Questions ================= */
  // The assessment card, as in the Test Taker file: a muted card with a header row.
  const answerTime = () => S.limitSecs >= 60 ? Math.round(S.limitSecs / 60) + ' minutes' : S.limitSecs + ' seconds';
  // The assessment card, as in the Test Taker file: a header row, a divider, then the content.
  const QCard = ({children}) => html`<section class="qcard">
    <div class="qcard-head"><span class="l1">Question ${S.qi} of ${ASSESS.length}</span></div>
    <div class="qcard-body">${children}</div>
  </section>`;
  // Question text with Read more / Show less at the end of the text itself.
  const CLAMP = 72;
  function QText({text, cls = 'p2'}){
    const long = text.length > CLAMP + 8, open = S.qExpanded || !long;
    const shown = open ? text : text.slice(0, text.lastIndexOf(' ', CLAMP)) + '…';
    return html`<p id="qtext" class=${cls + ' qtext'}>${shown}${long ? html`${' '}<${TextLink} as="button" size="sm" aria-expanded=${S.qExpanded} aria-controls="qtext"
      onClick=${() => { S.qExpanded = !S.qExpanded; render(); }}>${S.qExpanded ? 'Show less' : 'Read more'}<//>` : null}</p>`;
  }
  // The rules for answering, in two short bullets above the question. Both question types share them.
  function AnswerRules({media}){
    const prep = `${S.prepSecs}s`;
    return html`<ul class="bullets p3">
      <li>${media && !S.clipDone ? `Watch the video. Your ${prep} prep time starts when it ends.` : `${prep} to prepare. Recording starts when it ends.`}</li>
      <li>${answerTime()} to answer. You can retake it.</li>
    </ul>`;
  }

  // The Start recording button, with the preparation countdown in one of two ways: the button
  // fills as the time runs out, or a bar above the button.
  function startControls({counting, disabled}){
    const used = S.prepSecs - S.prepLeft, pct = Math.round(used / S.prepSecs * 100);
    const plain = html`<${Cta} disabled=${disabled} onClick=${startRecordFlow}>Start recording<//>`;
    if (!counting) return plain;
    if (S.prepStyle === 'bar') return html`<${Fragment}><div class="prepbar"><${ProgressIndicator} value=${used} max=${S.prepSecs} label=${`Recording starts in ${S.prepLeft}s`} valuePosition="none" /></div>${plain}<//>`;
    return html`<div class="prepfill" style=${{'--fill':pct + '%'}}><${Cta} onClick=${startRecordFlow}>Start recording · ${S.prepLeft}s<//></div>`;
  }

  // The practice question: read it, get a short preparation countdown, then the camera opens.
  function PracticeQuestion(){
    return html`<${Page} foot=${startControls({counting:S.practicePrep})}>
      <div><${Chip} color="blue" variant="secondary" size="sm">Practice · not scored<//></div>
      <${Head} title=${Q().text} lg>
      <//>
      <ul class="bullets p2">
        <li>${S.practicePrep ? `${S.prepSecs}s to prepare. Recording starts when it ends.` : 'Tap Start recording when you’re ready.'}</li>
        <li>You can record it again.</li>
      </ul><//>`;
  }

  // A video question: the rules, then the question. Recording starts when the prep time ends.
  function VideoQuestion(){
    return html`<${Page} foot=${startControls({counting:true})}>
      <${QCard}>
        <${AnswerRules} />
        <p class="p2 qtext">${Q().text}</p>
      <//><//>`;
  }

  // Player controls from the web Test Taker file: a progress track, then replay 5s, play or pause,
  // forward 5s, volume, and the time. Tessera RtIconButtons, the Real-Time video-player controls.
  function VideoControls({t, total, playing, muted, onToggle, onSeek, onMute, disabled}){
    return html`<div class="vctl">
      <div class="vctl-track" role="progressbar" aria-label="Playback" aria-valuemin="0" aria-valuemax=${total} aria-valuenow=${Math.floor(t)}>
        <span style=${{width:(total ? Math.min(100, t / total * 100) : 0) + '%'}}></span></div>
      <div class="vctl-row">
        <${RtIconButton} icon="seek-back-5" aria-label="Back 5 seconds" disabled=${disabled} onClick=${() => onSeek(-5)} />
        <${RtIconButton} icon=${playing ? 'pause' : html`<${Fragment}>${svg('play', 16)}<//>`} aria-label=${playing ? 'Pause' : 'Play'} disabled=${disabled} onClick=${onToggle} />
        <${RtIconButton} icon="seek-forward-5" aria-label="Forward 5 seconds" disabled=${disabled} onClick=${() => onSeek(5)} />
        <${RtIconButton} icon="volume-high-regular" pressedIcon="volume-slash-regular" pressed=${muted} aria-label="Mute" disabled=${disabled} onClick=${onMute} />
        <${CandidateClock} seconds=${Math.floor(t)} total=${total} mutedTotal size="sm" />
      </div>
    </div>`;
  }

  // A multimedia question: someone asks it in a video. Instructions sit above it, captions inside
  // it. When it ends the preparation time starts, then the candidate answers on video.
  function MediaClip({m, onEnded}){
    const cref = useRef(null);
    const [t, setT] = useState(0), [playing, setPlaying] = useState(false), [muted, setMuted] = useState(false);
    useEffect(() => {
      const c = cref.current, ctx = c.getContext('2d');
      const dpr = Math.min(window.devicePixelRatio || 1, 2), w = c.clientWidth, h = c.clientHeight;
      c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const draw = () => { ctx.filter = 'hue-rotate(150deg)'; drawPerson(ctx, w, h, performance.now() / 1000, playing ? simSpeech() : 0.03); ctx.filter = 'none'; };
      draw();
      const id = setInterval(() => {
        draw();
        if (playing) setT(p => { const n = p + 0.08; if (n >= m.len){ setPlaying(false); setTimeout(onEnded, 0); return m.len; } return n; });
      }, 80);
      return () => clearInterval(id);
    }, [playing]);
    const toggle = () => { if (!playing && t >= m.len) setT(0); setPlaying(p => !p); };
    const line = (t > 0 && t < m.len) ? [...m.captions].reverse().find(([at]) => t >= at)?.[1] : null;
    return html`<div class="clip">
      <canvas ref=${cref} role="img" aria-label=${`Video: ${m.caption}`}></canvas>
      ${(!playing && t === 0) ? html`<div class="vcenter"><${IconButton} variant="overlay" shape="round" aria-label="Play the question" icon=${html`<${Fragment}>${svg('play', 16)}<//>`} onClick=${toggle} /></div>` : null}
      ${line ? html`<div class="caption" aria-live="polite"><span class="p2">${line}</span></div>` : null}
      ${(playing || t > 0) ? html`<${VideoControls} t=${t} total=${m.len} playing=${playing} muted=${muted} onToggle=${toggle}
        onSeek=${d => setT(p => Math.max(0, Math.min(m.len - 0.1, p + d)))} onMute=${() => setMuted(x => !x)} />` : null}
    </div>`;
  }
  function MediaQuestion(){
    return html`<${Page} foot=${startControls({counting:S.clipDone, disabled:!S.clipDone})}>
      <${QCard}>
        <${AnswerRules} media />
        <${MediaClip} m=${Q().media} onEnded=${clipEnded} />
      <//><//>`;
  }
  function QuestionScreen(){
    const q = Q();
    if (q.practice) return html`<${PracticeQuestion} />`;
    if (q.kind === 'media') return html`<${MediaQuestion} />`;
    return html`<${VideoQuestion} />`;
  }

  // Recording: the camera fills the space between the solid bar and footer. Stop recording sits
  // where Start recording was, and the question stays on screen at full strength.
  function RecordScreen(){
    // The recorder needs the canvas to exist, so it starts once this screen has mounted.
    useEffect(() => { startRecorder(); runRecClock(); startLevel(); }, []);
    const q = Q(), left = q.practice ? null : Math.max(0, S.limitSecs - S.recSecs);   // answer time; the assessment timer stays in the top bar
    return html`<${Page} cam foot=${html`<${Cta} onClick=${endRecording}>Stop recording<//>`}>
      <${VideoLayer} />
      ${S.hidePreview ? html`<div class="vmsg"><${Icon} name="eye-closed-regular" size=${24} /><span class="lines"><span>You’re still being recorded.</span><span>Only the preview is hidden.</span></span></div>` : null}
      <div class="camtop">
        <span class="pill" role="group" aria-label=${left !== null ? 'Time left to answer' : 'Recording time'}><${CandidateClock} live seconds=${left ?? S.recSecs} size="sm" /></span>
        <span class="pill"><${Toggle} size="sm" label="Hide preview" checked=${S.hidePreview} onCheckedChange=${v => { S.hidePreview = v; render(); }} /></span>
      </div>
      <div class="camcard float">
        <span class="p3 muted">${q.practice ? 'Practice question · not scored' : `Question ${S.qi} of ${ASSESS.length}`}</span>
        <${QText} text=${q.text} />
      </div><//>`;
  }

  // An interruption loses the answer in progress. It says so in a line, and that earlier answers are safe.
  function InterruptedScreen(){
    const away = S.interruptReason === 'away';
    return html`<${Page} foot=${html`<${Fragment}>
        <${Cta} onClick=${() => go('test')}>Try again<//>
        <${FootLink} icon="help-circle" onClick=${() => helpFlow('retake')}>Why did this happen?<//>
      <//>`}>
      <div class="art"><${PhoneArt} art=${{title:'Recording stopped', items:[{icon:'video', label:'Interrupted', warn:true}]}} /></div>
      <${Head} title="Recording interrupted">
        <p class="p2">${away ? 'You left the page, so the camera stopped.' : 'A call or another app took the camera.'}${' '}This answer wasn’t saved. Your earlier answers are safe.</p>
      <//><//>`;
  }

  // The response player. Saving happens inside it, as on web: a spinner while the answer saves,
  // then "Your response has been saved successfully." over the picture, then playback.
  function ReviewPlayer(){
    const ref = useRef(null);
    const [t, setT] = useState(0), [dur, setDur] = useState(0), [playing, setPlaying] = useState(false), [muted, setMuted] = useState(false);
    const clip = S.replayOK && S.clipURL, saving = S.save === 'saving' || S.save === 'retry';
    useEffect(() => {
      const v = ref.current;
      if (!v) return;
      const sync = () => { setT(v.currentTime || 0); setDur(v.duration); setPlaying(!v.paused); };
      ['timeupdate', 'loadedmetadata', 'play', 'pause'].forEach(e => v.addEventListener(e, sync));
      if (!saving) v.play().catch(() => {});
      return () => ['timeupdate', 'loadedmetadata', 'play', 'pause'].forEach(e => v.removeEventListener(e, sync));
    }, [clip, saving]);
    // MediaRecorder output often reports an infinite duration; fall back to what we timed.
    const total = Number.isFinite(dur) && dur > 0 ? Math.round(dur) : S.takeSecs;
    const toggle = () => { const v = ref.current; if (!v) return; v.paused ? v.play().catch(() => {}) : v.pause(); };
    const seek = d => { const v = ref.current; if (v) v.currentTime = Math.max(0, (v.currentTime || 0) + d); };
    const mute = () => { const v = ref.current; setMuted(m => { if (v) v.muted = !m; return !m; }); };
    let cover = null;
    if (saving) cover = html`<div class="vstate" role="status"><${Spinner} size=${32} color="white" label="Saving your response" />
      ${S.save === 'retry' ? html`<p class="p2">Still saving. Keep this page open.</p>` : null}</div>`;
    else if (S.save === 'failed') cover = html`<div class="vstate" role="alert"><${Icon} name="circle-exclamation" size=${24} />
      <p class="p2 lines"><span>We couldn’t save your response.</span><span>Check your connection and try again.</span></p>
      <${Button} onClick=${startSave}>Try again<//></div>`;
    else if (S.savedFlash) cover = html`<div class="vstate note" role="status"><p class="p2">Your response has been saved successfully.</p></div>`;
    return html`<div class="vcard">
      <div class="vmedia">${clip
        ? html`<video ref=${ref} src=${S.clipURL} playsInline loop muted=${!S.stream} aria-label="Your recording"></video>`
        : S.poster ? html`<img src=${S.poster} alt="The last frame of your recording" />` : null}</div>
      ${cover}
      ${(!clip && !saving && S.save !== 'failed') ? html`<div class="vtop"><${Chip} color="gray" size="sm">Playback isn’t available in this preview<//></div>` : null}
      ${saving || S.save === 'failed' ? null : html`<${VideoControls} t=${t} total=${total} playing=${playing} muted=${muted}
        disabled=${!clip} onToggle=${toggle} onSeek=${seek} onMute=${mute} />`}
    </div>`;
  }
  // After Stop recording. In onboarding it says that is how every answer works; in the assessment
  // it is the response with Next (or Finish) and Retake. The primary action waits for the save.
  function ReviewScreen(){
    const q = Q(), locked = S.save !== 'saved', last = S.qi >= QS.length - 1;
    if (q.practice) return html`<${Page} foot=${html`<${Fragment}>
        <${Cta} disabled=${locked} onClick=${() => go('countdown')}>Start assessment<//>
        <${Cta} variant="secondary-gray" onClick=${() => go('question')}>Practice again<//>
      <//>`}>
      <${Head} title="That’s how it’s done" icon=${html`<${Icon} name="circle-check" size=${18} />`}>
        <p class="p2">Your answer saves automatically, so there’s nothing to submit. Watch it back, then practice again or start the assessment.</p>
      <//>
      <${ReviewPlayer} /><//>`;
    return html`<${Page} foot=${html`<${Fragment}>
        <${Cta} disabled=${locked} onClick=${nextQuestion}>${last ? 'Finish' : 'Next'}<//>
        <${Cta} variant="secondary-gray" onClick=${() => { S.retakeAsk = true; render(); }}>Retake<//>
      <//>`}>
      <${QCard}>
        <${QText} text=${q.text} />
        <${ReviewPlayer} />
      <//><//>`;
  }

  function CountdownScreen(){
    return html`<${Page} mid>
      <div class="centre">
        <div class="head" style=${{justifyItems:'center'}}>
          <h1 class="h4 ttl">Starting your assessment</h1>
          <p class="p2 lines"><span>Get comfortable.</span><span>The timer starts with the first question.</span></p>
        </div>
        <${ProgressIndicator} type="circular" value=${S.count} max=${5} valueText=${S.count} label="Starting your assessment in" />
      </div><//>`;
  }

  /* ================= Network error ================= */
  // After a long loss of connection, in the layout of the Proctoring Attendee error screen.
  function NetErrorScreen(){
    const lost = S.neterrKind === 'lost';
    return html`<${Page} foot=${html`<${Fragment}>
        <${Cta} onClick=${retryNet}>Retry<//>
        <${FootLink} icon="help-circle" onClick=${() => helpFlow('net')}>Need help?<//>
      <//>`}>
      <div class="art"><${NetArt} /></div>
      <${Head} title="No internet connection">
        <p class="p2">Check your Wi-Fi or mobile data, then tap Retry.${lost && P.onboarded ? ' Saved answers are kept; you’ll redo the current one.' : ''}</p>
      <//>
      ${S.retryFail ? html`<div class="status-line bad" role="alert"><${Icon} name="circle-exclamation" size=${16} /><span>Still offline. Check your connection and retry.</span></div>` : null}<//>`;
  }

  /* ================= Wrap-up: the Test Taker file's own screens ================= */
  // Saving, then saved. The rocket is the file's illustration, placed layer by layer.
  function SavingScreen(){
    const done = S.saveStep >= 1;
    return html`<${Page} foot=${html`<${Cta} disabled=${!done} onClick=${() => go('score')}>Next<//>`}>
      <div class="wcard">
        <div class="wt">
          <p class="l1 ttl">📂 Saving your assessment</p>
          ${done
            ? html`<div class="status-line ok" role="status"><${Icon} name="circle-check" size=${16} /><span>Your assessment has been saved successfully.</span></div>`
            : html`<div class="status-line" role="status"><${Spinner} size=${16} color="blue" label=${null} /><span>Rechecking your answers and wrapping things up</span></div>`}
        </div>
        <${Fig} ratio="472/434" layers=${[['saving-bg-complete.svg', '4.21% 7.11% 10.03% 14.85%'], ['saving-bg-simple.svg', '0 8.77% 20.81% 3.16%'],
          ['saving-shadow.svg', '92.66% 0.09% 0.13% 0.03%'], ['saving-device.svg', '52.57% 0.47% 4.07% 36.22%'], ['saving-rocket.svg', '2.7% 15.22% 6.98% 18.6%']]} />
      </div><//>`;
  }

  // Your score: the bar graph and the certificate, exactly as the file draws them. The numbers
  // are the file's own sample figures, not worked out from the answers.
  const BARS = [['bar-6.svg', 27, '12.75px', '64.5px', '6/10', 'Critical Thinking'], ['bar-8.svg', 101.25, '90.75px', '57.75px', '8/10', 'Problem Solving'],
    ['bar-8.svg', 175.5, '166.5px', '54.75px', '8/10', 'Behavioural'], ['bar-10.svg', 249.75, '250.5px', '34.5px', '10/10', 'Aptitude']];
  const ACTIONS = [['Share on LinkedIn', 'act-linkedin.svg'], ['Send to email', 'act-email.svg'], ['View in Credly', 'act-credly.svg'], ['Download', 'act-download.svg']];
  // A short burst of confetti when the score is revealed. Colours come from the theme's tokens;
  // reduced motion skips it.
  function Confetti(){
    const ref = useRef(null);
    useEffect(() => {
      if (reduce.matches) return;
      const c = ref.current, ctx = c.getContext('2d'), w = c.clientWidth, h = c.clientHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      c.width = w * dpr; c.height = h * dpr; ctx.scale(dpr, dpr);
      const cs = getComputedStyle(c);
      const cols = ['--interactive-primary', '--success-strong', '--warning-strong', '--purple-500', '--blue-300'].map(v => cs.getPropertyValue(v).trim() || '#2563eb');
      const bits = Array.from({length:90}, (_, i) => ({x:w / 2 + (Math.random() - .5) * 60, y:h * .22, vx:(Math.random() - .5) * 7, vy:-Math.random() * 7 - 3,
        r:Math.random() * Math.PI, vr:(Math.random() - .5) * .3, s:5 + Math.random() * 5, c:cols[i % cols.length]}));
      const t0 = performance.now(); let raf;
      const tick = now => {
        const age = now - t0; ctx.clearRect(0, 0, w, h);
        ctx.globalAlpha = Math.max(0, 1 - Math.max(0, age - 1800) / 900);
        bits.forEach(b => { b.vy += .18; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
          ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.c; ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); ctx.restore(); });
        if (age < 2700) raf = requestAnimationFrame(tick); else ctx.clearRect(0, 0, w, h);
      };
      raf = requestAnimationFrame(tick);
      return () => cancelAnimationFrame(raf);
    }, []);
    return html`<canvas class="confetti" ref=${ref} aria-hidden="true"></canvas>`;
  }
  function ScoreScreen(){
    return html`<${Page} foot=${html`<${Cta} onClick=${() => go('feedback')}>Next<//>`}>
      <div class="wcard">
        <${Confetti} />
        <div class="wt mid">
          <p class="p1 ttl">Your score</p>
          <p class="score-n">32/40</p>
          <p class="p1" style=${{color:'var(--text-tertiary)'}}>You’ve cleared this assessment.</p>
        </div>
        <div class="bars" role="img" aria-label="Scores by skill: Critical Thinking 6 of 10, Problem Solving 8 of 10, Behavioural 8 of 10, Aptitude 10 of 10">
          ${BARS.map(([src, left]) => html`<img key=${left} src=${FIG + src} alt="" style=${{left:left + 'px'}} />`)}
          ${BARS.map(([, , left, w, v, l]) => html`<div class="lab" key=${l} style=${{left, width:w}}><b>${v}</b><span>${l}</span></div>`)}
        </div>
        <img class="cert" src=${FIG + 'certificate.png'} alt="Certificate of completion" />
        <div class="acts">${ACTIONS.map(([l, icon]) => html`<${Button} key=${l} variant="tertiary-color" trailingIcon=${html`<img src=${FIG + icon} alt="" width="16" height="16" />`}>${l}<//>`)}</div>
      </div><//>`;
  }

  const RATINGS = ['Very bad', 'Bad', 'Average', 'Good', 'Very good'];
  const LIKED = ['User-Friendly Interface', 'Clear instructions', 'Smooth Navigation', 'Other'];
  function FeedbackScreen(){
    const f = S.fb;
    return html`<${Page} foot=${html`<${Fragment}>
        <${Cta} disabled=${f.rating === null} onClick=${() => go('thanks')}>Submit<//>
        <${Cta} variant="secondary-color" onClick=${() => go('thanks')}>Skip<//>
      <//>`}>
      <div class="wcard">
        <div class="wt">
          <p class="p1 ttl">✍ Feedback</p>
          <p class="p2" style=${{color:'var(--text-tertiary)'}}>How would you rate your experience with us?</p>
        </div>
        <div class="rate" role="radiogroup" aria-label="Rate your experience">${RATINGS.map((l, i) => html`<button key=${l} type="button" role="radio" aria-checked=${f.rating === i}
          onClick=${() => { f.rating = i; render(); }}><img src=${`${FIG}rate-${i + 1}.png`} alt="" width="32" height="32" />${l}</button>`)}</div>
        <div class="wt">
          <p class="p2" style=${{color:'var(--text-tertiary)'}}>What are the things you enjoyed?</p>
          <div class="tags">${LIKED.map(l => html`<${Tag} key=${l} variant="secondary" color="gray" size="md" selected=${f.liked.includes(l)}
            onSelectedChange=${on => { f.liked = on ? [...f.liked, l] : f.liked.filter(x => x !== l); render(); }}>${l}<//>`)}</div>
        </div>
        <${TextArea} label="Additional feedback" optional rows=${4} placeholder="Let us know what we did well and what we can do better" value=${f.text} onValueChange=${v => { f.text = v; }} />
        <${Fig} ratio="500/396" layers=${[['fb-bubble-1.svg', '0 49.93% 85.32% 27.6%'], ['fb-bg.svg', '7.59% 0.52% 0.17% 0.06%'], ['fb-stars.svg', '13.17% 19.88% 14.03% 19.66%'],
          ['fb-character.svg', '10.35% 17% 12.01% 17%'], ['fb-bubble-2.svg', '73.15% 0.12% 17.03% 80.65%']]} />
      </div><//>`;
  }

  function ThanksScreen(){
    return html`<${Page}>
      <div class="wcard">
        <div class="wt">
          <p class="l1 ttl">👋 Thank you!</p>
          <p class="p2" style=${{color:'var(--text-tertiary)'}}>You may close this window now.</p>
        </div>
        <img class="fig-flat" src=${FIG + 'thanks.gif'} alt="" />
      </div><//>`;
  }

  function Screen(){
    switch (S.state){
      case 'wait': return html`<${WaitScreen} />`;
      case 'neterror': return html`<${NetErrorScreen} />`;
      case 'permission': return html`<${PermissionScreen} />`;
      case 'blocked': return html`<${BlockedScreen} />`;
      case 'test': return html`<${TestScreen} />`;
      case 'question': return html`<${QuestionScreen} />`;
      case 'record': return html`<${RecordScreen} />`;
      case 'interrupted': return html`<${InterruptedScreen} />`;
      case 'review': return html`<${ReviewScreen} />`;
      case 'countdown': return html`<${CountdownScreen} />`;
      case 'saving': return html`<${SavingScreen} />`;
      case 'score': return html`<${ScoreScreen} />`;
      case 'feedback': return html`<${FeedbackScreen} />`;
      default: return html`<${ThanksScreen} />`;
    }
  }

  /* ---------- The browser's own permission dialogs (not Tessera: drawn after the platform) ---------- */
  function Dialog(){
    if (S.platform === 'ios') return html`<div class="scrim"><div>
      <div class="dlg-ios" role="dialog" aria-label="Safari permission request">
        <div class="body"><strong>“${SITE}” Would Like to Access the Camera and Microphone</strong></div>
        <div class="acts"><button onClick=${dialogDeny} type="button">Don’t Allow</button><button onClick=${dialogAllow} type="button">Allow</button></div>
      </div>
      <p class="dlg-note">Simulated. iOS draws this alert, not the page.</p></div></div>`;
    if (S.dialog === 'site') return html`<div class="scrim"><div>
      <div class="dlg-site" role="dialog" aria-label="Chrome permission request">
        <div class="ico">${svg('video', 16)}${svg('mic', 16)}</div>
        <p>${SITE} wants to use your camera and microphone</p>
        <div class="acts"><button onClick=${dialogDeny} type="button">Block</button><button onClick=${dialogAllow} type="button">Allow</button></div>
      </div>
      <p class="dlg-note">Simulated. Chrome draws this dialog, not the page.</p></div></div>`;
    const cam = S.dialog === 'os-cam';
    return html`<div class="scrim"><div>
      <div class="dlg-os" role="dialog" aria-label="Android permission request">
        <div class="ico">${svg(cam ? 'video' : 'mic', 34)}</div>
        <p>Allow <b>Chrome</b> to ${cam ? 'take pictures and record video' : 'record audio'}?</p>
        <div class="acts">
          <button onClick=${dialogAllow} type="button">While using the app</button>
          <button onClick=${dialogAllow} type="button">Only this time</button>
          <button onClick=${dialogDeny} type="button">Don’t allow</button>
        </div>
      </div>
      <p class="dlg-note">Simulated. Android draws this one. It comes after the site is allowed.</p></div></div>`;
  }

  /* ================= Prototype controls (not part of the design) ================= */
  // UX-1224 points: 1 page after OTP feels stuck · 2 practice gives no direction · 3 tracker skips a step · 4 10–30s waits
  const TICKET = {
    wait:'#1 + #4: loading steps replace the blank page, centred. After a reload it says it is picking up where you left off.',
    neterror:'After a long loss of connection the page is replaced by an error screen. Retry reloads: saved answers and onboarding are kept, the answer in progress is not.',
    permission:'Same order as web. Continue hands off to the browser’s own dialog, so it says Continue, not Allow: the real Allow comes next and two in a row reads as being asked twice.',
    blocked:'Five blocked states in the Proctoring Attendee layout. Each says what is wrong, walks through the fix in this browser, and offers Retry and a help link.',
    test:'The camera fills the space between the solid top bar and footer. Continue stays locked until the mic is heard.',
    question:'The question comes first, with a preparation countdown, then the camera opens. Two treatments to compare: the button fills, or a bar above it.',
    record:'Stop recording sits where Start recording was. The top bar and footer stay solid and the camera fills between them. A lost connection shows a banner here.',
    interrupted:'A call or a tapped notification ends the camera track. The answer in progress is lost and starts again; earlier answers stay saved.',
    review:'Stop recording saves the answer. Next (or Finish) and Retake wait on the save.',
    countdown:'A short countdown so the start of the timer is never a surprise.',
    saving:'The Test Taker file’s own wrap-up screen: saving, then saved successfully.',
    score:'The file’s score screen: the bar graph and certificate. The figures are the file’s sample numbers.',
    feedback:'The file’s feedback screen. Submit waits for a rating; Skip does not.',
    thanks:'End of the flow.'
  };
  const SCREENS = [
    ['Onboarding', [['wait', 'Loading'], ['permission', 'Allow access'], ['blocked', 'Blocked'], ['test', 'Camera and mic test'],
      ['practice-q', 'Practice question'], ['practice-rec', 'Practice recording'], ['practice-review', 'Practice review'], ['countdown', 'Countdown']]],
    ['Assessment', [['media-q', 'Multimedia question'], ['video-q', 'Video question'], ['video-rec', 'Video recording'], ['video-review', 'Video review']]],
    ['Wrap-up', [['saving', 'Saving'], ['score', 'Score'], ['feedback', 'Feedback'], ['thanks', 'Thank you']]],
    ['States', [['interrupted', 'Interrupted'], ['neterror', 'Network error']]]
  ];
  function curKey(){
    const q = QS[S.qi];
    switch (S.state){
      case 'question': return q.practice ? 'practice-q' : q.kind === 'media' ? 'media-q' : 'video-q';
      case 'record': return q.practice ? 'practice-rec' : 'video-rec';
      case 'review': return q.practice ? 'practice-review' : 'video-review';
      default: return S.state;
    }
  }
  function jump(key){
    S.inuseCleared = false;
    const at = (i, assess) => {
      S.qi = i; S.assessing = assess;
      if (assess){ P.onboarded = true; P.qi = i; saveP(); startAssessTimer(); } else stopAssessTimer();
    };
    switch (key){
      case 'wait': S.resuming = false; S.restoreNote = false; return go('wait');
      case 'permission': S.permitted = false; at(0, false); return go('permission');
      case 'blocked': S.blockedFrom = 'permission'; S.permitted = S.blockedReason === 'inuse'; return go('blocked');
      case 'test': S.permitted = true; return go('test');
      case 'practice-q': at(0, false); S.permitted = true; return go('question');
      case 'practice-rec': at(0, false); S.permitted = true; return go('record');
      case 'practice-review': at(0, false); S.permitted = true; S.takeSecs = S.takeSecs || 14; S.poster = S.poster || S.lastFrame; return go('review');
      case 'countdown': at(0, false); return go('countdown');
      case 'media-q': at(1, true); return go('question');
      case 'video-q': at(2, true); S.permitted = true; return go('question');
      case 'video-rec': at(2, true); S.permitted = true; return go('record');
      case 'video-review': at(2, true); S.permitted = true; S.takeSecs = S.takeSecs || 14; S.poster = S.poster || S.lastFrame; return go('review');
      case 'saving': S.assessing = false; return go('saving');
      case 'score': S.assessing = false; return go('score');
      case 'feedback': S.assessing = false; return go('feedback');
      case 'thanks': S.assessing = false; return go('thanks');
      case 'interrupted': S.permitted = true; S.interruptReason = 'away'; return go('interrupted');
      case 'neterror': S.neterrKind = 'lost'; S.retryFail = false; return go('neterror');
    }
  }
  function setOpt(key, val){
    if (key === 'osGranted') S.osGranted = val === 'yes';
    else if (key === 'practicePrep') S.practicePrep = val === 'on';
    else if (key === 'prepSecs' || key === 'limitSecs') S[key] = +val;
    else S[key] = val;
    if (key === 'permMode'){ S.permitted = false; S.inuseCleared = false; }
    if (key === 'voiceMode' && val === 'heard' && S.state === 'test') later(micOk, 600);
    if (key === 'prepSecs' && S.state === 'question') S.prepLeft = S.prepSecs;
    if (key === 'netMode') return netChanged();
    render();
  }
  // One segmented control per setting: Tessera Tabs, primary (pills).
  const Seg = ({label, k, value, opts, hidden}) => hidden ? null : html`<div class="proto-group">
    <span class="proto-label">${label}</span>
    <${Tabs} variant="primary" value=${value} onValueChange=${v => setOpt(k, v)}>
      <${TabList} aria-label=${label}>${opts.map(([v, l]) => html`<${Tab} key=${v} value=${v}>${l}<//>`)}<//>
    <//>
  </div>`;

  function Proto(){
    const cur = curKey();
    return html`<aside class=${'proto' + (S.protoCollapsed ? ' collapsed' : '')} aria-label="Prototype controls">
      <div class="proto-head">
        <span class="proto-title">Prototype · Mobile</span>
        <${Button} variant="tertiary-color" onClick=${() => { S.protoCollapsed = !S.protoCollapsed; render(); }}>${S.protoCollapsed ? 'Show controls' : 'Hide controls'}<//>
        <p class="proto-ticket p3" aria-live="polite"><b>UX-1224</b> ${TICKET[S.state] || ''}</p>
      </div>
      <div class="proto-body">
        ${SCREENS.map(([group, items]) => html`<div class="proto-group" key=${group}>
          <span class="proto-label">${group}</span>
          <${Tabs} variant="vertical" value=${items.some(([k]) => k === cur) ? cur : ''} onValueChange=${jump}>
            <${TabList} aria-label=${group}>${items.map(([k, l]) => html`<${Tab} key=${k} value=${k} onClick=${() => { if (k === cur) jump(k); }}>${l}<//>`)}<//>
          <//>
        </div>`)}
        <${Seg} label="Device" k="platform" value=${S.platform} opts=${[['android', 'Chrome'], ['ios', 'iPhone']]} />
        <${Seg} label="Blocked screen shows" k="blockedReason" value=${S.blockedReason} opts=${[['denied', 'Site'], ['os', 'App'], ['inuse', 'In use'], ['nocam', 'No cam'], ['nomic', 'No mic']]} />
        <${Seg} label="Site permission" k="permMode" value=${S.permMode} opts=${[['ask', 'Asks'], ['granted', 'Allowed'], ['inuse', 'Camera in use']]} />
        <${Seg} label="Chrome's app permission" k="osGranted" value=${S.osGranted ? 'yes' : 'no'} opts=${[['no', 'Asks the OS'], ['yes', 'Already has it']]} hidden=${S.platform !== 'android'} />
        <${Seg} label="Voice check" k="voiceMode" value=${S.voiceMode} opts=${[['heard', 'Voice heard'], ['silent', 'Silent']]} />
        <${Seg} label="Loading" k="loadMode" value=${S.loadMode} opts=${[['ok', 'Succeeds'], ['fail', 'Fails']]} />
        <${Seg} label="Connection" k="netMode" value=${S.netMode} opts=${[['online', 'Online'], ['poor', 'Weak'], ['offline', 'Offline']]} />
        <${Seg} label="Saving the answer" k="saveMode" value=${S.saveMode} opts=${[['ok', 'Saves'], ['slow', 'Slow'], ['fail', 'Fails']]} />
        <${Seg} label="Prep countdown" k="prepStyle" value=${S.prepStyle} opts=${[['button', 'Fills button'], ['bar', 'Bar']]} />
        <${Seg} label="Prep time" k="prepSecs" value=${String(S.prepSecs)} opts=${[['5', '5s'], ['15', '15s'], ['30', '30s']]} />
        <${Seg} label="Countdown on the practice question" k="practicePrep" value=${S.practicePrep ? 'on' : 'off'} opts=${[['on', 'On'], ['off', 'Off']]} />
        <${Seg} label="Answer time limit" k="limitSecs" value=${String(S.limitSecs)} opts=${[['10', '10s'], ['120', '2 min']]} />
        <div class="proto-group">
          <span class="proto-label">Try it</span>
          <div class="proto-actions">
            ${(S.state === 'record' && S.recording) ? html`<${Fragment}>
              <${Button} variant="secondary-gray" onClick=${() => interrupt('away')}>Leave the page mid-recording<//>
              <${Button} variant="secondary-gray" onClick=${() => interrupt('device')}>Incoming call mid-recording<//><//>` : null}
            <${Button} variant="secondary-gray" onClick=${dropConnection}>Lose connection for a while<//>
            <${Button} variant="secondary-gray" onClick=${reloadResume}>Reload the page<//>
            <${Button} variant="tertiary-color" onClick=${resetProgress}>Reset saved progress<//>
          </div>
        </div>
      </div>
    </aside>`;
  }

  /* ================= App ================= */
  function App(){
    const [, setN] = useState(0);
    bump = () => setN(n => n + 1);
    const stageRef = useRef(null);
    const [K, setK] = useState(1);
    useEffect(() => {
      const fit = () => {
        const el = stageRef.current;
        if (!el) return;
        const cs = getComputedStyle(el);
        const w = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        const h = el.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
        const d = PHONES[S.platform];
        setK(Math.max(.1, Math.min(1, (w - 26) / d.w, (h - 26) / d.h)));
      };
      fit();
      addEventListener('resize', fit);
      return () => removeEventListener('resize', fit);
    }, [S.platform]);
    useEffect(() => {
      const onKey = e => {
        if (e.key !== 'Escape') return;
        if (S.sheet){ S.sheet = null; render(); } else if (S.alvyOpen) closeAlvy();
      };
      document.addEventListener('keydown', onKey);
      return () => document.removeEventListener('keydown', onKey);
    }, []);
    const d = PHONES[S.platform];
    return html`<div class="app">
      <div class="stage" ref=${stageRef}>
        <div id="phone" role="region" aria-label="Candidate phone screen" style=${{'--pw':d.w + 'px', '--ph':d.h + 'px', '--k':K}}>
          <div id="frame">
            <${ChromeTop} />
            <div id="viewport">
              <div class="topstack"><${TopNav} /><${Broadcast} /></div>
              <${DeviceSheet} />
              <main id="view">
                <${Screen} />
                ${S.alvyOpen ? html`<section class="alvy" aria-label="Chat with Alvy">
                  <${ChatPanel} header=${{title:'Chat with Alvy', icon:html`<${Icon} name="sparkle" size=${18} />`, onClose:closeAlvy, closeLabel:'Close chat'}}
                    messages=${S.alvyMsgs} typing=${S.alvyTyping ? ['Alvy'] : null}
                    composer=${{onSend:sendChat, placeholder:'Ask a question…', maxRows:4}} />
                </section>` : null}
                ${S.dialog ? html`<${Dialog} />` : null}
                <${Modal} open=${S.retakeAsk} portal=${false} title="Retake response"
                  onOpenChange=${o => { if (!o){ S.retakeAsk = false; render(); } }}
                  primaryAction=${{label:'Yes, retake', onClick:() => go('question')}}
                  secondaryAction=${{label:'Go back'}}>
                  Your current answer will be deleted if you choose to retake it. Are you sure you want to proceed?
                <//>
              </main>
            </div>
            <${ChromeBottom} />
          </div>
        </div>
      </div>
      <${Proto} />
    </div>`;
  }

  // A page that loads with onboarding already done is a reload: rebuild from what was saved.
  if (P.onboarded && !P.finished){ S.resuming = true; S.restoreNote = true; S.assessing = true; S.timeLeft = P.timeLeft; }
  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
  go('wait');
})();
</script>
