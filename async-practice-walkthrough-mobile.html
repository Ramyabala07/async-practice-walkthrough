<title>Async Practice Walkthrough — Mobile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Mobile companion to async-practice-walkthrough.html.

   Not a port of the desktop tour. On a phone the onboarding is a linear run of full
   screens — no spotlight, no coach marks, no step sheet floating over the page:
     loading → allow (priming) → the browser's own permission dialogs → device check
     → question → get ready → record → all set → countdown
   Light screens carry the instructions. The camera takes the whole screen only where
   the camera is the point: the device check, getting ready, and recording.

   Permission dialogs are drawn the way each platform really draws them:
   - Android: Chrome's own modal, and then ANDROID's runtime dialogs, which is the second
     ask candidates actually hit. Chrome asks the OS only after the site itself is allowed,
     and the OS asks for camera and microphone separately.
   - iOS: one centred Safari alert. Safari re-asks on every page load unless the candidate
     sets it in Website Settings, so "Allow" does not stick the way it does on desktop.

   Light mode only. Colour values follow the V8 Test Taker Experience Figma variables (zinc
   greys). Values marked "not in Figma" need checking against the DS before shipping. */
:root{
  color-scheme:light;
  --stage-bg:#d4d4d8;
  --tv-font:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;

  --tv-bg-surface:#ffffff;
  --tv-bg-muted:#fafafa;
  --tv-bg-accent:#eff6ff;
  --tv-text-primary:#18181b;
  --tv-text-tertiary:#3f3f46;
  --tv-text-muted:#71717a;                            /* not in Figma */
  --tv-text-on-primary:#ffffff;
  --tv-border-subtle:#e4e4e7;
  --tv-border-primary:#d4d4d8;
  --tv-border-strong:#a1a1aa;
  --tv-interactive-primary:#1d4ed8;
  --tv-interactive-primary-hover:#1e40af;
  --tv-interactive-link:#1d4ed8;
  --tv-error-strong:#dc2626;
  --tv-error-surface:#fef2f2; --tv-error-border:#fca5a5; --tv-error-text:#b91c1c;         /* not in Figma */
  --tv-warning-surface:#fff7ed; --tv-warning-border:#fdba74; --tv-warning-text:#c2410c;   /* not in Figma */
  --tv-success-surface:#f0fdf4; --tv-success-border:#86efac; --tv-success-text:#15803d;   /* not in Figma */
  --tv-ai-blue:#1d4ed8;
  --tv-ai-purple:#7e22ce;

  --tv-video-bg:#27272a;
  --tv-video-fg:#d4d4d8;
  --tv-on-video:#ffffff;
  --tv-scrim:rgba(24,24,27,.6);
  --tv-toggle-off:#71717a;
  --tv-toggle-knob:#ffffff;
  --tv-chat-you:#dbeafe;

  --tv-shadow-sm:0 1px 2px #0A0D120F,0 1px 3px #0A0D121A;

  --tv-h3:500 22px/30px var(--tv-font);
  --tv-h4:500 18px/26px var(--tv-font);
  --tv-h5:500 16px/24px var(--tv-font);
  --tv-p1:400 16px/24px var(--tv-font);
  --tv-p2:400 14px/20px var(--tv-font);
  --tv-p3:400 12px/18px var(--tv-font);
  --tv-l1:500 14px/20px var(--tv-font);
  --tv-l2:500 12px/18px var(--tv-font);
  --tv-n2:400 24px/36px var(--tv-font);

  /* Minimum touch target: 48dp on Android, 44pt on iOS. 48 satisfies both. */
  --tap:48px;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:row;font:var(--tv-p1);color:var(--tv-text-primary);background:var(--stage-bg);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.i.sm{width:16px;height:16px}
.i.xs{width:13px;height:13px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
:focus-visible{outline:2px solid var(--tv-interactive-primary);outline-offset:2px}

/* ---------- Stage + phone frame ---------- */
.stage{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#phone{position:absolute;left:50%;top:50%;width:var(--pw);height:var(--ph);margin:calc(var(--ph) / -2) 0 0 calc(var(--pw) / -2);
  transform:scale(var(--k,1));transform-origin:50% 50%;background:#000;border-radius:38px;
  box-shadow:0 10px 50px rgba(0,0,0,.28),0 0 0 11px #18181b,0 0 0 12px #3f3f46;overflow:hidden}

/* Browser chrome, drawn because the blocked-permission steps name parts of it. */
.sysbar{flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font:500 12px/1 var(--tv-font);color:var(--tv-text-primary);background:var(--tv-bg-surface)}
.sysbar .sys-right{display:flex;align-items:center;gap:5px}
.notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:108px;height:27px;border-radius:999px;background:#000;z-index:3}
.urlbar{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--tv-bg-surface)}
.urlbar.top{border-bottom:1px solid var(--tv-border-subtle)}
.urlbar.bottom{border-top:1px solid var(--tv-border-subtle)}
.url-field{flex:1;min-width:0;display:flex;align-items:center;gap:7px;height:34px;padding:0 10px;border-radius:999px;background:#f1f1f3;font:var(--tv-p3);color:var(--tv-text-tertiary)}
.url-field .url{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.url-btn{flex:none;width:28px;height:28px;margin:-3px 0;border:0;border-radius:8px;background:none;display:inline-flex;align-items:center;justify-content:center;color:var(--tv-text-tertiary)}
.url-btn.aa{width:auto;padding:0 7px;font:500 15px/1 var(--tv-font);letter-spacing:-.02em}
.url-btn.aa b{font-size:11px;font-weight:500}
.urlbar .chev-btn{flex:none;width:28px;height:28px;border:0;background:none;color:var(--tv-text-tertiary);display:inline-flex;align-items:center;justify-content:center}
.navbar{flex:none;height:18px;background:var(--tv-bg-surface);display:flex;align-items:center;justify-content:center}
.navbar span{width:106px;height:4px;border-radius:2px;background:#18181b;opacity:.75}
.home-ind{flex:none;height:22px;background:var(--tv-bg-surface);display:flex;align-items:flex-start;justify-content:center;padding-top:4px}
.home-ind span{width:134px;height:5px;border-radius:3px;background:#18181b;opacity:.85}

#frame{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--tv-bg-surface);overflow:hidden}
#viewport{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;background:var(--tv-bg-surface)}
#view{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}

/* ---------- Light instruction screen ---------- */
.screen{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--tv-bg-surface)}
.appbar{flex:none;height:52px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 6px 0 14px;border-bottom:1px solid var(--tv-border-subtle)}
.logo{display:flex;align-items:center;gap:7px;font:500 14px/1 var(--tv-font);letter-spacing:.06em;color:var(--tv-text-tertiary)}
.logo svg{width:24px;height:24px}
.bar-right{display:flex;align-items:center}
.icon-btn{width:var(--tap);height:var(--tap);border-radius:10px;border:0;background:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tv-text-tertiary)}
.icon-btn:hover{background:var(--tv-border-subtle)}
.icon-btn.ai{color:var(--tv-ai-purple)}
.screen-body{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:24px 20px 8px;display:flex;flex-direction:column}
.screen-foot{flex:none;padding:12px 20px 20px;display:grid;gap:8px;border-top:1px solid transparent}
.screen-foot.divided{border-top-color:var(--tv-border-subtle)}
.step-no{margin:0 0 6px;font:var(--tv-l2);color:var(--tv-text-muted);letter-spacing:.04em}
.screen h1{margin:0 0 8px;font:var(--tv-h3);text-wrap:pretty}
.screen h1.tone-error{color:var(--tv-error-text)}
.screen .lede{margin:0;font:var(--tv-p1);color:var(--tv-text-tertiary);text-wrap:pretty}
.screen .sub{margin:16px 0 0;font:var(--tv-p2);color:var(--tv-text-muted)}

/* The mark at the top of a light screen: says what the screen is about at a glance. */
.mark{flex:none;width:60px;height:60px;border-radius:18px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;position:relative;background:var(--tv-bg-accent);color:var(--tv-interactive-primary)}
.mark .i{width:28px;height:28px}
.mark.err{background:var(--tv-error-surface);color:var(--tv-error-text)}
.mark.ok{background:var(--tv-success-surface);color:var(--tv-success-text)}
.mark .badge{position:absolute;right:-8px;bottom:-8px;width:28px;height:28px;border-radius:50%;background:var(--tv-bg-surface);border:1px solid var(--tv-border-subtle);display:flex;align-items:center;justify-content:center;color:var(--tv-interactive-primary)}
.mark .badge .i{width:15px;height:15px}

/* Why each device is needed: two rows, not a paragraph. */
.needs{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:12px}
.needs li{display:flex;align-items:flex-start;gap:12px;font:var(--tv-p2);color:var(--tv-text-tertiary)}
.needs .ti{flex:none;width:36px;height:36px;border-radius:10px;background:var(--tv-bg-muted);border:1px solid var(--tv-border-subtle);display:flex;align-items:center;justify-content:center;color:var(--tv-text-tertiary)}
.needs b{display:block;font:var(--tv-l1);color:var(--tv-text-primary)}

.steps{margin:18px 0 0;padding-left:22px;display:grid;gap:10px;font:var(--tv-p2);color:var(--tv-text-tertiary)}
.steps b{font-weight:500;color:var(--tv-text-primary)}
.help-link{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);padding:4px 0;border:0;background:none;cursor:pointer;font:var(--tv-l1);color:var(--tv-interactive-link);text-align:left}
.help-link:hover{text-decoration:underline}

/* Where to tap, drawn instead of pointed at: a small mock of this browser's own bar. */
.card{margin:18px 0 0;padding:12px;border:1px solid var(--tv-border-subtle);border-radius:12px;background:var(--tv-bg-muted)}
.card .cap{display:flex;align-items:center;gap:8px;font:var(--tv-l2);text-transform:uppercase;letter-spacing:.05em;color:var(--tv-text-muted);margin-bottom:10px}
.mockbar{display:flex;align-items:center;gap:7px;height:38px;padding:0 10px;border-radius:999px;background:var(--tv-bg-surface);border:1px solid var(--tv-border-primary);font:var(--tv-p3);color:var(--tv-text-muted)}
.mockbar .url{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mockbar .spot{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 6px;border-radius:8px;background:var(--tv-bg-accent);
  color:var(--tv-interactive-primary);box-shadow:0 0 0 2px var(--tv-interactive-primary);font:500 14px/1 var(--tv-font)}
.mockbar .spot b{font-size:10px;font-weight:500}
.question-big{margin:0;font:var(--tv-h4);text-wrap:pretty;color:var(--tv-text-primary)}
.tag{font:var(--tv-l2);text-transform:none;letter-spacing:0;padding:1px 8px;border-radius:4px;background:var(--tv-bg-accent);color:var(--tv-interactive-link)}

/* ---------- Buttons ---------- */
.btn{font:var(--tv-l1);border-radius:10px;padding:12px 16px;min-height:var(--tap);border:1px solid transparent;background:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{cursor:default;opacity:.45}
.btn-primary{background:var(--tv-interactive-primary);color:var(--tv-text-on-primary)}
.btn-primary:hover:not(:disabled){background:var(--tv-interactive-primary-hover)}
.btn-secondary{background:var(--tv-bg-surface);border-color:var(--tv-border-primary);color:var(--tv-text-primary)}
.btn-secondary:hover{background:var(--tv-bg-muted)}
.btn-ghost{color:var(--tv-interactive-link)}
.btn-block{width:100%}
.btn-rec{background:var(--tv-error-strong);color:#fff}
.btn-rec:hover:not(:disabled){background:#b91c1c}
.foot-hint{font:var(--tv-p3);color:var(--tv-text-muted);text-align:center}

/* ---------- Camera screen: the camera owns the screen ---------- */
.camscreen{flex:1;min-height:0;position:relative;background:var(--tv-video-bg);overflow:hidden}
.cam-media{position:absolute;inset:0}
.cam-media video,.cam-media canvas{display:block;width:100%;height:100%;object-fit:cover}
.cam-media video{transform:scaleX(-1)} /* mirrored, like a mirror */
.cam-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;color:var(--tv-video-fg);font:var(--tv-p2)}
.cam-msg .i{width:30px;height:30px}
.sim-tag{position:absolute;top:92px;right:12px;z-index:3;font:var(--tv-l2);color:var(--tv-on-video);background:var(--tv-scrim);padding:3px 9px;border-radius:999px}

.cam-top{position:absolute;left:0;right:0;top:0;z-index:2;padding:0 6px 10px 14px;
  background:linear-gradient(to bottom,rgba(9,9,11,.78),rgba(9,9,11,0))}
.cam-top .row1{height:52px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.cam-top .row2{display:flex;align-items:center;gap:8px;padding-right:8px}
.cam-top .row2:empty{display:none}
.cam-top .logo,.cam-top .icon-btn{color:rgba(255,255,255,.94)}
.cam-top .icon-btn:hover{background:rgba(255,255,255,.14)}
.cam-top .icon-btn.ai{color:#d8b4fe}
.rec-pill{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:rgba(220,38,38,.94);color:#fff;font:var(--tv-l2);font-variant-numeric:tabular-nums}
.rec-dot{width:8px;height:8px;border-radius:50%;background:#fff;flex:none;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.qchip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 13px;border-radius:999px;border:1px solid rgba(255,255,255,.32);
  background:var(--tv-scrim);color:var(--tv-on-video);font:var(--tv-l2);cursor:pointer;backdrop-filter:blur(6px)}
.qchip:hover{background:rgba(24,24,27,.8)}

.cam-bottom{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:48px 14px 16px;display:grid;gap:10px;
  background:linear-gradient(to top,rgba(9,9,11,.92) 46%,rgba(9,9,11,0))}
.cam-bottom .step-no{margin:0;color:rgba(255,255,255,.74)}
.cam-bottom h2{margin:0;font:var(--tv-h5);color:var(--tv-on-video);text-wrap:pretty}
.cam-bottom .say{margin:0;font:var(--tv-p2);color:rgba(255,255,255,.82);text-wrap:pretty}
.cam-bottom .help-link{color:#93c5fd;min-height:40px}
.cam-bottom .foot-hint{color:rgba(255,255,255,.74)}
.cam-status{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.vchip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--tv-scrim);color:var(--tv-on-video);font:var(--tv-l2);backdrop-filter:blur(6px)}
.vchip.ok .i{color:#86efac}
.vchip.warn{background:rgba(154,52,18,.92)}
.vchip .spin{border-color:rgba(255,255,255,.35);border-top-color:#fff}
.cam-devices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.vselect{position:relative;display:flex;align-items:center;min-width:0;height:42px;border:1px solid rgba(255,255,255,.32);border-radius:10px;background:var(--tv-scrim);backdrop-filter:blur(6px)}
.vselect select{appearance:none;-webkit-appearance:none;width:100%;min-width:0;height:100%;border:0;background:none;color:var(--tv-on-video);font:var(--tv-l2);padding:0 26px 0 32px;cursor:pointer;text-overflow:ellipsis}
.vselect option{color:#18181b}
.vselect .i{position:absolute;pointer-events:none;color:var(--tv-on-video)}
.vselect .lead{left:9px}.vselect .chev{right:7px}
.cam-actions{display:flex;align-items:center;gap:10px}
.cam-actions .btn{flex:1}
.toggle{display:inline-flex;align-items:center;gap:8px;min-height:var(--tap);padding:0 2px;background:none;border:0;cursor:pointer;font:var(--tv-l1);color:var(--tv-on-video);white-space:nowrap}
.track{width:34px;height:18px;border-radius:9px;background:var(--tv-toggle-off);position:relative;transition:background .2s;flex:none}
.track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--tv-toggle-knob);transition:transform .2s}
.toggle[aria-pressed="true"] .track{background:var(--tv-interactive-primary)}
.toggle[aria-pressed="true"] .track::after{transform:translateX(16px)}

.meter{display:inline-flex;align-items:flex-end;gap:2px;height:16px}
.meter i{width:3px;height:3px;border-radius:2px;background:currentColor;opacity:.9}
.meter.done i{height:10px!important}

/* ---------- The browser's own permission dialogs ---------- */
.scrim{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(0,0,0,.45)}
/* Chrome on Android: a Material modal, centred, text buttons bottom-right. */
.dlg-site{width:100%;max-width:300px;background:var(--tv-bg-surface);border-radius:28px;padding:22px 22px 12px;box-shadow:0 16px 48px rgba(0,0,0,.3)}
.dlg-site .ico{display:flex;gap:6px;color:var(--tv-text-tertiary);margin-bottom:12px}
.dlg-site p{margin:0;font:400 16px/22px var(--tv-font);color:var(--tv-text-primary)}
.dlg-site .acts{display:flex;justify-content:flex-end;gap:4px;margin-top:16px}
.dlg-site .acts button{min-height:44px;padding:0 14px;border:0;border-radius:999px;background:none;color:var(--tv-interactive-primary);font:500 14px/1 var(--tv-font);cursor:pointer}
.dlg-site .acts button:hover{background:var(--tv-bg-accent)}
/* Android's own runtime dialog: icon on top, centred title, three stacked choices. */
.dlg-os{width:100%;max-width:300px;background:var(--tv-bg-surface);border-radius:28px;padding:24px 20px 10px;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,.3)}
.dlg-os .ico{margin:0 auto 16px;color:var(--tv-text-tertiary)}
.dlg-os .ico .i{width:34px;height:34px}
.dlg-os p{margin:0;font:400 18px/24px var(--tv-font);color:var(--tv-text-primary);text-wrap:balance}
.dlg-os p b{font-weight:500}
.dlg-os .acts{display:grid;margin-top:18px}
.dlg-os .acts button{min-height:52px;border:0;background:none;color:var(--tv-interactive-primary);font:500 14px/1 var(--tv-font);cursor:pointer;border-radius:12px}
.dlg-os .acts button:hover{background:var(--tv-bg-accent)}
/* Safari on iOS: a system alert. */
.dlg-ios{width:272px;background:rgba(249,249,249,.97);border-radius:14px;overflow:hidden;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dlg-ios .body{padding:19px 16px 15px}
.dlg-ios strong{display:block;font:600 15px/20px var(--tv-font);color:#000}
.dlg-ios .acts{display:flex;border-top:1px solid rgba(60,60,67,.29)}
.dlg-ios .acts button{flex:1;min-height:44px;border:0;background:none;color:#0a7cff;font:400 17px/1 var(--tv-font);cursor:pointer}
.dlg-ios .acts button+button{border-left:1px solid rgba(60,60,67,.29);font-weight:600}
.dlg-note{margin:10px auto 0;max-width:300px;font:var(--tv-p3);color:rgba(255,255,255,.88);text-align:center}

/* ---------- Question sheet: opened by the candidate, not pushed at them ---------- */
.qsheet-wrap{position:absolute;inset:0;z-index:55;display:flex;align-items:flex-end;background:rgba(0,0,0,.45)}
.qsheet{width:100%;max-height:72%;overflow:auto;background:var(--tv-bg-surface);border-radius:18px 18px 0 0;padding:12px 18px 18px}
.grab{width:36px;height:4px;border-radius:2px;background:var(--tv-border-primary);margin:0 auto 12px}
.qsheet .qlabel{display:flex;align-items:center;gap:8px;font:var(--tv-l2);text-transform:uppercase;letter-spacing:.05em;color:var(--tv-text-muted);margin-bottom:10px}
.qsheet .question{margin:0 0 18px;font:var(--tv-h5);text-wrap:pretty}

/* ---------- Wait / countdown / skeleton ---------- */
.centre{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 20px}
.centre h1{font:var(--tv-h4);margin:14px 0 4px;text-wrap:balance}
.centre p{font:var(--tv-p2);color:var(--tv-text-tertiary);margin:0 0 18px}
.checklist{list-style:none;margin:0;padding:4px 16px;background:var(--tv-bg-muted);border:1px solid var(--tv-border-subtle);border-radius:10px;width:100%;text-align:left}
.checklist li{display:flex;align-items:center;gap:10px;padding:9px 0;font:var(--tv-p2)}
.checklist li.done .i{color:var(--tv-success-text)}
.checklist li.pend{color:var(--tv-text-muted)}
.checklist li.fail{color:var(--tv-error-text)}
.spin{width:16px;height:16px;border:2px solid var(--tv-border-primary);border-top-color:var(--tv-interactive-primary);border-radius:50%;animation:spin .8s linear infinite;flex:none}
.spin.xs{width:12px;height:12px}
.spin.lg{width:26px;height:26px;border-width:3px}
@keyframes spin{to{transform:rotate(360deg)}}
.count-ring{position:relative;width:116px;height:116px;margin:8px auto 0}
.count-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.count-ring circle{fill:none;stroke-width:5}
.count-ring .bg{stroke:var(--tv-border-subtle)}
.count-ring .fg{stroke:var(--tv-interactive-primary);stroke-linecap:round;stroke-dasharray:289;stroke-dashoffset:0}
.count-ring .fg.run{animation:sweep 1s linear forwards}
@keyframes sweep{to{stroke-dashoffset:289}}
.count-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:var(--tv-n2)}
.skel{flex:1;min-height:0;overflow:auto;padding:14px;background:var(--tv-bg-muted);display:flex;flex-direction:column;gap:12px}
.sk{background:var(--tv-border-subtle);border-radius:4px;flex:none}
.sk-head{width:62%;height:16px}
.sk-media{border-radius:10px;background:var(--tv-bg-accent);aspect-ratio:4/3;width:100%}
.sk-line{height:8px}
.sk-lines{display:grid;gap:12px;margin-top:4px}
.proto-note{display:grid;gap:10px;justify-items:start;margin-top:8px;padding:14px;border:1px dashed var(--tv-border-strong);border-radius:10px;background:var(--tv-bg-surface);font:var(--tv-p3);color:var(--tv-text-tertiary)}

/* ---------- Chat with Alvy ---------- */
.alvy{position:absolute;inset:0;z-index:65;display:flex;flex-direction:column;background:var(--tv-bg-surface)}
.alvy-head{flex:none;display:flex;align-items:center;gap:6px;padding:4px 8px;border-bottom:1px solid var(--tv-border-subtle)}
.alvy-head h2{margin:0;font:var(--tv-h5)}
.chat-log{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:16px 14px}
.chat-log:before{content:"";margin-top:auto}
.msg{display:grid;gap:6px}
.msg .who{font:var(--tv-l2)}
.msg.you .who{justify-self:end}
.bubble{border-radius:10px;padding:10px 12px;font:var(--tv-p2)}
.msg.bot .bubble{background:linear-gradient(171deg,var(--tv-ai-blue),var(--tv-ai-purple));color:var(--tv-on-video)}
.msg.you .bubble{background:var(--tv-chat-you)}
.bubble ol{margin:6px 0 0;padding-left:18px;display:grid;gap:5px}
.bubble b{font-weight:500}
.bubble .time{display:block;margin-top:6px;font:var(--tv-p3);opacity:.85;text-align:right}
.msg.bot .bubble .time{text-align:left}
.searching{display:flex;align-items:center;gap:8px;font:var(--tv-p2);color:var(--tv-text-muted)}
.chat-form{flex:none;border-top:1px solid var(--tv-border-subtle);padding:8px 12px;display:flex;align-items:center;gap:8px}
.chat-form input{flex:1;min-width:0;border:0;background:none;font:var(--tv-p2);padding:12px 2px;outline-offset:2px}
.chat-form input::placeholder{color:var(--tv-text-muted)}
.chat-form .send{border:0;background:none;color:var(--tv-interactive-primary);font:var(--tv-l1);min-height:var(--tap);padding:0 8px;cursor:pointer}

/* ---------- Prototype controls (not part of the design) ---------- */
.proto{flex:none;position:relative;z-index:70;width:300px;height:100%;overflow:auto;display:flex;flex-direction:column;background:var(--tv-bg-surface);border-left:1px solid var(--tv-border-strong);font:var(--tv-p3);color:var(--tv-text-tertiary)}
.proto-head,.proto-body{padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.proto-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:12px;border-bottom:1px solid var(--tv-border-subtle)}
.proto-title{flex:none;font:var(--tv-l2);color:var(--tv-text-primary);letter-spacing:.04em;text-transform:uppercase}
.proto-head button{flex:none;margin-left:auto;font:var(--tv-l2);border:0;background:none;color:var(--tv-interactive-link);cursor:pointer;padding:4px 6px;border-radius:6px}
.proto-ticket{order:3;flex-basis:100%;margin:0;padding:8px 10px;border-radius:8px;background:var(--tv-bg-muted);color:var(--tv-text-tertiary)}
.proto-ticket b{font:var(--tv-l2);color:var(--tv-text-primary)}
.proto-body{display:flex;flex-direction:column;gap:16px;padding-top:14px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.proto.collapsed{width:auto}
.proto.collapsed .proto-body,.proto.collapsed .proto-ticket{display:none}
.proto.collapsed .proto-head{flex-direction:column;align-items:flex-start;border-bottom:0}
.proto.collapsed .proto-head button{margin-left:0}
.proto-group{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.proto-group[hidden]{display:none}
.proto-label{font:var(--tv-l2);color:var(--tv-text-muted)}
.chips,.seg{display:flex;flex-wrap:wrap;gap:4px}
.chips button,.seg button{white-space:nowrap;font:var(--tv-l2);border:1px solid var(--tv-border-primary);background:var(--tv-bg-surface);color:var(--tv-text-tertiary);border-radius:999px;padding:3px 10px;cursor:pointer}
.chips button[aria-current="step"],.seg button[aria-pressed="true"]{border-color:var(--tv-interactive-primary);color:var(--tv-interactive-link);background:var(--tv-bg-accent)}
@media (max-width:760px){
  body{flex-direction:column}
  .proto{width:auto;height:auto;max-height:45%;border-left:0;border-top:1px solid var(--tv-border-strong)}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<div class="stage" id="stage">
<div id="phone" role="region" aria-label="Candidate phone screen">
  <div id="frame">
    <div id="chromeTop"></div>
    <div id="viewport"><main id="view"></main></div>
    <div id="chromeBottom"></div>
  </div>

  <section class="alvy" id="alvy" aria-label="Chat with Alvy" hidden>
    <div class="alvy-head">
      <button class="icon-btn" data-act="alvy-close" type="button" aria-label="Back"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19l-7-7 7-7"/></svg></button>
      <h2>Chat with Alvy</h2>
    </div>
    <div class="chat-log" id="chatLog" aria-live="polite"></div>
    <form class="chat-form" id="chatForm">
      <input id="chatInput" placeholder="Ask a question…" aria-label="Ask Alvy a question" autocomplete="off">
      <button class="send" type="submit">Send</button>
    </form>
  </section>
</div>
</div>

<aside class="proto" id="proto" aria-label="Prototype controls">
  <div class="proto-head">
    <span class="proto-title">Prototype · Mobile</span>
    <p class="proto-ticket" id="protoTicket" aria-live="polite"></p>
    <button type="button" id="protoToggle" aria-expanded="true" aria-controls="protoBody">Hide controls</button>
  </div>
  <div class="proto-body" id="protoBody">
    <div class="proto-group"><span class="proto-label">Variant</span>
      <div class="seg"><button type="button" data-set="variant" data-val="A">A · Check is its own screen</button><button type="button" data-set="variant" data-val="B">B · Check is step 2 of 5</button></div>
    </div>
    <div class="proto-group"><span class="proto-label">Device</span>
      <div class="seg"><button type="button" data-set="platform" data-val="android">Android · Chrome</button><button type="button" data-set="platform" data-val="ios">iPhone · Safari</button></div>
    </div>
    <div class="proto-group"><span class="proto-label">Jump to</span>
      <div class="chips" id="jumpChips"></div>
    </div>

      <div class="seg"><button type="button" data-set="permMode" data-val="ask">Asks</button><button type="button" data-set="permMode" data-val="granted">Already allowed</button><button type="button" data-set="permMode" data-val="inuse">Camera in use</button></div>
    </div>

      <div class="seg"><button type="button" data-set="osGranted" data-val="no">Chrome must ask the OS</button><button type="button" data-set="osGranted" data-val="yes">Chrome already has it</button></div>
    </div>
    <div class="proto-group"><span class="proto-label">Voice check</span>
      <div class="seg"><button type="button" data-set="voiceMode" data-val="heard">Voice heard</button><button type="button" data-set="voiceMode" data-val="silent">Silent</button></div>
    </div>
    <div class="proto-group"><span class="proto-label">Loading</span>
      <div class="seg"><button type="button" data-set="loadMode" data-val="ok">Succeeds</button><button type="button" data-set="loadMode" data-val="fail">Fails</button></div>
    </div>
  </div>
</aside>

<script>
(() => {
  const ICON = {
    video:'<path d="M15 10l4.553-2.276A1 1 0 0 1 21 8.618v6.764a1 1 0 0 1-1.447.894L15 14v-4z"/><rect x="3" y="6" width="12" height="12" rx="2"/>',
    mic:'<rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M8 21h8M12 17v4"/>',
    micOff:'<path d="M3 3l18 18M9 9v1a3 3 0 0 0 5.12 2.12M15 9.34V5a3 3 0 0 0-5.94-.6M17 16.95A7 7 0 0 1 5 10M19 10a7 7 0 0 1-.11 1.23M8 21h8M12 17v4"/>',
    chevron:'<path d="M6 9l6 6 6-6"/>',
    chevUp:'<path d="M18 15l-6-6-6 6"/>',
    check:'<path d="M5 12l5 5L20 7"/>',
    info:'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>',
    eyeOff:'<path d="M3 3l18 18M10.584 10.587a2 2 0 0 0 2.828 2.83M9.363 5.365A9.466 9.466 0 0 1 12 5c4 0 7.333 2.333 10 7-.778 1.361-1.612 2.524-2.503 3.488M17.357 17.349C15.726 18.449 13.942 19 12 19c-4 0-7.333-2.333-10-7 1.369-2.395 2.913-4.175 4.632-5.341"/>',
    videoOff:'<path d="M3 3l18 18M15 11v-1l4.553-2.276A1 1 0 0 1 21 8.618v6.764a1 1 0 0 1-.675.946M10 6h3a2 2 0 0 1 2 2v3m0 4v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h1"/>',
    circleCheck:'<circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/>',
    circleX:'<circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/>',
    circle:'<circle cx="12" cy="12" r="9"/>',
    alert:'<path d="M12 9v4M12 17h.01M10.24 3.957 2.389 17.06a2 2 0 0 0 1.71 3h15.802a2 2 0 0 0 1.71-3L13.76 3.957a2 2 0 0 0-3.52 0z"/>',
    lock:'<rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
    dots:'<circle cx="12" cy="5" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.4" fill="currentColor" stroke="none"/>',
    share:'<path d="M12 16V4M8 8l4-4 4 4M5 14v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"/>',
    globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>',
    alvy:'<path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M18 15.5l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9z"/>',
    rec:'<circle cx="12" cy="12" r="5" fill="currentColor" stroke="none"/>',
    square:'<rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor" stroke="none"/>',
    sig:'<path d="M2 20h.01M6 20v-4M11 20v-9M16 20V8M21 20V4"/>',
    batt:'<rect x="2" y="7" width="17" height="10" rx="2.5"/><path d="M22 11v2"/><rect x="4" y="9" width="11" height="6" rx="1" fill="currentColor" stroke="none"/>'
  };
  const ic = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;'})[c]);

  const phone = $('phone'), stage = $('stage'), view = $('view');
  const chromeTop = $('chromeTop'), chromeBottom = $('chromeBottom');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');

  const PHONES = {android:{w:360, h:800}, ios:{w:390, h:844}};
  const SITE = 'cx-v2.talview.com';
  const dev = () => PHONES[S.platform];

  let K = 1;
  function fit(){
    const cs = getComputedStyle(stage);
    const w = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const h = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    K = Math.max(.1, Math.min(1, (w - 26) / dev().w, (h - 26) / dev().h));
    phone.style.setProperty('--k', K);
  }

  function renderChrome(){
    const d = dev();
    phone.style.setProperty('--pw', d.w + 'px');
    phone.style.setProperty('--ph', d.h + 'px');
    const sys = `<span class="sys-right">${ic('sig', 'xs')}${ic('batt', 'xs')}</span>`;
    if (S.platform === 'android'){
      chromeTop.innerHTML =
        `<div class="sysbar" style="height:26px"><span>9:41</span>${sys}</div>
         <div class="urlbar top">
           <div class="url-field"><span class="url-btn">${ic('lock', 'sm')}</span><span class="url">${SITE}</span></div>
           <span class="chev-btn">${ic('dots', 'sm')}</span>
         </div>`;
      chromeBottom.innerHTML = '<div class="navbar"><span></span></div>';
    } else {
      chromeTop.innerHTML = `<div class="notch"></div><div class="sysbar" style="height:46px;align-items:flex-end;padding-bottom:6px"><span>9:41</span>${sys}</div>`;
      chromeBottom.innerHTML =
        `<div class="urlbar bottom">
           <div class="url-field"><span class="url-btn aa">a<b>A</b></span><span class="url">${SITE}</span></div>
           <span class="chev-btn">${ic('share', 'sm')}</span>
         </div>
         <div class="home-ind"><span></span></div>`;
    }
    fit();
  }

  /* ================= Flow =================
     A: allow and check are screens of their own, so the practice itself is 3 steps.
     B: the same screens, numbered into one run of 5. */
  const STEPNO = {
    A:{orient:1, start:2, talk:3},
    B:{intro:1, blocked:1, check:2, orient:3, start:4, talk:5}
  };
  const TOTAL = {A:3, B:5};
  const stepOf = st => STEPNO[S.variant][st] || null;

  const CAMS = ['Front camera', 'Back camera'];
  const MICS = ['Phone microphone', 'AirPods Pro', 'Wired headset'];
  const WAIT_LABELS = ['Email verified', 'Loading your assessment', 'Preparing a practice question'];
  const QUESTION = 'Tell us about a project you’re proud of and what you learned from it.';

  const S = {
    state:'wait', variant:'A', platform:'android',
    dialog:null,                 // 'site' | 'os-cam' | 'os-mic' — the browser's own UI
    osGranted:false,             // whether Chrome already holds Android's camera/mic permission
    permMode:'ask', voiceMode:'heard', loadMode:'ok',
    permitted:false, blockedReason:'denied', inuseCleared:false,
    heard:false, micFailed:false, hidePreview:false, qOpen:false, alvyOpen:false,
    recSecs:0, cam:0, mic:0, count:5, waitItems:['done', 'act', 'pend'],
    stream:null, audioCtx:null, analyser:null, abuf:null, level:0, realFailed:false
  };

  let timers = [], intervals = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const every = (fn, ms) => intervals.push(setInterval(fn, ms));
  const clearTimers = () => { timers.forEach(clearTimeout); intervals.forEach(clearInterval); timers = []; intervals = []; };
  const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

  const isLive = () => S.state === 'talk';
  const camScreen = () => ['check', 'start', 'talk'].includes(S.state);
  const showPreview = () => camScreen() && S.permitted && !(isLive() && S.hidePreview);

  function go(next){
    clearTimers();
    S.state = next;
    S.heard = false;
    S.micFailed = false;
    S.qOpen = false;
    S.dialog = null;
    if (next === 'wait') S.waitItems = ['done', 'act', 'pend'];
    if (next === 'start'){ S.recSecs = 0; S.hidePreview = false; }
    if (['wait', 'waitError', 'intro', 'blocked', 'done', 'countdown', 'assessment'].includes(next)) stopStream();
    if (next === 'countdown') S.count = 5;
    render();
    enter(next);
  }

  function enter(st){
    if (st === 'wait'){
      // Prototype stand-in: production drives these from real loading milestones.
      later(() => {
        if (S.loadMode === 'fail'){ S.waitItems = ['done', 'fail', 'pend']; go('waitError'); return; }
        S.waitItems = ['done', 'done', 'act']; renderWaitList();
      }, 1400);
      later(() => { S.waitItems = ['done', 'done', 'done']; renderWaitList(); }, 2600);
      later(() => go('intro'), 3200);
    }
    if (camScreen() && canUseCamera() && !S.stream) acquire().catch(() => {});
    if (st === 'check') startMicCheck();
    if (st === 'talk'){
      every(() => { S.recSecs++; const t = $('recTime'); if (t) t.textContent = fmt(S.recSecs); }, 1000);
      startLevel();
    }
    if (st === 'countdown'){
      every(() => {
        S.count--;
        if (S.count <= 0){ go('assessment'); return; }
        const n = $('countNum'); if (n) n.textContent = S.count;
        restartRing();
      }, 1000);
      restartRing();
    }
  }

  /* ---------- Permission: the priming screen, then the platform's own dialogs ---------- */
  function askPermission(){
    if (S.permMode === 'granted'){ S.permitted = true; return granted(); }
    if (canUseCamera()){
      // A real camera is reachable (the file opened directly in a browser): let the real
      // browser ask, so what the candidate sees is genuinely their own prompt.
      acquire().then(stream => {
        if (!stream || S.state !== 'intro') return;
        S.permitted = true; granted();
      }).catch(err => {
        if (S.state !== 'intro' || err?.stale) return;
        if (err?.fallback){ S.dialog = 'site'; return render(); }
        S.blockedReason = (err.name === 'NotReadableError' || err.name === 'AbortError') ? 'inuse' : 'denied';
        S.permitted = S.blockedReason === 'inuse';
        go('blocked');
      });
      return;
    }
    S.dialog = 'site';
    render();
  }
  // Allow on whichever dialog is up. Chrome asks the OS only once the site itself is
  // allowed, and Android asks for camera and microphone one at a time.
  function dialogAllow(){
    if (S.dialog === 'site'){
      if (S.platform === 'android' && !S.osGranted){ S.dialog = 'os-cam'; return render(); }
      S.dialog = null; S.permitted = true; return granted();
    }
    if (S.dialog === 'os-cam'){ S.dialog = 'os-mic'; return render(); }
    S.dialog = null; S.osGranted = true; S.permitted = true; granted();
  }
  function dialogDeny(){
    const atOS = S.dialog !== 'site';
    S.dialog = null;
    S.permitted = false;
    S.blockedReason = atOS ? 'os' : 'denied';
    go('blocked');
  }
  function granted(){
    if (S.permMode === 'inuse' && !S.inuseCleared){ S.blockedReason = 'inuse'; S.permitted = true; return go('blocked'); }
    go('check');
  }

  /* ---------- Device check ---------- */
  function startMicCheck(){
    startLevel();
    if (S.voiceMode === 'heard' && !S.analyser) later(micOk, 2800);
    later(() => { if (!S.heard) micNone(); }, 7000);
  }
  function micOk(){
    if (S.heard || S.state !== 'check') return;
    S.heard = true; S.micFailed = false;
    paintCheck();
    say('Microphone working. You can continue.');
  }
  function micNone(){
    if (S.heard || S.state !== 'check') return;
    S.micFailed = true;
    paintCheck();
  }
  // Repaint only the panel over the camera, so the preview never flashes.
  function paintCheck(){
    const p = $('camBottom');
    if (!p) return render();
    p.innerHTML = checkPanelHTML();
  }

  function simSpeech(){
    const t = performance.now() / 1000;
    const talking = (Math.sin(t * 1.7) + Math.sin(t * 0.63)) > -0.9;
    return talking ? Math.min(1, 0.25 + 0.75 * Math.abs(Math.sin(t * 10.5 + Math.sin(t * 3.1) * 2))) : 0.03;
  }
  function realLevel(){
    S.analyser.getByteTimeDomainData(S.abuf);
    let sum = 0;
    for (const v of S.abuf){ const d = (v - 128) / 128; sum += d * d; }
    return Math.min(1, Math.sqrt(sum / S.abuf.length) * 5);
  }
  function startLevel(){
    let loud = 0;
    every(() => {
      const lvl = S.voiceMode === 'silent' ? 0 : S.analyser ? realLevel() : simSpeech();
      S.level = lvl;
      if (!S.heard){
        document.querySelectorAll('.meter:not(.done) i').forEach(b => b.style.height = Math.round(3 + lvl * 13 * (0.55 + 0.45 * Math.random())) + 'px');
        if (S.analyser && S.voiceMode === 'heard' && S.state === 'check'){
          loud = lvl > 0.12 ? loud + 80 : Math.max(0, loud - 40);
          if (loud >= 600) micOk();
        }
      }
    }, 80);
  }

  /* ================= Camera ================= */
  const canUseCamera = () => {
    if (S.realFailed || !window.isSecureContext || !navigator.mediaDevices?.getUserMedia) return false;
    const policy = document.permissionsPolicy || document.featurePolicy;
    return policy?.allowsFeature ? policy.allowsFeature('camera') : true;
  };
  let acquireToken = 0;
  function acquire(){
    const tok = ++acquireToken, t0 = performance.now();
    return navigator.mediaDevices.getUserMedia({video:true, audio:true}).then(stream => {
      if (tok !== acquireToken){ stream.getTracks().forEach(t => t.stop()); return null; }
      S.stream = stream;
      setupAudio(stream);
      refreshMedia();
      return stream;
    }, err => {
      if (tok !== acquireToken) throw {stale:true};
      // An instant refusal means this frame cannot use the camera at all (an embedded
      // viewer, say): fall back to the drawn sample preview and the simulated dialogs.
      if ((err.name === 'NotAllowedError' && performance.now() - t0 < 250) || err.name === 'SecurityError' || err.name === 'TypeError'){
        S.realFailed = true;
        throw {fallback:true};
      }
      throw err;
    });
  }
  function setupAudio(stream){
    try {
      if (!stream.getAudioTracks().length) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      S.audioCtx = new AC();

    if (S.platform === 'ios') return `<div class="scrim"><div>
      <div class="dlg-ios" role="dialog" aria-label="Safari permission request">
        <div class="body"><strong>“${SITE}” Would Like to Access the Camera and Microphone</strong></div>
        <div class="acts"><button data-act="deny" type="button">Don’t Allow</button><button data-act="allow" type="button" data-focus>Allow</button></div>
      </div>
      <p class="dlg-note">Simulated. iOS draws this alert, not the page.</p>
    </div></div>`;
    if (S.dialog === 'site') return `<div class="scrim"><div>
      <div class="dlg-site" role="dialog" aria-label="Chrome permission request">
        <div class="ico">${ic('video', 'sm')}${ic('mic', 'sm')}</div>
        <p>${SITE} wants to use your camera and microphone</p>
        <div class="acts"><button data-act="deny" type="button">Block</button><button data-act="allow" type="button" data-focus>Allow</button></div>
      </div>
      <p class="dlg-note">Simulated. Chrome draws this dialog, not the page.</p>
    </div></div>`;
    // Android asks for its own permissions after the site is allowed, one device at a time.
    const cam = S.dialog === 'os-cam';
    return `<div class="scrim"><div>
      <div class="dlg-os" role="dialog" aria-label="Android permission request">
        <div class="ico">${ic(cam ? 'video' : 'mic')}</div>
        <p>Allow <b>Chrome</b> to ${cam ? 'take pictures and record video' : 'record audio'}?</p>
        <div class="acts">
          <button data-act="allow" type="button" data-focus>While using the app</button>
          <button data-act="allow" type="button">Only this time</button>
          <button data-act="deny" type="button">Don’t allow</button>
        </div>
      </div>
      <p class="dlg-note">Simulated. Android draws this one — it comes after the site is allowed.</p>
    </div></div>`;
  }

  /* ================= Render ================= */
  let announcer = null;
  function say(msg){
    if (!announcer){
      announcer = document.createElement('div');
      announcer.className = 'sr-only';
      announcer.setAttribute('role', 'status');
      document.body.append(announcer);
    }
    announcer.textContent = '';
    later(() => { announcer.textContent = msg; }, 60);
  }

  function screenHTML(){
    switch (S.state){
      case 'wait': case 'waitError': return waitScreen();
      case 'intro': return introScreen();
      case 'blocked': return blockedScreen();
      case 'orient': return questionScreen();
      case 'done': return doneScreen();
      case 'countdown': return countdownScreen();
      case 'assessment': return assessmentScreen();
      default: return camScreenHTML();
    }
  }

  function render(){
    updateProto();
    view.innerHTML = screenHTML() + (S.qOpen ? qsheetHTML() : '') + (S.dialog ? dialogHTML() : '');
    attachMedia();
    view.querySelector('[data-focus]')?.focus({preventScroll:true});
  }

  /* ================= Events ================= */
  phone.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    switch (b.dataset.act){
      case 'reload': location.reload(); break;
      case 'alvy': openAlvy(); break;
      case 'alvy-close': closeAlvy(); break;
      case 'help': helpFlow(b.dataset.topic); break;
      case 'ask': askPermission(); break;
      case 'allow': dialogAllow(); break;
      case 'deny': dialogDeny(); break;
      case 'retry': S.inuseCleared = true; S.permitted = false; go('intro'); break;
      case 'to-question': if (S.heard) go('orient'); break;
      case 'to-start': go('start'); break;
      case 'start-rec': go('talk'); break;
      case 'stop': go('done'); break;
      case 'qopen': S.qOpen = true; render(); break;
      // Tapping the scrim closes it; tapping inside the sheet does not.
      case 'qclose':
        if (b.classList.contains('qsheet-wrap') && e.target.closest('.qsheet')) return;
        S.qOpen = false; render(); break;
      case 'hide': S.hidePreview = !S.hidePreview; render(); break;
      case 'again': go('orient'); break;
      case 'begin': go('countdown'); break;
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (S.alvyOpen) closeAlvy();
    else if (S.qOpen){ S.qOpen = false; render(); }
  });
  addEventListener('resize', fit);

  /* ================= Prototype controls ================= */
  const proto = $('proto'), protoToggle = $('protoToggle');
  function setCollapsed(c){ proto.classList.toggle('collapsed', c); protoToggle.textContent = c ? 'Show controls' : 'Hide controls'; protoToggle.setAttribute('aria-expanded', String(!c)); }
  protoToggle.addEventListener('click', () => setCollapsed(!proto.classList.contains('collapsed')));

  // UX-1224 points: 1 page after OTP feels stuck · 2 practice gives no direction · 3 tracker skips a step · 4 10–30s waits
  const TICKET = {
    wait:'#1 + #4: a wait screen with live loading steps replaces the blank page.',
    waitError:'#4: if loading fails, say so and offer Try again instead of an endless spinner.',
    intro:'#2: the ask is explained on its own screen before the browser prompts, so Allow is not a surprise. On Android it warns that two dialogs are coming.',
    blocked:'#2: a blocked or busy camera gets its own screen, with the steps for this phone and a drawing of where to tap.',
    check:'Review feedback: see yourself and test the mic on one screen, the way a video call does, before practising.',
    orient:'#2: the practice question gets a screen of its own, so it is read before anything records.',
    start:'#2: one action per screen. The camera is already live, so starting is the only thing left.',
    talk:'#2 + #3: the mic was checked already, so this screen just records. The question stays one tap away.',
    done:'#3: the practice ends clearly, and says what changes in the real thing.',
    countdown:'#4: a short countdown so the start of the timer is never a surprise.',
    assessment:'End of the flow.'
  };
  const CHIPS = {
    A:[['wait', 'Loading'], ['intro', 'Allow'], ['blocked', 'Blocked'], ['check', 'Device check'], ['orient', '1 Question'], ['start', '2 Ready'], ['talk', '3 Answer'], ['done', 'All set'], ['countdown', 'Countdown']],
    B:[['wait', 'Loading'], ['intro', '1 Allow'], ['blocked', '1 Blocked'], ['check', '2 Check'], ['orient', '3 Question'], ['start', '4 Ready'], ['talk', '5 Answer'], ['done', 'All set'], ['countdown', 'Countdown']]
  };
  let chipsFor = null;
  function updateProto(){
    if (chipsFor !== S.variant){
      chipsFor = S.variant;
      $('jumpChips').innerHTML = CHIPS[S.variant].map(([k, l]) => `<button type="button" data-go="${k}">${l}</button>`).join('');
    }
    $('osGroup').hidden = S.platform !== 'android';
    const tk = $('protoTicket');
    if (tk) tk.innerHTML = `<b>UX-1224</b> ${TICKET[S.state] || ''}`;
    const cur = S.state === 'waitError' ? 'wait' : S.state;
    proto.querySelectorAll('[data-go]').forEach(b => b.dataset.go === cur ? b.setAttribute('aria-current', 'step') : b.removeAttribute('aria-current'));
    proto.querySelectorAll('[data-set]').forEach(b => {
      const v = b.dataset.set === 'osGranted' ? (S.osGranted ? 'yes' : 'no') : S[b.dataset.set];
      b.setAttribute('aria-pressed', String(v === b.dataset.val));
    });
  }

  function jump(st){
    S.inuseCleared = false;
    if (['check', 'start', 'talk'].includes(st)) S.permitted = true;
    else if (['wait', 'intro'].includes(st)) S.permitted = false;
    if (st === 'blocked'){
      S.permitted = S.permMode === 'inuse';
      S.blockedReason = S.permMode === 'inuse' ? 'inuse' : 'denied';
    }
    go(st);
  }

  proto.addEventListener('click', e => {
    const g = e.target.closest('[data-go]');
    if (g) return jump(g.dataset.go);
    const s = e.target.closest('[data-set]');
    if (!s) return;
    const key = s.dataset.set;
    if (key === 'osGranted') S.osGranted = s.dataset.val === 'yes';
    else S[key] = s.dataset.val;
    if (key === 'platform'){ renderChrome(); render(); return; }
    if (key === 'variant'){ S.permitted = false; updateProto(); return go('intro'); }
    if (key === 'permMode'){ S.permitted = false; S.inuseCleared = false; }
    if (key === 'voiceMode' && s.dataset.val === 'heard' && S.state === 'check') later(micOk, 600);
    updateProto();
  });

  renderChrome();
  go('wait');
})();
</script>
